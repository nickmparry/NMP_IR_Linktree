      <tr><td>Expected survival</td><td>&gt;3 months — SEMS more cost-effective and reduces need for repeat intervention over a longer expected life course</td><td>&lt;3 months, or diagnosis/prognosis still being established — avoids committing to a harder-to-remove device before the treatment plan is finalised</td></tr>
      <tr><td>Candidacy for future resection</td><td>Unresectable/palliative disease confirmed</td><td>Potentially resectable disease where a plastic stent (more easily removed/does not complicate the surgical field to the same degree) may be preferred as a bridge to surgery, per surgical team preference</td></tr>
      <tr><td>Cost/reintervention burden</td><td>Fewer exchanges needed over time given longer patency — preferred once the palliative, longer-term nature of treatment is established</td><td>Lower individual cost but more frequent exchange required</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Hilar vs Distal Obstruction — Drainage Strategy</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Location</th><th>Drainage Consideration</th></tr>
      <tr><td><strong>Distal</strong> (common bile duct, below the cystic duct/hilar confluence)</td><td>A single stent typically drains the entire liver given the obstruction is below the confluence of the right and left hepatic duct systems — technically simpler; ERCP-first approach usually feasible given direct endoscopic access to the distal duct</td></tr>
      <tr><td><strong>Hilar</strong> (at or involving the confluence — see Bismuth-Corlette classification, dm-cca)</td><td>Drainage strategy depends on Bismuth-Corlette type — unilateral drainage of the dominant/larger functional liver volume may suffice for Bismuth I-II; bilateral drainage often required for Bismuth III-IV to achieve adequate jaundice resolution, given separate, non-communicating right and left duct systems above the level of obstruction (see dm-cca for the full decision algorithm)</td></tr>
    </table></div>
    <div class="tip">The fundamental principle distinguishing hilar from distal biliary drainage is that a distal obstruction affects a single, still-confluent duct system below the point where right and left systems join, whereas a hilar obstruction often separates the right and left duct systems from each other — meaning what drains one side does not necessarily drain the other, directly driving the unilateral vs bilateral drainage decision (see dm-cca for full detail on this decision-making process).</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Unilateral vs Bilateral Stenting — Technical Approach</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Configuration</th><th>Technique</th><th>Consideration</th></tr>
      <tr><td>Unilateral SEMS</td><td>Single stent placed across the dominant obstructed duct, typically the side selected based on which delivers greater functional liver volume drainage (assessed on pre-procedure cross-sectional imaging volumetry) or based on which side was successfully accessed/opacified</td><td>Simpler, faster, lower complication risk than bilateral; adequate for Bismuth I-II and selected III where the drained volume is sufficient (generally ≥30% of total liver volume, analogous to the CCA drainage adequacy principle — see dm-cca)</td></tr>
      <tr><td>Bilateral SEMS — Y-configuration (kissing stents)</td><td>Two stents placed side-by-side through a single access, both extending from their respective hepatic ducts down through the confluence and distal duct in parallel</td><td>Requires wide distal duct/sphincter to accommodate both stents in parallel; commonly used technique for bilateral hilar drainage</td></tr>
      <tr><td>Bilateral SEMS — T/stent-in-stent configuration</td><td>A first stent placed across one system, with a second stent passed through the mesh interstices of the first stent into the contralateral system</td><td>Requires a large-cell mesh design on the first stent to allow passage of the second stent's delivery system through its interstices</td></tr>
    </table></div>
    <div class="warn">Bilateral hilar stenting is technically more demanding and carries a higher procedural complexity and cholangitis risk than unilateral drainage — the decision to pursue bilateral drainage should be based on genuine need (Bismuth III-IV anatomy, inadequate functional volume drained by unilateral stenting) rather than performed routinely, per the drainage adequacy principles outlined in dm-cca.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Photodynamic Therapy — Role</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Mechanism</td><td>A photosensitising agent (e.g. porfimer sodium) is administered systemically and preferentially accumulates in tumour tissue; a laser catheter is then passed intraductally (via cholangioscopy or fluoroscopically-guided percutaneous/endoscopic catheter placement) to deliver light at the specific wavelength that activates the photosensitiser, generating reactive oxygen species that cause localised tumour cell death</td></tr>
      <tr><td>Indication</td><td>Adjunct to biliary stenting in unresectable hilar cholangiocarcinoma — aims to reduce intraductal tumour bulk/ingrowth and extend stent patency, alongside a possible survival benefit demonstrated in early trial data (Ortner 2003 — see dm-cca)</td></tr>
      <tr><td>Combination with drainage</td><td>Performed at the time of initial stenting or at subsequent stent revision, rather than as a standalone treatment — always combined with mechanical biliary decompression (stenting) since PDT does not itself relieve obstruction</td></tr>
      <tr><td>Adoption</td><td>Used selectively in specialist hepatobiliary/IR centres rather than universally adopted — availability of the photosensitiser and laser catheter systems, along with the need for coordinated multidisciplinary delivery, limits widespread use compared to standard stenting alone</td></tr>
      <tr><td>Photosensitivity precaution</td><td>Patients receiving systemic photosensitiser must avoid direct sunlight/bright light exposure for a period (typically several weeks) following administration given prolonged systemic photosensitisation risk (skin burns with light exposure)</td></tr>
    </table></div>
    <div class="tip">Photodynamic therapy for hilar cholangiocarcinoma is a good example of a locoregional IO technique adopted from the same underlying principle as ablation and embolisation — targeting the tumour more selectively than systemic therapy alone — but applied intraductally as an adjunct to, rather than a replacement for, mechanical biliary drainage.</div>
  </div>
</div>

  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Concept</td><td>Focal therapy treats only the clinically significant tumour focus (index lesion) within the prostate, rather than treating the whole gland (as with radical prostatectomy or whole-gland radiotherapy) — aims to reduce treatment-related morbidity (erectile dysfunction, incontinence) while achieving oncological control of the dominant, clinically significant cancer</td></tr>
      <tr><td>Patient selection</td><td>Localised, low-to-intermediate risk prostate cancer with a single, well-defined dominant lesion on multiparametric MRI, confirmed by MRI-targeted biopsy; not appropriate for high-risk, multifocal, or diffusely distributed disease</td></tr>
      <tr><td>MRI-US fusion technique</td><td>Pre-procedure multiparametric MRI identifies and maps the target lesion; during the procedure, real-time transrectal ultrasound images are electronically co-registered ("fused") with the pre-acquired MRI dataset, allowing the treating device (ablation probe) to be accurately guided to the MRI-defined target lesion under live ultrasound visualisation</td></tr>
      <tr><td>IR-adjacent role</td><td>Focal therapy for prostate cancer is predominantly performed by urology (often with radiology/IR input for the imaging fusion and image-guidance component) — IR's most established, dedicated procedural role in prostate disease remains prostate artery embolisation for BPH (see below and b-pae), with focal therapy representing an adjacent but distinct discipline that IR trainees should understand conceptually</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> HIFU vs Cryoablation vs IRE</div>

      <tr><td><strong>High-Intensity Focused Ultrasound (HIFU)</strong></td><td>Focused ultrasound energy delivered transrectally, converging at a focal point within the prostate to generate intense localised heating and coagulative necrosis, without requiring a percutaneous probe</td><td>Non-invasive delivery (no needle/probe placed into the gland itself — energy delivered transrectally); real-time MRI or ultrasound monitoring during treatment; established focal and whole-gland treatment option in several countries</td></tr>

      <tr><td><strong>Irreversible Electroporation (IRE, "NanoKnife")</strong></td><td>High-voltage, short-duration electrical pulses delivered between percutaneously placed electrodes create irreversible nanopores in the cell membrane, causing cell death via a non-thermal mechanism (apoptosis-predominant rather than coagulative necrosis)</td><td>Non-thermal mechanism is a specific advantage near heat/cold-sensitive critical structures (urethra, neurovascular bundles) since it spares the underlying collagenous/connective tissue architecture (blood vessels, nerves, urethral wall) relatively better than thermal ablation while still killing cellular elements within the treatment zone — of particular interest for nerve-sparing focal therapy given proximity to the neurovascular bundles responsible for erectile function</td></tr>

    <div class="tip">IRE's non-thermal mechanism is often highlighted as a specific advantage for prostate focal therapy given the gland's close anatomical proximity to structures where thermal injury carries a high morbidity cost (the neurovascular bundles responsible for erectile function, and the urethra) — its structural tissue-sparing property theoretically allows more precise treatment margins near these critical structures than heat- or cold-based methods, though comparative long-term oncological outcome data across all three modalities continues to evolve.</div>

  <div class="card-body">
    <p>See b-pae for the complete technical detail on prostate artery embolisation. The key distinction for this section is conceptual: PAE is a treatment for <strong>benign prostatic hyperplasia (BPH)</strong> causing lower urinary tract symptoms — it is not a cancer treatment, and reduces symptomatic obstruction via transarterial devascularisation/shrinkage of benign hyperplastic tissue, in contrast to the focal ablative techniques above which are directed specifically at treating malignant tissue.</p>

</div>
