<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Fellowship Reference</title>
<meta name="color-scheme" content="dark" />
<style>
:root {
  --navy: #151d2b;
  --navy-light: #1e2a3a;
  --navy-mid: #2a3a4e;
  --teal: #0d9488;
  --teal-light: #14b8a6;
  --teal-bg: #0d94880d;
  --amber: #d97706;
  --red: #dc2626;
  --red-bg: #dc26260a;
  --green: #16a34a;
  --green-bg: #16a34a0a;
  --bg: #0e1015;
  --card: #161920;
  --text: #e2e4e9;
  --text-secondary: #8b93a1;
  --border: #2a2e38;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 15px;
}

/* NAV SIDEBAR */
.sidebar {
  position: fixed; top:0; left:0; bottom:0;
  width: 280px;
  background: var(--navy);
  color: #cbd5e1;
  overflow-y: auto;
  z-index: 100;
  transition: transform .25s;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--navy-mid);
  flex-shrink: 0;
}
.sidebar-header h1 {
  font-size: 18px; font-weight: 700; color: #f1f5f9;
  letter-spacing: -0.3px;
}
.sidebar-header .subtitle {
  font-size: 11px; color: var(--teal-light);
  text-transform: uppercase; letter-spacing: 1.2px;
  margin-top: 4px;
}
.search-box {
  padding: 12px 20px; flex-shrink:0;
}
.search-box input {
  width:100%; padding: 8px 12px;
  background: var(--navy-light);
  border: 1px solid var(--navy-mid);
  border-radius: 6px;
  color: #f1f5f9; font-size: 13px;
  outline: none;
}
.search-box input::placeholder { color: #64748b; }
.search-box input:focus { border-color: var(--teal); }

.nav-content { flex:1; overflow-y:auto; padding-bottom:20px; }

.nav-section {
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.nav-section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px;
  cursor: pointer;
  font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .8px;
  color: #94a3b8;
  user-select: none;
}
.nav-section-header:hover { color: #e2e8f0; }
.nav-section-header .arrow {
  font-size: 10px; transition: transform .2s;
  flex-shrink:0;
}
.nav-section-header.open .arrow { transform: rotate(90deg); }
.nav-section-header .badge {
  margin-left: auto;
  background: var(--navy-mid);
  padding: 1px 7px; border-radius: 10px;
  font-size: 10px; color: #64748b;
}

.nav-items { display:none; padding: 0 0 6px; }
.nav-section-header.open + .nav-items { display:block; }

.nav-item {
  display: block;
  padding: 6px 20px 6px 32px;
  font-size: 13px; color: #94a3b8;
  cursor: pointer; text-decoration: none;
  border-left: 2px solid transparent;
  transition: all .15s;
}
.nav-item:hover { color: #e2e8f0; background: rgba(255,255,255,.04); }
.nav-item.active {
  color: var(--teal-light);
  border-left-color: var(--teal);
  background: rgba(13,148,136,.08);
}
.nav-item .freq {
  display: inline-block; width:8px; height:8px;
  border-radius: 50%; margin-right: 6px; flex-shrink:0;
  vertical-align: middle;
}
.freq-high { background: var(--green); }
.freq-med { background: var(--amber); }
.freq-low { background: var(--red); }

/* MAIN CONTENT */
.main {
  margin-left: 280px;
  min-height: 100vh;
}
.topbar {
  display: none;
  position: sticky; top:0; z-index:90;
  background: var(--navy);
  padding: 12px 16px;
  align-items: center; gap:12px;
}
.menu-btn {
  background:none; border:none; color:#f1f5f9;
  font-size:22px; cursor:pointer; padding:4px;
}
.topbar-title { color:#f1f5f9; font-size:15px; font-weight:600; }

.content-area {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 40px;
}

/* CARDS AND CONTENT */
.page-title {
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.page-meta {
  font-size: 13px; color: var(--text-secondary);
  margin-bottom: 28px;
  display: flex; gap: 16px; flex-wrap:wrap;
}
.page-meta .tag {
  padding: 2px 10px; border-radius:12px;
  font-size: 11px; font-weight:600;
  text-transform: uppercase; letter-spacing:.5px;
}
.tag-anatomy { background: #dbeafe; color:#1d4ed8; }
.tag-crosscut { background: #3a2c0f; color:#f5c76b; }
.tag-freq-high { background: #dcfce7; color:#166534; }
.tag-freq-med { background: #332b0f; color:#e8c44a; }
.tag-section { background: #1e2230; color:#8b93a1; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}
.card-header {
  padding: 16px 20px;
  font-size: 15px; font-weight: 650;
  cursor: pointer;
  display: flex; align-items:center; gap:10px;
  user-select:none;
  border-bottom: 1px solid transparent;
}
.card-header:hover { background: #1c2028; }
.card-header.open { border-bottom-color: var(--border); }
.card-header .icon { font-size:13px; transition: transform .2s; color: var(--text-secondary); }
.card-header.open .icon { transform: rotate(90deg); }
.card-body { display:none; padding: 16px 20px; }
.card-header.open + .card-body { display:block; }

.card-body h4 {
  font-size: 14px; font-weight: 650;
  margin: 16px 0 8px;
  color: var(--teal);
}
.card-body h4:first-child { margin-top:0; }
.card-body p { margin-bottom: 10px; font-size:14px; }
.card-body ul, .card-body ol {
  margin: 6px 0 12px 20px; font-size:14px;
}
.card-body li { margin-bottom: 4px; }
.card-body .table-scroll {
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  margin: 10px 0 14px;
}
.card-body table {
  width:100%; border-collapse:collapse;
  font-size:13px; font-family:var(--font);
}
.card-body th, .card-body td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align:left;
}
.card-body th {
  background: #1c2028; font-weight:600;
  font-size: 12px; text-transform:uppercase;
  letter-spacing:.3px;
}
.card-body .warn {
  background: #2a1414; border-left:3px solid var(--red);
  padding: 10px 14px; margin: 10px 0;
  font-size:13px; border-radius:0 6px 6px 0;
}
.card-body .tip {
  background: var(--teal-bg); border-left:3px solid var(--teal);
  padding: 10px 14px; margin: 10px 0;
  font-size:13px; border-radius:0 6px 6px 0;
}
.card-body .dose {
  font-family: var(--mono); font-size:13px;
  background: #1e2230; padding: 2px 6px;
  border-radius: 3px;
}

/* WELCOME PAGE */
.welcome { text-align:center; padding: 60px 20px; }
.welcome h2 { font-size:32px; font-weight:700; margin-bottom:10px; }
.welcome p { color:var(--text-secondary); max-width:500px; margin:0 auto 30px; }
.section-grid {
  display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap:14px; text-align:left;
}
.section-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:18px;
  cursor:pointer; transition: all .15s;
}
.section-card:hover { border-color:var(--teal); transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.3); }
.section-card .sc-label {
  font-size:11px; font-weight:700; color:var(--teal);
  text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px;
}
.section-card .sc-title { font-size:15px; font-weight:650; margin-bottom:4px; }
.section-card .sc-desc { font-size:12px; color:var(--text-secondary); }

/* OVERLAY */
.overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.5); z-index:99;
}

/* MOBILE */
@media(max-width:768px) {
  .sidebar { transform:translateX(-100%); width:85vw; max-width:320px; }
  .sidebar.open { transform:translateX(0); }
  .overlay.open { display:block; }
  .main { margin-left:0; }
  .topbar { display:flex; }
  .content-area { padding: 20px 16px; }
  .page-title { font-size:22px; }
}

/* SCROLLBAR */
.sidebar::-webkit-scrollbar { width:6px; }
.sidebar::-webkit-scrollbar-track { background:transparent; }
.sidebar::-webkit-scrollbar-thumb { background:var(--navy-mid); border-radius:3px; }

.hidden { display:none !important; }

/* Procedure template placeholder */
.placeholder-msg {
  text-align:center; padding:40px 20px;
  color:var(--text-secondary); font-style:italic;
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>IR Reference</h1>
    <div class="subtitle">EBIR 3rd Edition</div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search topics…" oninput="filterNav(this.value)">
  </div>
  <div class="nav-content" id="navContent"></div>
</nav>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="topbar-title">IR Reference</span>
  </div>
  <div class="content-area" id="contentArea"></div>
</div>

<script>

    {id:'dm-crlm',       title:'Colorectal Liver Mets (CRLM)',        freq:'high'},
    {id:'dm-net',        title:'NET Liver Mets',                      freq:'med'},
    {id:'dm-cca',        title:'Cholangiocarcinoma',                  freq:'high'},
    {id:'dm-pad',        title:'PAD — Claudication to CLTI Pathway',  freq:'high'},
    {id:'dm-ali',        title:'Acute Limb Ischaemia',                freq:'high'},
    {id:'dm-aaa',        title:'AAA/TAA — Surveillance & EVAR',       freq:'high'},
    {id:'dm-rcc',        title:'Renal Cell Carcinoma — Small Mass',   freq:'med'},

    {id:'dm-vte',         title:'DVT/PE & Venous Thromboembolism',    freq:'high'},

// ─── BUILD NAV ───
function buildNav() {
  const cont = document.getElementById('navContent');
  cont.innerHTML = '';
  NAV.forEach(sec => {
    if (sec.id === 'home') {
      const item = document.createElement('a');
      item.className = 'nav-item active';
      item.textContent = '⬡ Home';
      item.dataset.page = 'home';
      item.onclick = () => showPage('home');
      cont.appendChild(item);
      return;
    }
    const div = document.createElement('div');
    div.className = 'nav-section';
    div.dataset.section = sec.id;
    const hdr = document.createElement('div');
    hdr.className = 'nav-section-header';
    hdr.innerHTML = `<span class="arrow">▶</span> ${sec.label} <span class="badge">${sec.items.length}</span>`;
    hdr.onclick = () => {
      if (hdr.classList.contains('open')) {
        hdr.classList.remove('open');
      } else {
        showDirectory(sec.id);
      }
    };
    div.appendChild(hdr);
    const items = document.createElement('div');
    items.className = 'nav-items';
    sec.items.forEach(it => {
      const a = document.createElement('a');
      a.className = 'nav-item';
      a.dataset.page = it.id;
      a.innerHTML = `<span class="freq freq-${it.freq==='high'?'high':it.freq==='med'?'med':'low'}"></span>${it.title}`;
      a.onclick = () => showPage(it.id);
      items.appendChild(a);
    });
    div.appendChild(items);
    cont.appendChild(div);
  });
}

// ─── FILTER NAV ───
function filterNav(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.nav-section').forEach(sec => {
    let any = false;
    sec.querySelectorAll('.nav-item').forEach(it => {
      const match = !q || it.textContent.toLowerCase().includes(q);
      it.classList.toggle('hidden', !match);
      if (match) any = true;
    });
    sec.classList.toggle('hidden', !any);
    if (q && any) sec.querySelector('.nav-section-header').classList.add('open');
  });
}

// ─── SIDEBAR MOBILE ───
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ─── SHOW PAGE ───
function showPage(id) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.page===id));
  // open parent section
  document.querySelectorAll('.nav-section').forEach(sec => {
    if(sec.querySelector(`[data-page="${id}"]`)) {
      sec.querySelector('.nav-section-header').classList.add('open');
    }
  });
  const area = document.getElementById('contentArea');
  if (PAGES[id]) {
    area.innerHTML = PAGES[id];
  } else {
    area.innerHTML = `<div class="placeholder-msg">
      <p style="font-size:48px;margin-bottom:16px;">🔧</p>
      <p style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;">Coming Soon</p>
      <p>This procedure page is scaffolded and ready for content.<br>Feed it in by topic to build out.</p>
    </div>`;
  }
  // wire up collapsible cards
  area.querySelectorAll('.card-header').forEach(h => {
    h.onclick = () => h.classList.toggle('open');
  });
  closeSidebar();
  window.scrollTo(0,0);
}

// ─── SHOW DIRECTORY (section landing page — lists topics, doesn't jump to the first one) ───
function showDirectory(sectionId) {
  const sec = NAV.find(s => s.id === sectionId);
  if (!sec) return;
  document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.nav-section').forEach(s => {
    const hdr = s.querySelector('.nav-section-header');
    if (!hdr) return;
    hdr.classList.toggle('open', s.dataset.section === sectionId);
  });
  const freqLabel = f => f==='high' ? 'Frequently Tested' : f==='med' ? 'Commonly Tested' : 'Rarely Tested';
  const cards = sec.items.map(it => `
    <div class="section-card" onclick="showPage('${it.id}')">
      <div class="sc-label"><span class="freq freq-${it.freq}" style="display:inline-block;vertical-align:middle;margin-right:5px;"></span>${freqLabel(it.freq)}</div>
      <div class="sc-title">${it.title}</div>
    </div>
  `).join('');
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="welcome">
      <h2>${sec.label}</h2>
      <p>${sec.items.length} topic${sec.items.length===1?'':'s'} in this section. Select one below.</p>
      <div class="section-grid">${cards}</div>
    </div>
  `;
  closeSidebar();
  window.scrollTo(0,0);
}

// ─── PAGE CONTENT ───
const PAGES = {};

// HOME
PAGES['home'] = `
<div class="welcome">
  <h2>IR Fellowship Reference</h2>

      <li>Bronchial arteries are the dominant source of massive haemoptysis (~90% of cases) — bronchial artery embolisation is first-line treatment</li>
    </ul>
    <h4>Anterior Spinal Artery — Origin & Non-Target Risk</h4>
    <ul>
      <li>The anterior spinal artery is supplied segmentally by radiculomedullary branches of intercostal, bronchial, and lumbar arteries — the largest contributor is the artery of Adamkiewicz (see Aorta section)</li>
      <li>A radiculomedullary branch may arise from the <strong>same intercostal or bronchial artery</strong> being targeted for embolisation — the "hairpin" or comma-shaped vessel sign on angiography indicates a spinal artery branch</li>

      <li>Brachial veins (paired) accompany the brachial artery, join basilic vein to form axillary vein</li>
      <li>Axillary vein → subclavian vein (crosses over first rib, anterior to anterior scalene) → brachiocephalic vein → SVC</li>

      <tr><th>Configuration</th><th>Anastomosis</th><th>Notes</th></tr>
      <tr><td>Radiocephalic (Brescia-Cimino)</td><td>Radial artery to cephalic vein at wrist</td><td>Most distal, preserves proximal vessels for future access; lowest flow, longer maturation</td></tr>
      <tr><td>Brachiocephalic</td><td>Brachial artery to cephalic vein at elbow</td><td>Higher flow, more reliable maturation; more proximal — fewer future options if it fails</td></tr>
      <tr><td>Brachiobasilic (transposed)</td><td>Brachial artery to basilic vein, vein surgically transposed superficially</td><td>Used when cephalic vein unsuitable; two-stage procedure; deep basilic vein needs superficialisation</td></tr>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TIPS-Relevant Hepatic & Portal Venous Anatomy</div>
  <div class="card-body">
    <p>The TIPS trajectory connects a hepatic vein to an intrahepatic portal vein branch through hepatic parenchyma, creating a shunt that decompresses portal pressure directly into the systemic (caval) circulation.</p>
    <div class="table-scroll"><table>
      <tr><th>Approach</th><th>Detail</th></tr>
      <tr><td>Standard access route</td><td><strong>Right hepatic vein to right portal vein</strong> — most common, most direct trajectory; right portal vein runs more horizontally, giving a favourable needle angle from the right hepatic vein</td></tr>

      <tr><td>Needle trajectory</td><td>Anterior and caudal from the hepatic vein, aiming toward the portal vein bifurcation — wedged hepatic venogram (CO2 or contrast) is used to opacify the portal vein indirectly via the sinusoids and confirm target position before puncture</td></tr>
      <tr><td>Caudate lobe consideration</td><td>The caudate lobe (segment I) has independent venous drainage directly into the IVC — not part of the standard TIPS trajectory but relevant when hepatic vein anatomy is distorted (e.g. Budd-Chiari, where caudate hypertrophy is common)</td></tr>
    </table></div>

  </div>
</div>
`;

<div class="card">

  <div class="card-body">
    <h4>Risk Factors for Contrast Reactions</h4>
    <ul>
      <li>Previous contrast reaction (5× increased risk)</li>
      <li>Asthma (particularly if poorly controlled)</li>
      <li>Atopic history (minor increased risk)</li>

      <li>Use low-osmolar or iso-osmolar non-ionic contrast</li>
    </ul>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> ALARA Principles</div>
  <div class="card-body">
    <p><strong>As Low As Reasonably Achievable</strong> — balancing image quality with dose reduction.</p>
    <h4>Practical ALARA Measures</h4>
    <ul>
      <li><strong>Time:</strong> minimize fluoroscopy time; use last-image-hold; pulsed fluoroscopy (lowest acceptable pulse rate)</li>
      <li><strong>Distance:</strong> inverse square law — doubling distance from source reduces dose by 4×</li>
      <li><strong>Shielding:</strong> lead aprons (0.5mm Pb equivalent), thyroid shields, lead glasses, ceiling-mounted shields, table-side drapes</li>
      <li><strong>Collimation:</strong> cone down to area of interest — reduces scatter and patient dose</li>
      <li><strong>Geometry:</strong> minimize source-to-skin distance; maximize image-receptor distance; keep II/flat panel close to patient</li>
      <li>Avoid magnification mode unless necessary (increases dose rate)</li>
      <li>Avoid steep oblique angles (increases tissue path length → more dose)</li>
      <li>Remove anti-scatter grid for small patients/paediatrics</li>
    </ul>
  </div>
</div>

<div class="card">

    <p>The <strong>Rogers v Whitaker</strong> standard: a doctor must disclose risks that a <em>reasonable patient</em> in the patient's position would want to know, not just what a reasonable doctor would disclose. Material risk = risk a reasonable person in the patient's position would attach significance to.</p>

      <tr><td><strong>IIb — Immediately threatened</strong></td><td>Salvageable with immediate treatment</td><td>More than toes</td><td>Mild/moderate</td><td>Inaudible / Audible</td><td>Emergency revascularisation (OR or hybrid); CDT if &lt;14 days and IIa; IIb → surgery preferred</td></tr>

    <h4>CDT vs Surgical Thrombectomy</h4>
    <ul>

PAGES['cls-endoleak'] = `
<h2 class="page-title">Endoleak Classification — EVAR/TEVAR</h2>
<div class="page-meta"><span class="tag tag-section">Classification</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Types & Management</div>
  <div class="card-body">
    <p>An <strong>endoleak</strong> is persistent blood flow in the aneurysm sac outside the graft lumen after EVAR/TEVAR. The type determines urgency and treatment strategy.</p>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Source</th><th>Management</th><th>Urgency</th></tr>
      <tr><td><strong>Ia</strong></td><td>Proximal attachment zone leak (graft-neck interface)</td><td>Endovascular extension (Palmaz stent, proximal cuff, FEVAR); rarely open conversion</td><td>High — sac pressurised at systemic pressure</td></tr>
      <tr><td><strong>Ib</strong></td><td>Distal attachment zone leak (iliac)</td><td>Iliac limb extension; embolization of hypogastric if needed</td><td>High</td></tr>
      <tr><td><strong>Ic</strong></td><td>Iliac occluder/plug leak</td><td>Re-occlude or extend</td><td>High</td></tr>
      <tr><td><strong>II</strong></td><td>Retrograde flow from branch vessel (IMA, lumbar arteries)</td><td>Watchful waiting if sac stable/shrinking; treat if sac enlarging (&gt;5mm growth): coil embolization via inferior mesenteric or lumbar artery (transarterial or translumbar)</td><td>Lower — often self-limited</td></tr>
      <tr><td><strong>III</strong></td><td>Graft fabric defect or junction separation between modular components</td><td>Graft relining (endovascular); emergent in symptomatic cases</td><td>High — direct sac pressurisation</td></tr>
      <tr><td><strong>IV</strong></td><td>Graft porosity (seen within 30 days, thin graft fabric)</td><td>Observation — usually resolves as graft becomes endothelialised</td><td>Low</td></tr>
      <tr><td><strong>V (Endotension)</strong></td><td>Sac expansion without visible endoleak on imaging</td><td>Investigate with duplex/contrast-enhanced ultrasound; consider ultrasound-triggered CT; may need relining if expanding</td><td>Variable</td></tr>
    </table></div>
    <h4>Surveillance Protocol (Australian/ESVS Guidelines)</h4>
    <ul>
      <li>CT angiogram at 1 month, 12 months, then annually (or duplex-based protocol to reduce radiation)</li>
      <li>Sac shrinkage ≥5 mm = success; &lt;5 mm growth = acceptable; &gt;5 mm growth = intervention threshold</li>
      <li>Type II endoleak: treat only if sac enlarging — spontaneous resolution in ~50%</li>
    </ul>
    <div class="tip">Type I and III endoleaks are high-pressure and must be treated promptly. Type II is the most common (~20% of EVAR); most benign but requires close surveillance.</div>
  </div>
</div>
`;

<div class="page-meta"><span class="tag tag-section">Classification</span><span class="tag tag-freq-high">Frequently Tested</span></div>

      <tr><th>Grade</th><th>Definition</th><th>Examples</th></tr>

      <tr><td><strong>B</strong></td><td>Nominal therapy; observation only; no overnight stay increase</td><td>Puncture site haematoma requiring manual compression; minor contrast reaction managed with antihistamine</td></tr>
      <tr><td><strong>C</strong></td><td>Requires therapy; brief hospitalisation (&lt;48 h)</td><td>Unintended vessel injury managed by embolization during same admission; access site thrombosis requiring thrombolysis</td></tr>
      <tr><td><strong>D</strong></td><td>Major therapy required; unplanned increased level of care; prolonged hospitalisation (&gt;48 h)</td><td>Pseudoaneurysm requiring surgical repair; iatrogenic perforation requiring operative intervention</td></tr>
      <tr><td><strong>E</strong></td><td>Permanent adverse sequelae</td><td>Stroke; paraplegia; renal failure requiring dialysis; limb loss</td></tr>
      <tr><td><strong>F</strong></td><td>Death</td><td>Procedure-related or 30-day mortality</td></tr>
    </table></div>
    <h4>Reporting Requirements (Australian/RANZCR Context)</h4>
    <ul>
      <li>All grade D–F events should be discussed at departmental morbidity & mortality meetings</li>
      <li>Grade E–F events may require SAER (Serious Adverse Event Review) reporting under state health regulations</li>
      <li>Document in procedure report: type of adverse event, recognition, management, outcome</li>

</div>

<h2 class="page-title">Hepatic Arterial Variants — Michel / Hiatt Classification</h2>
<div class="page-meta"><span class="tag tag-section">Anatomy</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Standard Hepatic Arterial Anatomy</div>
  <div class="card-body">
    <p>The "textbook" hepatic arterial anatomy is present in only ~55–60% of the population. Understanding variants is essential for safe hepatic embolisation, TACE, radioembolisation, and liver transplant planning.</p>
    <h4>Standard (Type I) Anatomy</h4>
    <ul>
      <li><strong>Coeliac trunk</strong> (T12/L1) → left gastric artery + splenic artery + <strong>common hepatic artery (CHA)</strong></li>
      <li><strong>CHA</strong> → gastroduodenal artery (GDA) + <strong>proper hepatic artery (PHA)</strong></li>
      <li><strong>PHA</strong> → <strong>right hepatic artery (RHA)</strong> + <strong>left hepatic artery (LHA)</strong></li>
      <li>RHA crosses posterior to common hepatic duct (or anterior in ~25%) in the hepatoduodenal ligament; gives off <strong>cystic artery</strong></li>
      <li>RHA supplies segments V–VIII; LHA supplies segments II–IV; segment I (caudate) dual supply from both</li>
    </ul>
    <div class="tip">At angiography, identify the GDA takeoff as the landmark: the artery continuing hepatad (toward the liver) from the CHA-GDA bifurcation is the proper hepatic artery. The GDA heads caudally toward the duodenum.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Michel Classification (10 Types)</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Description</th><th>Prevalence</th></tr>
      <tr><td><strong>I</strong></td><td>Standard anatomy: CHA → PHA → RHA + LHA (all from coeliac trunk)</td><td>~55%</td></tr>
      <tr><td><strong>II</strong></td><td><strong>Replaced LHA</strong> from left gastric artery (LGA)</td><td>~10%</td></tr>
      <tr><td><strong>III</strong></td><td><strong>Replaced RHA</strong> from SMA</td><td>~11%</td></tr>
      <tr><td><strong>IV</strong></td><td>Replaced LHA from LGA <strong>AND</strong> replaced RHA from SMA (both replaced)</td><td>~1%</td></tr>
      <tr><td><strong>V</strong></td><td><strong>Accessory LHA</strong> from LGA (standard LHA also present)</td><td>~8%</td></tr>
      <tr><td><strong>VI</strong></td><td><strong>Accessory RHA</strong> from SMA (standard RHA also present)</td><td>~7%</td></tr>
      <tr><td><strong>VII</strong></td><td>Accessory LHA from LGA + accessory RHA from SMA (both accessory)</td><td>~1%</td></tr>
      <tr><td><strong>VIII</strong></td><td>Accessory LHA from LGA + replaced RHA from SMA</td><td>~2%</td></tr>
      <tr><td><strong>IX</strong></td><td>CHA arising from SMA (hepatomesenteric trunk)</td><td>~2.5%</td></tr>
      <tr><td><strong>X</strong></td><td>CHA arising directly from aorta</td><td>~2%</td></tr>
    </table></div>
    <div class="warning"><strong>"Replaced"</strong> = the variant artery is the ONLY supply to that lobe (the standard artery is absent). <strong>"Accessory"</strong> = the variant artery is an ADDITIONAL supply (the standard artery is also present). This distinction matters: occluding a replaced artery causes infarction; occluding an accessory artery causes partial ischaemia only.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Hiatt Classification (Simplified, 6 Types)</div>
  <div class="card-body">
    <p>The Hiatt classification simplifies Michel's 10 types into 6 surgically relevant groups, and is widely used in surgical and transplant literature.</p>
    <div class="table-scroll"><table>
      <tr><th>Hiatt Type</th><th>Description</th><th>Michel Equivalent</th><th>Prevalence</th></tr>
      <tr><td><strong>I</strong></td><td>Normal anatomy</td><td>Michel I</td><td>~76%</td></tr>
      <tr><td><strong>II</strong></td><td>Aberrant LHA from LGA (replaced or accessory)</td><td>Michel II, V</td><td>~10%</td></tr>
      <tr><td><strong>III</strong></td><td>Aberrant RHA from SMA (replaced or accessory)</td><td>Michel III, VI</td><td>~11%</td></tr>
      <tr><td><strong>IV</strong></td><td>Aberrant RHA from SMA + aberrant LHA from LGA</td><td>Michel IV, VII, VIII</td><td>~1%</td></tr>
      <tr><td><strong>V</strong></td><td>CHA from SMA (hepatomesenteric trunk)</td><td>Michel IX</td><td>~2%</td></tr>
      <tr><td><strong>VI</strong></td><td>CHA directly from aorta</td><td>Michel X</td><td>~0.5%</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Clinical Implications for IR</div>
  <div class="card-body">
    <h4>Impact on Specific IR Procedures</h4>
    <div class="table-scroll"><table>
      <tr><th>Procedure</th><th>Variant Impact</th><th>What to Do</th></tr>
      <tr><td><strong>TACE / DEB-TACE</strong></td><td>Replaced/accessory RHA from SMA → must catheterise SMA and find the replaced vessel to treat right lobe tumours; coeliac injection alone will miss them</td><td>Always perform coeliac AND SMA angiography before TACE; look for replaced/accessory vessels on pre-procedure CTA</td></tr>
      <tr><td><strong>TARE (Y-90)</strong></td><td>All hepatic arterial supply must be mapped to calculate dosimetry and lung shunt fraction; missed variant → untreated tumour territory or non-target embolisation</td><td>CTA + catheter angiography mapping; coil extrahepatic branches (GDA, right gastric, falciform); identify all hepatic supply</td></tr>
      <tr><td><strong>GI bleeding (GDA embolisation)</strong></td><td>Replaced RHA from SMA crosses posterior to pancreatic head near GDA → can be injured during surgery or mistaken for GDA branch</td><td>Identify replaced RHA before GDA embolisation; avoid occluding it during sandwich technique</td></tr>
      <tr><td><strong>Liver transplant workup</strong></td><td>Variant anatomy affects surgical technique for anastomosis; replaced LHA through gastrohepatic ligament — must be preserved during harvest</td><td>CTA for donor and recipient arterial mapping; communicate variant anatomy to transplant surgeon</td></tr>
      <tr><td><strong>Trauma embolisation</strong></td><td>May need to embolise branches from both coeliac and SMA territories if replaced anatomy; coeliac-only injection may miss right lobe bleed</td><td>If right lobe injury and no RHA visible from coeliac → immediately catheterise SMA to find replaced RHA</td></tr>
    </table></div>
    <h4>How to Identify Variants at Angiography</h4>
    <ul>
      <li><strong>Replaced LHA from LGA:</strong> on coeliac angiogram, the left gastric artery is unusually large with a branch heading toward the liver (segment II/III); no LHA seen arising from PHA</li>
      <li><strong>Replaced RHA from SMA:</strong> on coeliac angiogram, the PHA continues as LHA only with no right hepatic branch; on SMA injection, a large branch heads cephalad toward the liver hilum, passing posterior to the portal vein</li>
      <li><strong>Hepatomesenteric trunk:</strong> coeliac injection shows only LGA + splenic artery (no CHA); SMA injection shows CHA arising from SMA</li>
    </ul>
  </div>
</div>
`;

    <p>The internal iliac artery (IIA, hypogastric artery) supplies the pelvic viscera, pelvic walls, perineum, gluteal region, and medial thigh. Understanding its branch anatomy is essential for pelvic embolisation (trauma, PPH, UAE, PAE), selective catheterisation, and avoiding non-target embolisation.</p>
    <h4>Division</h4>
    <ul>
      <li>The IIA divides into an <strong>anterior division</strong> (visceral + some parietal branches) and a <strong>posterior division</strong> (parietal branches)</li>

      <li>Branching pattern is highly variable — the "textbook" pattern is present in only ~50% of patients</li>

<h2 class="page-title">Core Emergency Procedures</h2>
<div class="page-meta"><span class="tag tag-section">Section A</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Vascular Access — Arterial</div>

      <li><strong>Ultrasound guidance:</strong> now recommended routinely (NICE, CIRSE) — reduces access complications, identifies CFA vs profunda</li>
      <li><strong>Closure:</strong> manual compression ≥15 min (longer if anticoagulated); closure devices (Angioseal, Perclose, Mynx) for ≥6Fr or anticoagulated patients</li>

    <ul>
      <li><strong>Indications:</strong> preferred in obese patients, severe aorto-iliac disease, patients requiring early mobilisation (day-case), anticoagulated patients</li>

      <li><strong>Technique:</strong> 20G needle/angiocath, 0.021" wire, 5–6Fr hydrophilic sheath; cocktail of GTN 200mcg + verapamil 2.5mg IA to prevent spasm</li>

    <ul>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Thoracocentesis</div>
  <div class="card-body">
    <h4>Indications</h4>
    <ul>
      <li>Diagnostic: new unexplained pleural effusion (send LDH, protein, pH, glucose, culture, cytology)</li>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Paracentesis</div>
  <div class="card-body">
    <h4>Indications</h4>
    <ul>

      <tr><td><strong>C</strong></td><td>Multiple stenoses/occlusions totalling &gt;15cm ± calcification; recurrent after two endovascular procedures</td><td>Surgical (favoured)</td></tr>

    <div class="tip">TASC II is a guide, not an absolute rule. Patient comorbidity, autologous vein availability, operator expertise, and patient preference all modify the decision. In CLTI, revascularisation by any means is preferred over amputation if technically feasible.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Endovascular vs Surgical Decision-making</div>
  <div class="card-body">
    <h4>Claudication</h4>
    <ul>
      <li><strong>First-line:</strong> supervised exercise rehabilitation ≥3 months (NICE/ESVS) + cardiovascular risk factor optimisation (antiplatelet, statin, ACE-I, smoking cessation)</li>
      <li><strong>Intervention threshold:</strong> lifestyle-limiting claudication after failed conservative therapy; not for mild claudication alone</li>
      <li><strong>Endovascular preferred for TASC A/B</strong> — lower procedural risk; comparable medium-term patency for short lesions</li>
      <li><strong>Surgery for TASC C/D</strong> in good surgical candidates with adequate life expectancy and autologous vein</li>
    </ul>

    <h4>CLTI (Chronic Limb-Threatening Ischaemia)</h4>
    <ul>
      <li>Definition: rest pain ≥2 weeks OR ischaemic ulcer/gangrene + ABI &lt;0.40 or TP &lt;30 mmHg or TcPO₂ &lt;20 mmHg</li>
      <li>Revascularisation is first-line if technically feasible (endovascular or surgical) — limb salvage takes priority over mode of intervention</li>
      <li>WIfI staging (Wound, Ischaemia, foot Infection) — see Classifications → guides amputation risk and revascularisation benefit</li>
    </ul>

    <h4>Key Trial Evidence</h4>
    <div class="table-scroll"><table>
      <tr><th>Trial</th><th>Population</th><th>Result</th></tr>
      <tr><td>BASIL-1 (2005)</td><td>CLTI; infra-inguinal disease</td><td>At 2yr: PTA vs bypass — equivalent amputation-free survival and quality of life; bypass better if surviving &gt;2yr</td></tr>
      <tr><td>BEST-CLI (2022)</td><td>CLTI; 1:1 EVT vs bypass</td><td>Bypass superior for major adverse limb events (MALE) in patients with adequate single-segment GSV; EVT similar when no adequate GSV</td></tr>
      <tr><td>BASIL-2 (2023)</td><td>CLTI BTK disease</td><td>Vein bypass superior to angioplasty for above-knee amputation-free survival in BTK CLTI (NEJM 2023)</td></tr>
      <tr><td>CLEVER (2012)</td><td>Aorto-iliac claudication</td><td>Supervised exercise ≥ stenting at 6mo for walking distance; stent superior at 18mo QoL</td></tr>
    </table></div>
    <div class="warn">BEST-CLI and BASIL-2 significantly shift practice toward bypass for CLTI patients with good vein — don't default to EVT in high-burden BTK CLTI when vein is available and patient is surgical candidate.</div>

    <h4>Factors Favouring Endovascular</h4>
    <ul>
      <li>Short focal lesions (TASC A/B)</li>
      <li>High surgical risk (cardiac, respiratory, frailty)</li>
      <li>No suitable autologous vein</li>
      <li>Post-irradiated field</li>
      <li>Claudication (not CLTI)</li>
      <li>Previous failed bypass (re-do surgery high risk)</li>
    </ul>

    <h4>Factors Favouring Surgery</h4>
    <ul>
      <li>Long occlusions, TASC C/D, multisegment disease</li>
      <li>Good autologous GSV available</li>
      <li>Young patient with long life expectancy (bypass durability superior long-term)</li>
      <li>Previously failed endovascular intervention</li>
      <li>Anatomy unsuitable for EVT (heavily calcified, no adequate distal target)</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Below-the-Knee (BTK) Considerations</div>
  <div class="card-body">
    <h4>BTK Anatomy</h4>
    <ul>
      <li><strong>Popliteal trifurcation:</strong> anterior tibial artery (lateral, crosses interosseous membrane), tibioperoneal trunk → posterior tibial (medial, plantar arch) + peroneal (lateral compartment)</li>
      <li><strong>Dominant vessels:</strong> PT and DP (from AT) form the plantar arch — primary targets for CLTI revascularisation</li>
      <li><strong>Pedal arch:</strong> plantar arch + dorsal pedal arch; continuity essential for wound healing in foot CLTI</li>
    </ul>

    <h4>Angiosome-directed Revascularisation</h4>
    <ul>
      <li>Angiosome = 3D tissue territory supplied by a named artery; 6 angiosomes of the foot</li>
      <li>Wound-artery matching: revascularise the artery directly supplying the wound bed (direct revascularisation)</li>
      <li>Indirect revascularisation (via collaterals) acceptable when direct target not technically feasible; inferior but not futile</li>
      <li>Evidence mixed: OLIVE registry suggests benefit of direct revascularisation; RCT evidence limited</li>
      <li><strong>Practical:</strong> target PT for heel/plantar wounds; target AT/DP for dorsal foot/toe wounds; peroneal as last resort (no direct foot supply)</li>
    </ul>
    <div class="tip">Pre-procedure wound photography, ulcer mapping and angiosome diagram guide target vessel selection — involve a vascular/wound care MDT when selecting BTK intervention target.</div>

    <h4>Technical Challenges in BTK</h4>
    <ul>
      <li>Small vessel calibre (2–3mm) — use 0.014" coronary wires and monorail systems</li>
      <li>Heavy medial calcification (Mönckeberg) — reduces vessel compliance, limits balloon angioplasty efficacy</li>
      <li>Long segment occlusions — subintimal technique common; re-entry may be needed</li>
      <li>Runoff vessel disease — poor distal target; predictive of reocclusion</li>
    </ul>

    <h4>BTK Endovascular Options</h4>
    <div class="table-scroll"><table>
      <tr><th>Technique</th><th>Evidence / Notes</th></tr>
      <tr><td>Plain PTA (POBA)</td><td>Standard first-line; high restenosis rate (50–60% at 1yr in BTK); acceptable for CLTI where limb salvage is the goal</td></tr>
      <tr><td>Drug-coated balloon (DCB)</td><td>Paclitaxel-coated; BIOLUX P-II, WILDERNESS trials showed benefit; IN.PACT DEEP showed non-inferior not superior; LUTONIX BTK showed non-inferiority — used selectively</td></tr>
      <tr><td>Drug-eluting stent (DES)</td><td>Bare DES (DESTINY, ACHILLES); better patency than PTA at 1yr but long-term data limited; use for residual stenosis/flow-limiting dissection</td></tr>
      <tr><td>BMS / scaffold</td><td>Avoid in BTK if possible — stent fracture, poor patency, difficult re-intervention</td></tr>
      <tr><td>Atherectomy</td><td>Laser or rotational atherectomy for heavy calcium; debulking before DCB in calcified BTK lesions</td></tr>
      <tr><td>Retrograde pedal/tibial access</td><td>For CTO crossing failure antegrade; retrograde 4Fr sheath in DP or PT; rendez-vous or CART technique</td></tr>
    </table></div>

    <h4>Retrograde Tibial/Pedal Access</h4>
    <ul>
      <li>Indications: failed antegrade CTO crossing; cap not crossable from above</li>
      <li>Puncture: US-guided, 21G micropuncture, 4Fr sheath; PT accessed medially at ankle, DP dorsally</li>
      <li>CART technique (Controlled Antegrade Retrograde Tracking): balloon inflated retrograde to expand subintimal space; antegrade wire enters retrograde balloon cavity</li>
      <li>Reverse CART: antegrade balloon inflated, retrograde wire enters cavity</li>
      <li>Closure: manual compression only at tibial/pedal; no closure devices available for these calibres</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Access Sites for PAD Intervention</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Access</th><th>Target</th><th>Technique / Considerations</th></tr>
      <tr><td><strong>Antegrade CFA (ipsilateral)</strong></td><td>SFA, popliteal, BTK</td><td>Needle angled caudally at 45–60°; more challenging in obese/short patients; US guidance essential; provides best pushability for BTK work; sheath 4–6Fr</td></tr>
      <tr><td><strong>Retrograde CFA + crossover ("up-and-over")</strong></td><td>Contralateral iliac, SFA, popliteal</td><td>45cm or 55cm sheath; requires adequate aortic bifurcation; torque control reduced; standard approach for contralateral interventions; 5–6Fr sheath</td></tr>
      <tr><td><strong>Radial / distal radial</strong></td><td>Aorto-iliac, renal, occasionally SFA</td><td>5–6Fr; long 100cm sheath; useful in bilateral femoral occlusion or obesity; reach may limit distal work</td></tr>
      <tr><td><strong>Brachial</strong></td><td>Aorto-iliac, iliac</td><td>End-artery — haematoma/median nerve risk; avoid &gt;7Fr; surgical cutdown for large sheaths; use only if femoral and radial unavailable</td></tr>
      <tr><td><strong>Retrograde popliteal</strong></td><td>SFA CTO, BTK from above</td><td>Prone position (or lateral); US-guided; 4Fr sheath; limited pushability; useful for SFA CTO retrograde crossing when antegrade fails</td></tr>
      <tr><td><strong>Retrograde tibial/pedal</strong></td><td>BTK CTO crossing</td><td>DP or PT; 21G micropuncture → 4Fr; rendez-vous / CART; manual compression closure only</td></tr>
    </table></div>
    <div class="tip">Antegrade femoral access requires puncture above the femoral bifurcation but below the inguinal ligament — US guidance mandatory. Needle angle 45–60° caudal to skin surface. A 23cm sheath gives good working length for BTK interventions from antegrade femoral.</div>

    <h4>Sheath Selection</h4>
    <ul>
      <li>Iliac intervention: 6–7Fr (balloon-expandable stents), 8–10Fr (covered stents)</li>
      <li>SFA: 6Fr standard; long 90cm sheath for BTK from contralateral access</li>
      <li>BTK antegrade: 4–5Fr; 0.014" platform (coronary OTW or monorail systems)</li>
      <li>Always check inner diameter of sheath vs balloon/device compatibility</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Endovascular Adjuncts & Techniques</div>
  <div class="card-body">
    <h4>Balloon Angioplasty (POBA)</h4>
    <ul>
      <li>0.035" platform (iliac, SFA) or 0.014" platform (BTK, popliteal)</li>
      <li>Balloon sizing: diameter matched to adjacent normal vessel (1:1); length covers lesion ± 2–5mm</li>
      <li>Inflation: nominal pressure for compliance; use compliance chart; prolonged inflation (3 min) may reduce elastic recoil</li>
      <li>Scoring/cutting balloons: for resistant calcified lesions — Angiosculpt, AngioSlash; creates micro-incisions to allow expansion</li>
      <li>High-pressure balloons: for in-stent restenosis or heavily calcified lesions (up to 20 atm)</li>
    </ul>

    <h4>Drug-coated Balloons (DCB)</h4>
    <ul>
      <li>Paclitaxel coat inhibits smooth muscle proliferation — reduces neointimal hyperplasia without permanent implant</li>
      <li><strong>SFA evidence:</strong> IN.PACT SFA, THUNDER, LEVANT 2 — superior primary patency vs POBA at 1–3yr; now standard of care for SFA ≤25cm</li>
      <li>Pre-dilate with POBA first; minimise calcium dissection before DCB inflation</li>
      <li>BTK evidence: mixed (see BTK card); use selectively in focal lesions</li>
      <li>Australian availability: IN.PACT Admiral (Medtronic), Ranger (BD/Bard), Passeo-18 Lux (Biotronik)</li>
    </ul>

    <h4>Stenting in the SFA</h4>
    <div class="table-scroll"><table>
      <tr><th>Stent Type</th><th>Example</th><th>Indication</th></tr>
      <tr><td>Self-expanding nitinol BMS</td><td>Zilver, Complete SE, LifeStent</td><td>Residual stenosis &gt;30% or flow-limiting dissection after PTA; TASC A/B bailout</td></tr>
      <tr><td>Drug-eluting stent (DES)</td><td>Zilver PTX (paclitaxel)</td><td>Superior to BMS and PTA in ZILVER PTX RCT; used for de novo SFA lesions or failed PTA</td></tr>
      <tr><td>Covered stent (ePTFE)</td><td>Viabahn, Fluency</td><td>SFA occlusions &gt;15cm (VIASTAR trial — non-inferior to bypass); perforation; post-atherectomy dissection</td></tr>
    </table></div>
    <div class="warn">Avoid stenting in the popliteal artery — high mechanical stress with flexion; stent fracture risk. Use DCB or bioabsorbable scaffold in popliteal if possible.</div>

    <h4>Iliac Stenting</h4>
    <ul>
      <li><strong>Balloon-expandable (SS or CoCr):</strong> ostial CIA/EIA lesions — precise deployment, radial force superior; Palmaz, Omnilink</li>
      <li><strong>Self-expanding nitinol:</strong> mid/distal EIA, CIA occlusions — conformable; Protege, SMART</li>
      <li><strong>Covered stents (aorto-iliac):</strong> COBEST trial — covered superior to BMS for TASC C/D lesions at 18mo</li>
      <li><strong>Kissing stents:</strong> simultaneous bilateral CIA stenting with balloon inflation to prevent flaring into aorta; required when stenting to or across aortic bifurcation</li>
    </ul>

    <h4>Atherectomy</h4>
    <ul>
      <li><strong>Directional (Hawk One, TurboHawk):</strong> excises plaque; best for eccentric lesions and in-stent restenosis; moderate calcification</li>
      <li><strong>Rotational (Jetstream, RotaPro):</strong> grinds calcium; best for concentric calcified lesions</li>
      <li><strong>Orbital (Diamondback 360):</strong> sanding motion; densely calcified plaque; risk of distal embolisation</li>
      <li><strong>Laser (Spectranetics):</strong> photoablation; in-stent restenosis, thrombotic occlusions; used in BTK</li>
      <li>Distal embolic protection device (Spider, FilterWire) recommended with atherectomy in SFA — captures debris</li>
    </ul>

    <h4>Chronic Total Occlusion (CTO) Crossing</h4>
    <ul>
      <li><strong>True-lumen crossing:</strong> stiff hydrophilic wires (Glidewire, Terumo); support catheter or OTW balloon for pushability</li>
      <li><strong>Subintimal angioplasty (Bolia technique):</strong> intentional subintimal dissection to bypass occlusion; re-entry into true lumen distally; high technical success in long SFA CTOs</li>
      <li><strong>Re-entry devices:</strong> Outback Elite (fluoroscopic), Pioneer Plus (IVUS-guided), Enteer — for controlled re-entry from subintimal space; expensive but effective in complex CTOs</li>
      <li><strong>IVUS guidance:</strong> helps identify true lumen and guides re-entry; increasingly used for complex work</li>
      <li>Retrograde approach: when antegrade fails — popliteal or tibial access; CART/rendez-vous</li>
    </ul>

    <h4>Catheter-directed Thrombolysis (CDT)</h4>
    <ul>
      <li>Indications: acute limb ischaemia (onset &lt;14 days) Rutherford IIa; acute-on-chronic PAD with thrombus component</li>
      <li>Contraindications: Rutherford IIb-III (non-viable limb → surgical embolectomy first); CVA &lt;2mo; active bleeding; recent surgery &lt;10d; pregnancy</li>
      <li>Agent: alteplase 0.5–1 mg/hr IA; check fibrinogen q8h (stop if &lt;1 g/L); UFH low-dose infusion via sheath sidearm (500 U/hr)</li>
      <li>Duration: typically 12–24h; repeat angio at 6h to assess progress; usually ≤48h to limit haemorrhage risk</li>
      <li>After thrombolysis: underlying lesion (stenosis/dissection) usually revealed — proceed to PTA/stent in same setting</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Complications</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Rate</th><th>Management</th></tr>
      <tr><td>Access site haematoma</td><td>3–5%</td><td>Manual compression; rarely requires transfusion or intervention; US to exclude pseudoaneurysm</td></tr>
      <tr><td>Pseudoaneurysm</td><td>1–2%</td><td>US-guided thrombin injection (0.5–1 mL bovine thrombin); compression; surgical repair if large/expanding</td></tr>
      <tr><td>Arterial dissection</td><td>5–10%</td><td>Types A–C: usually resolve spontaneously; Types D–F or flow-limiting: stent</td></tr>
      <tr><td>Distal embolisation</td><td>2–5%</td><td>Aspiration catheter (Export, Pronto); CDT if fibrin-rich; consider EPD with atherectomy</td></tr>
      <tr><td>Vessel perforation</td><td>&lt;1%</td><td>Prolonged balloon tamponade; covered stent; surgical repair for large vessels</td></tr>
      <tr><td>Stent thrombosis (acute)</td><td>&lt;2%</td><td>GP IIb/IIIa inhibitor (tirofiban, abciximab) IA; CDT; repeat PTA</td></tr>
      <tr><td>Stent fracture (SFA)</td><td>2–30% by type</td><td>Overlapping stents, high-flex zone; nitinol fracture-resistant; treat ISR when symptomatic</td></tr>
      <tr><td>Contrast nephropathy</td><td>1–5%</td><td>IV hydration pre/post; minimise contrast volume (&lt;1.5× eGFR as mL); CO₂ angiography in severe CKD</td></tr>
    </table></div>
    <div class="tip">Dual antiplatelet therapy (aspirin + clopidogrel) for 1–3 months post-stenting (varies by lesion/stent type); lifelong aspirin thereafter. For DCB without stent: aspirin alone 4 weeks is acceptable per TASC/ESVS.</div>

    <h4>Post-procedure Monitoring</h4>
    <ul>
      <li>Check pedal pulses (DP, PT) post-procedure — confirm improvement from baseline</li>
      <li>ABI at 24h post-procedure and at 1, 6, 12 months</li>
      <li>Duplex USS at 1, 6, 12 months for in-stent stenosis surveillance</li>
      <li>Wound review and multidisciplinary footcare in CLTI patients</li>
    </ul>
  </div>
</div>

<h2 class="page-title">Aortic & Upper Limb Intervention</h2>
<div class="page-meta"><span class="tag tag-section">Section B</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> EVAR — Endovascular Aortic Repair (Abdominal)</div>
  <div class="card-body">
    <h4>Indications</h4>
    <ul>
      <li>AAA ≥5.5cm diameter in men; ≥5.0cm in women (or symptomatic at any size)</li>
      <li>Expansion &gt;1cm/year on serial imaging</li>
      <li>Symptomatic or tender AAA — semi-urgent repair</li>
      <li>Ruptured AAA — emergency EVAR if anatomy suitable (IMPROVE trial — equivalent to open)</li>
    </ul>

    <h4>Anatomical Suitability Criteria (Standard EVAR)</h4>
    <div class="table-scroll"><table>
      <tr><th>Criterion</th><th>Requirement</th><th>Note</th></tr>
      <tr><td>Neck length</td><td>≥15mm (manufacturer dependent, some ≥10mm)</td><td>Most critical parameter; short neck → endoleak risk</td></tr>
      <tr><td>Neck diameter</td><td>18–32mm (device dependent)</td><td>Suprarenal vs infrarenal fixation differs</td></tr>
      <tr><td>Neck angulation</td><td>&lt;60° (suprarenal); &lt;45–60° to aortic axis</td><td>Severe angulation → type I endoleak, limb kinking</td></tr>
      <tr><td>Neck thrombus/calcification</td><td>&lt;50% circumference preferred</td><td>Impairs seal; may require FEVAR/CHEVAR</td></tr>
      <tr><td>Iliac access</td><td>≥6.5–7mm inner diameter, no severe tortuosity</td><td>Conduit if inadequate access vessels</td></tr>
      <tr><td>Iliac landing zone</td><td>≥15–20mm distal seal in CIA or EIA (with hypogastric embolisation if needed)</td><td>Distal type I endoleak if inadequate seal</td></tr>
    </table></div>

    <h4>EVAR Procedure Steps</h4>
    <ul>
      <li>Bilateral femoral access (surgical cutdown or percutaneous; Proglide x2 if percutaneous for 18–22Fr sheath)</li>
      <li>Aortogram with calibrated catheter — measure neck length, renal artery origins, iliac landmarks</li>
      <li>Main body delivery from dominant iliac (usually right); position below lowest renal; deploy proximal first</li>
      <li>Contralateral limb cannulation: gate cannulation via contralateral femoral access (may require angled catheter)</li>
      <li>Deploy iliac limbs bilaterally; balloon mould all junctions and overlap zones</li>
      <li>Completion angiogram: confirm renal patency, no type I/III endoleak, iliac patency, hypogastric filling</li>
      <li>Access site closure: Proglide pre-closure or surgical repair; check distal pulses</li>
    </ul>
    <div class="tip">Gate cannulation can be challenging — mark the gate on roadmap, use an angled catheter (Cobra or SOS Omni) with a stiff Glidewire. IVUS can confirm intraluminal position. Pulling the contralateral gate cranially with the wire can open it up.</div>

    <h4>EVAR vs Open Evidence</h4>
    <div class="table-scroll"><table>
      <tr><th>Trial</th><th>Finding</th></tr>
      <tr><td>EVAR-1 (UK, 2004/2010)</td><td>EVAR: lower 30-day mortality (1.8% vs 4.3%); by 8yr: no difference all-cause mortality; EVAR higher reintervention and rupture rates</td></tr>
      <tr><td>DREAM (Netherlands, 2004)</td><td>Similar to EVAR-1; 30-day operative mortality advantage for EVAR (1.2% vs 4.6%)</td></tr>
      <tr><td>OVER (USA, 2009)</td><td>EVAR: perioperative mortality benefit; no long-term overall survival difference; EVAR lower complication rate in elderly</td></tr>
      <tr><td>EVAR-2 (unfit for open)</td><td>EVAR vs no intervention in patients unfit for open: no survival benefit at 4yr — late ruptures in EVAR group; controversial</td></tr>
    </table></div>

    <h4>Endoleak Classification</h4>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">See Classification Systems → Endoleak Classification for full detail.</p>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Source</th><th>Action</th></tr>
      <tr><td>Ia / Ib</td><td>Proximal / distal seal failure</td><td>Treat urgently — aortic sac under systemic pressure; balloon moulding, extension cuff, re-EVAR, or open conversion</td></tr>
      <tr><td>II</td><td>Retrograde lumbar/IMA flow</td><td>Observe if sac stable/shrinking; intervene if sac enlarging (coil/Onyx transarterial or direct sac puncture)</td></tr>
      <tr><td>III</td><td>Fabric tear or junctional separation</td><td>Treat — bridging stent-graft</td></tr>
      <tr><td>IV</td><td>Fabric porosity (&lt;30d post-op)</td><td>Observe — resolves with reversal of anticoagulation; not a true endoleak</td></tr>
      <tr><td>V (endotension)</td><td>Sac expansion without detectable endoleak</td><td>CT + angiography; consider open repair if ongoing expansion</td></tr>
    </table></div>

    <h4>Post-EVAR Surveillance</h4>
    <ul>
      <li>CT angio at 1 month, 12 months, then annually (or as per local protocol)</li>
      <li>Duplex USS ± CT if endoleak suspected; duplex can miss type I/III — CT if sac enlargement</li>
      <li>Sac shrinkage &gt;5mm = satisfactory exclusion; stable = acceptable; enlargement &gt;5mm = investigate</li>
      <li>Device-specific surveillance intervals — follow manufacturer guidance</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TEVAR — Thoracic Endovascular Aortic Repair</div>
  <div class="card-body">
    <h4>Indications</h4>
    <ul>
      <li><strong>Thoracic aortic aneurysm (TAA):</strong> ≥5.5cm descending (or ≥5.5–6cm based on guidelines; 5.0cm in connective tissue disorders e.g. Marfan — typically require open)</li>
      <li><strong>Complicated type B aortic dissection:</strong> malperfusion (mesenteric, renal, limb), rapid expansion, uncontrolled hypertension/pain, rupture</li>
      <li><strong>Traumatic aortic injury (TAI):</strong> SVS grade 3/4 (pseudoaneurysm, rupture) → TEVAR within 24h; grade 1–2 (intimal tear) → medical management</li>
      <li><strong>Penetrating aortic ulcer (PAU) / intramural haematoma (IMH):</strong> complicated (rupture, rapid expansion, refractory pain)</li>
    </ul>

    <h4>Aortic Landing Zones (Ishimaru / EJVES Zones)</h4>
    <div class="table-scroll"><table>
      <tr><th>Zone</th><th>Location</th><th>Implication</th></tr>
      <tr><td>Zone 0</td><td>Ascending aorta (proximal to brachiocephalic)</td><td>Requires arch debranching + cardiopulmonary bypass; hybrid TEVAR</td></tr>
      <tr><td>Zone 1</td><td>Between brachiocephalic & left CCA</td><td>Left CCA revascularisation required; hybrid</td></tr>
      <tr><td>Zone 2</td><td>Between left CCA & left subclavian</td><td>Left subclavian may need coverage ± revascularisation</td></tr>
      <tr><td>Zone 3</td><td>Distal to left subclavian (proximal 2cm)</td><td>Standard TEVAR proximal landing zone; ≥20mm seal required</td></tr>
      <tr><td>Zone 4</td><td>T4–T6 descending thoracic</td><td>Standard mid-graft territory</td></tr>
      <tr><td>Zone 5</td><td>T6–coeliac axis</td><td>Risk of spinal ischaemia increases with distal extent</td></tr>
    </table></div>

    <h4>Left Subclavian Artery (LSA) Management</h4>
    <ul>
      <li>Coverage without revascularisation: acceptable if no left vertebral dominant or LIMA-LAD graft, contralateral vertebral patent, no left arm dominant</li>
      <li>Routine revascularisation recommended by SVS/ESVS if planned LSA coverage: carotid-subclavian bypass or subclavian transposition (open), or chimney/snorkel stent (endovascular)</li>
      <li>Emergency TEVAR: may cover LSA without revascularisation acutely; plan delayed left subclavian revascularisation if neurological deficit or left arm ischaemia develops</li>
    </ul>
    <div class="warn">Failure to revascularise the dominant left vertebral artery territory can cause posterior circulation stroke. Check CT for vertebral artery dominance and LIMA grafts pre-TEVAR.</div>

    <h4>Spinal Cord Ischaemia (SCI) Prevention</h4>
    <ul>
      <li>Risk factors: extensive coverage (&gt;20cm), coverage of T8–L2 (artery of Adamkiewicz territory), hypotension, prior aortic surgery, renal failure</li>
      <li><strong>Lumbar drain (LP drain):</strong> placed pre-procedure in high-risk; drain CSF to keep CSF pressure &lt;10 mmHg; maintain MAP &gt;80–90 mmHg; remove at 48–72h or earlier if no deficit</li>
      <li>Staged repair: avoid covering entire thoracoabdominal aorta in one sitting</li>
      <li>Avoid hypotension perioperatively — permissive hypertension (MAP &gt;80) for 48h post-TEVAR</li>
      <li>If delayed SCI develops: immediate LP drain if not in situ, raise MAP, blood transfusion if Hb low</li>
    </ul>

    <h4>TEVAR for Type B Dissection</h4>
    <ul>
      <li><strong>Uncomplicated type B dissection:</strong> medical management (antihypertensives, pain control); TEVAR not proven to improve outcomes over medical Rx at 2yr (INSTEAD trial); however INSTEAD-XL at 5yr showed aortic remodelling benefit</li>
      <li><strong>Complicated type B:</strong> TEVAR urgently — cover primary entry tear; promote false lumen thrombosis; relieve malperfusion (branch vessel stenting if needed)</li>
      <li>Goal: cover primary tear with ≥20mm seal in zone 3 (or 2); expand true lumen; allow false lumen thrombosis</li>
      <li>Remodelling assessed at 3–6mo CT: false lumen thrombosis = success; persistent false lumen flow = consider re-intervention or PETTICOAT technique (bare stent distal extension)</li>
    </ul>

    <h4>Key TEVAR Devices (Available in Australia)</h4>
    <div class="table-scroll"><table>
      <tr><th>Device</th><th>Company</th><th>Notes</th></tr>
      <tr><td>Gore TAG / cTAG</td><td>Gore</td><td>Conformable design; good for angulated aorta; low-profile delivery</td></tr>
      <tr><td>Zenith TX2 / Alpha</td><td>Cook</td><td>Active fixation (barbs); modular; Zenith Alpha — lower profile</td></tr>
      <tr><td>Valiant Captivia / Navion</td><td>Medtronic</td><td>Wide size range; Navion — reduced delivery profile</td></tr>
      <tr><td>Relay Plus / NBS</td><td>Bolton/Terumo</td><td>NBS version for proximal arch landing (scallop for LSA)</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Aorto-iliac Occlusive Disease</div>
  <div class="card-body">
    <h4>Leriche Syndrome</h4>
    <ul>
      <li>Aortic bifurcation occlusion (or severe stenosis) — clinical triad: bilateral claudication, absent femoral pulses, erectile dysfunction in men</li>
      <li>May be chronic (atherosclerotic) or acute (saddle embolus — emergency)</li>
      <li>Imaging: CTA confirms occlusion level, degree of collateralisation (internal iliac, inferior epigastrics, lumbar collaterals)</li>
    </ul>

    <h4>Aorto-iliac Endovascular Treatment</h4>
    <ul>
      <li><strong>Kissing stents:</strong> simultaneous bilateral CIA stenting with simultaneous balloon inflation — prevents plaque/stent protrusion into aorta; bilateral 18Fr access; requires coordination for inflation timing</li>
      <li><strong>Aortic bifurcation reconstruction:</strong> aortic extension stent-graft + kissing iliac limbs (covered) — for occlusive disease involving distal aorta</li>
      <li><strong>COBEST trial:</strong> covered Advanta V12 vs BMS for TASC C/D aorto-iliac lesions — covered stents superior primary patency at 18mo (74% vs 55%); now preferred for complex iliac disease</li>
      <li>Primary stenting (vs PTA + provisional stenting) preferred for aorto-iliac — DUTCH ILIAC trial: no significant difference but stenting avoids secondary procedures</li>
    </ul>

    <h4>Complex Aortic Anatomy</h4>
    <ul>
      <li><strong>Juxtarenal/pararenal AAA:</strong> not suitable for standard EVAR; options: FEVAR (fenestrated), CHEVAR (chimney/snorkel), or open</li>
      <li><strong>Iliac aneurysm extension:</strong> hypogastric embolisation (coil occlusion of internal iliac) before iliac limb extension into EIA — prevents type II endoleak from pelvic vessels; unilateral hypogastric occlusion usually tolerated; bilateral carries risk of pelvic ischaemia (colonic, buttock, erectile dysfunction)</li>
      <li><strong>IBE (Iliac Branch Endoprosthesis):</strong> Cook Zenith IBE, Gore IBE — preserves hypogastric flow; preferred over hypogastric embolisation when anatomy suitable</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Upper Limb Angioplasty & Subclavian Disease</div>
  <div class="card-body">
    <h4>Subclavian Artery Stenosis / Occlusion</h4>
    <ul>
      <li><strong>Aetiology:</strong> atherosclerosis (commonest, left &gt; right 3:1); Takayasu's arteritis (young women, Asian); giant cell arteritis; radiation-induced; thoracic outlet syndrome (rare)</li>
      <li><strong>Symptoms:</strong> arm claudication, hand ischaemia; dizziness/posterior circulation symptoms; left arm fatigue if LIMA used for CABG</li>
    </ul>

    <h4>Subclavian Steal Syndrome</h4>
    <ul>
      <li>Proximal subclavian stenosis/occlusion → retrograde flow in ipsilateral vertebral artery (vertebral flow reversed, stealing from basilar circulation)</li>
      <li>Clinical: posterior circulation symptoms with arm exercise (vertigo, visual disturbance, ataxia, syncope) + arm claudication</li>
      <li><strong>Diagnosis:</strong> BP differential &gt;15 mmHg arm-to-arm; duplex — reversed or to-and-fro vertebral flow; CTA/MRA confirms subclavian lesion</li>
      <li>Note: haemodynamic steal common on imaging but symptomatic steal syndrome less common — treat symptomatic patients</li>
    </ul>

    <h4>Endovascular Treatment (Subclavian)</h4>
    <ul>
      <li><strong>Access:</strong> retrograde femoral (long reach catheter — SOS Omni, Vitek; cross aortic arch) OR retrograde brachial/radial on ipsilateral side (shorter path) OR combined (rendez-vous for occlusions)</li>
      <li><strong>Ostial stenosis:</strong> balloon-expandable stent preferred — precise deployment, high radial force, resistant to external compression; size to match subclavian (7–10mm)</li>
      <li><strong>Non-ostial stenosis:</strong> PTA ± self-expanding stent; PTA alone reasonable for non-critical short lesions</li>
      <li><strong>Total occlusion:</strong> more challenging; combination antegrade (from arch, femoral) + retrograde (brachial/radial) rendez-vous; re-entry catheter if needed</li>
      <li><strong>Results:</strong> technical success &gt;95% for stenosis, 80–90% for occlusions; primary patency ~85% at 5yr</li>
    </ul>
    <div class="tip">Pre-wire with a 0.035" support catheter (Navicross, Renegade) before crossing subclavian CTO — the occlusion is often soft and the catheter provides the pushability needed. Brachial access from the ipsilateral side gives the most direct approach.</div>

    <h4>Brachial / Axillary / Radial Artery Disease</h4>
    <div class="table-scroll"><table>
      <tr><th>Condition</th><th>Presentation</th><th>Treatment</th></tr>
      <tr><td>Brachial artery stenosis</td><td>Arm claudication, Raynaud's-type</td><td>PTA ± stent; avoid stenting in mobile segments</td></tr>
      <tr><td>Axillary artery aneurysm</td><td>Distal embolisation (crutch users, TOS)</td><td>Covered stent-graft or surgical repair</td></tr>
      <tr><td>Ulnar artery occlusion (hypothenar hammer)</td><td>Ring/small finger ischaemia, occupational</td><td>CDT if acute; surgical resection/reconstruction; protective gloves</td></tr>
      <tr><td>Digital artery occlusion</td><td>Fingertip ischaemia; secondary Raynaud's</td><td>Systemic vasodilators; iloprost infusion; rarely surgical</td></tr>
    </table></div>

    <h4>Surgical Alternatives (Subclavian)</h4>
    <ul>
      <li><strong>Carotid-subclavian bypass:</strong> ePTFE or Dacron graft from CCA to subclavian; durable; requires neck dissection; stroke risk &lt;1%</li>
      <li><strong>Subclavian transposition:</strong> re-implants subclavian into CCA; excellent long-term patency; higher operative complexity; preferred when reconstruction needed at arch level</li>
      <li>Surgical preferred in young patients, Takayasu's (active inflammation reduces stent durability), recurrent in-stent stenosis</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Subclavian / Axillary Access for IR Procedures</div>
  <div class="card-body">
    <h4>Indications for Upper Limb Arterial Access</h4>
    <ul>
      <li>Bilateral femoral occlusion (aortic/iliac disease)</li>
      <li>Hostile groin (scarring, infection, obesity limiting access)</li>
      <li>EVAR with chimney/fenestrated/branched grafts requiring upper limb access for renal/visceral stenting</li>
      <li>TEVAR requiring snorkel/chimney for left subclavian or arch vessels</li>
      <li>Contralateral approach for difficult ipsilateral iliac/renal work</li>
    </ul>

    <h4>Radial Access</h4>
    <ul>
      <li><strong>Preferred upper limb option</strong> for most aorto-iliac, renal, and visceral work — haemostasis easy, haematoma rare, early mobilisation</li>
      <li>Barbeau test: PPG-based; A/B = safe; C/D = consider ulnar or alternative</li>
      <li>Left radial preferred for aortic arch work (shorter/straighter path to descending thoracic aorta vs right radial)</li>
      <li>Limit: 7Fr sheath maximum (6Fr most practical); 150cm-long guide for abdominal work</li>
      <li>Technique: 20G needle, 0.021" wire, 5–6Fr hydrophilic sheath; cocktail (GTN 200mcg + verapamil 2.5mg IA) to prevent spasm</li>
    </ul>

    <h4>Axillary / Brachial Access</h4>
    <ul>
      <li>Axillary: US-guided puncture distal axillary artery (lateral to pectoralis minor insertion); sheaths up to 14Fr possible; preferred over brachial for large-bore work (EVAR chimney, TEVAR)</li>
      <li>Left axillary preferred — avoids cerebral embolisation risk (right: any debris enters brachiocephalic → right CCA + right vertebral)</li>
      <li>Avoid medial axillary puncture — brachial plexus and thoracic structures at risk</li>
      <li>Brachial: end-artery — careful compression mandatory; haematoma can cause median nerve compression (compartment syndrome); consider surgical cutdown for large sheaths or long procedures</li>
      <li>Surgical conduit: if large bore (&gt;14Fr) needed in femoral-unavailable patient — Dacron 10mm conduit sutured to axillary artery under LA, large sheath inserted through conduit, conduit oversewn at end</li>
    </ul>

    <h4>Closure Techniques (Upper Limb)</h4>
    <div class="table-scroll"><table>
      <tr><th>Site</th><th>Preferred Closure</th><th>Notes</th></tr>
      <tr><td>Radial (≤7Fr)</td><td>Compression band (TR Band, HemoBand) — 2h; then wrist band</td><td>Patent haemostasis technique preferred to maintain radial patency</td></tr>
      <tr><td>Brachial (≤7Fr)</td><td>Manual compression 15–20 min; check distal pulse throughout</td><td>No compression devices validated; avoid tight bandaging</td></tr>
      <tr><td>Axillary (≤8Fr)</td><td>Manual compression over humeral head; Perclose ProGlide off-label for larger sheaths</td><td>Proglide pre-closure technique: place before sheath insertion, deploy after removal</td></tr>
      <tr><td>Large bore axillary (&gt;8Fr)</td><td>Surgical repair or conduit oversewn</td><td>Coordinate with vascular surgery pre-procedure</td></tr>
    </table></div>
    <div class="warn">Post-axillary access: monitor for brachial plexus symptoms (parasthesiae, arm weakness) — haematoma can compress the plexus acutely. US the access site if neurology develops post-procedure.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Complications of Aortic Intervention</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Time</th><th>Management</th></tr>
      <tr><td>Endoleak (see above)</td><td>Any time</td><td>Type-dependent — surveillance vs urgent re-intervention</td></tr>
      <tr><td>Device migration</td><td>Late (&gt;1yr)</td><td>CT surveillance; re-EVAR with extension cuff or open conversion</td></tr>
      <tr><td>Limb occlusion (EVAR)</td><td>Early or late</td><td>CDT + PTA/stent; femorofemoral bypass if not treatable endovascularly</td></tr>
      <tr><td>Renal artery coverage</td><td>Intraoperative</td><td>Snorkel/chimney stent; re-positioning; open conversion</td></tr>
      <tr><td>Spinal cord ischaemia (TEVAR)</td><td>0–48h</td><td>LP drain (CSF pressure &lt;10), MAP &gt;80, Hb optimisation; steroid protocol</td></tr>
      <tr><td>Retrograde type A dissection (TEVAR)</td><td>Intra/perioperative</td><td>Emergency cardiac surgery; lethal if not recognised; avoid oversizing proximal graft &gt;10%</td></tr>
      <tr><td>Stroke (arch work)</td><td>Intraoperative</td><td>Cerebral protection strategy; neuromonitoring; right radial pressure monitoring</td></tr>
      <tr><td>Access site injury</td><td>Intraoperative</td><td>Vascular surgical repair; iliac rupture (covered stent tamponade then surgical); axillary haematoma/nerve injury</td></tr>
      <tr><td>Post-implantation syndrome</td><td>2–10d post-EVAR</td><td>Fever, elevated CRP without infection; self-limiting; NSAID; exclude endoleak and infection</td></tr>
    </table></div>
    <div class="tip">Post-EVAR limb occlusion: most common in the first 30 days. Nitinol stent in iliac limb and avoidance of kinking reduces risk. If EVAR limb occludes: CDT + PTA/stenting often successful; fem-fem bypass as bailout.</div>

    <h4>Medication Protocol (Aortic IR)</h4>
    <ul>
      <li>UFH 5000–7500 U IA at start of aortic case; check ACT (target 250–300s for EVAR)</li>
      <li>Post-EVAR: aspirin 100mg lifelong; no routine anticoagulation unless other indication</li>
      <li>Post-TEVAR type B dissection: antihypertensives (labetalol preferred; target SBP &lt;120 acute; &lt;135 long-term); aspirin 100mg lifelong</li>
      <li>Contrast volume limiting: calculate max safe dose = 5 mL/kg ÷ Cr (mg/dL); use iso-osmolar contrast (Visipaque) and adequate IV hydration for pre-existing CKD</li>
    </ul>
  </div>
</div>

<div class="card">

      <li>The sheath Fr size = maximum catheter it will accept; sheath puncture/arteriotomy size = sheath OD</li>
      <li>Guide catheters and EVAR sheaths quoted by inner lumen (e.g., 18Fr EVAR sheath accepts 16Fr device)</li>
    </ul>
    <h4>Sheath Types</h4>
    <div class="table-scroll"><table>
      <tr><th>Sheath</th><th>Feature</th><th>Use</th></tr>
      <tr><td>Standard (Pinnacle, Avanti)</td><td>Hydrophilic outer coat; haemostatic valve; side-arm flush port</td><td>Routine femoral/radial access; 4–8Fr</td></tr>

      <tr><td>EVAR delivery sheath</td><td>18–24Fr; heavily reinforced; check-flow valve</td><td>Main body EVAR/TEVAR delivery; inserted over Lunderquist</td></tr>
      <tr><td>Peel-away sheath</td><td>Splits longitudinally on removal</td><td>Tunnelled catheter/port insertion; pacemaker lead delivery</td></tr>
      <tr><td>Rotating haemostatic valve (RHV)</td><td>Accepts simultaneous wire + catheter</td><td>Complex catheter exchanges; prevents blood loss during exchanges</td></tr>
    </table></div>
    <div class="tip">When upsizing access (e.g., 5Fr → 8Fr): sequential dilation with fascial dilators over the wire before inserting the larger sheath — avoids kinking and reduces arteriotomy extension force.</div>
  </div>
</div>

<div class="card">

  <div class="card-body">
    <h4>PTA (Plain Old Balloon Angioplasty) Sizing</h4>
    <ul>
      <li>Diameter: match to reference vessel diameter (1:1 ratio for most peripheral vessels; 1.0–1.1:1 for tibial)</li>
      <li>Length: cover entire lesion + 2–3 mm either end (avoid geographic miss)</li>
      <li>Inflation: use manometer — inflate to rated burst pressure only; most PTA balloons rated 8–16 atm</li>
      <li>Duration: typically 30–120 s; re-inflate if significant recoil (&gt;30% residual stenosis)</li>
    </ul>
    <h4>Balloon Types</h4>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Mechanism</th><th>Use</th></tr>
      <tr><td>Standard PTA (Mustang, Advance)</td><td>Radial expansion; fractures plaque</td><td>Iliac, femoral, renal angioplasty; pre-stent dilatation</td></tr>
      <tr><td>High-pressure balloon (Conquest, Dorado)</td><td>Rated to 20–30 atm</td><td>Resistant stenoses; calcified lesions; in-stent restenosis</td></tr>
      <tr><td>Cutting balloon</td><td>3–4 microsurgical blades on balloon surface; scores plaque</td><td>Resistant stenoses; in-stent restenosis; small vessel (renal, tibial)</td></tr>
      <tr><td>Scoring balloon (AngioSculpt)</td><td>Nitinol spiral scores plaque; lower pressure needed</td><td>Calcified femoral/popliteal; resistant lesions</td></tr>
      <tr><td>Drug-coated balloon (DCB)</td><td>Paclitaxel (most) or sirolimus coating; released on vessel contact</td><td>Femoropopliteal disease (superior to plain PTA at 12 months); BTK under evaluation; AV fistula stenosis</td></tr>

    <div class="tip">DCB (drug-coated balloon) — paclitaxel mortality signal (Katsanos meta-analysis 2018) caused regulatory scrutiny; subsequent real-world data and re-analysis has been largely reassuring. DCBs remain guideline-recommended for femoropopliteal disease (ESVS 2019, AHA/ACC 2024). Document use and discuss with patient during consent in current practice.</div>

</div>

  <div class="card-header"><span class="icon">▶</span> Stents</div>

    <h4>Self-Expanding vs Balloon-Expandable</h4>
    <div class="table-scroll"><table>
      <tr><th>Property</th><th>Self-Expanding (SE)</th><th>Balloon-Expandable (BE)</th></tr>

      <tr><td>Deployment</td><td>Constrained in sheath; expands on retraction</td><td>Crimped on balloon; expanded by balloon inflation</td></tr>

      <tr><td>Foreshortening</td><td>Significant (deploy distally; unsheath proximally)</td><td>Minimal</td></tr>
    </table></div>

    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Examples</th><th>Use</th></tr>
      <tr><td>Bare metal SE</td><td>Absolute, Innova, Misago, Lifestent</td><td>Femoropopliteal, iliac, carotid</td></tr>

      <tr><td>Covered BE</td><td>iCast, Advanta V12, BeGraft</td><td>Renal ostium (ostial disease); EVAR proximal cuff; endoleak (Type I)</td></tr>
      <tr><td>Venous dedicated SE</td><td>Venovo, VICI, Abre, sinus-Obliquus</td><td>Iliac vein obstruction (May-Thurner, post-thrombotic); high radial force, conformable</td></tr>
