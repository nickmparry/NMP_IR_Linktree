  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Timing</td><td>After failure of obstetric measures (uterotonics → tamponade → surgical); IR should be alerted early in massive PPH — don't wait until the patient is in extremis</td></tr>
      <tr><td>Access</td><td>Right CFA (single-puncture bilateral approach); left CFA if right fails</td></tr>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Prophylactic Balloon Occlusion — Placenta Accreta Spectrum</div>
  <div class="card-body">
    <p>Placenta accreta spectrum (PAS: accreta, increta, percreta) is associated with massive haemorrhage at delivery, often requiring hysterectomy. IR provides prophylactic balloon occlusion to reduce blood loss during caesarean and placenta removal.</p>

      <tr><th>Step</th><th>Detail</th></tr>

      <tr><td>Embolisation</td><td>If bleeding continues despite balloon occlusion → selective uterine artery embolisation through the balloon catheter lumen or via separate catheter</td></tr>
      <tr><td>Post-procedure</td><td>Balloons deflated after haemostasis; remove sheaths; observe for access site complications and lower limb ischaemia</td></tr>

      <li>Internal iliac balloons may be insufficient because of extensive collateral supply (ovarian, lumbar, median sacral arteries bypass IIA occlusion)</li>
      <li>Aortic balloon occlusion (infrarenal REBOA) is an alternative — more effective at reducing pelvic blood flow but higher risk; used selectively at specialist centres</li>
      <li>Current consensus: prophylactic balloons are reasonable as part of a multidisciplinary PAS management plan, but should not replace surgical haemostatic techniques</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Outcomes & Special Scenarios</div>

    <div class="table-scroll"><table>

    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> AAA & TAA — Anatomy & Natural History</div>

<div class="card">

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TEVAR Zones & Landing Zone Planning</div>
  <div class="card-body">
    <h4>Ishimaru Zones (Arch Landing Zones)</h4>
    <div class="table-scroll"><table>
      <tr><th>Zone</th><th>Proximal Extent</th><th>Branch Implications</th></tr>
      <tr><td>Zone 0</td><td>Ascending aorta / innominate origin</td><td>Requires total arch debranching (innominate + LCCA + LSA) or hybrid arch repair — essentially surgical territory</td></tr>

      <tr><td>Zone 4</td><td>Mid-descending thoracic aorta</td><td>Standard TEVAR territory — no arch branch involvement</td></tr>

    <h4>Landing Zone Requirements</h4>
    <ul>
      <li><strong>Minimum seal length:</strong> ≥20 mm proximally and distally in a healthy, non-diseased segment</li>
      <li><strong>Oversizing:</strong> 10–15% for chronic aneurysm; minimal (0–5%) for acute dissection (fragile aorta — excessive oversizing risks SINE: stent-graft induced new entry tear)</li>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Acute Aortic Syndromes — Classification</div>
  <div class="card-body">

      <tr><td><strong>Penetrating atherosclerotic ulcer (PAU)</strong></td><td>Ulcerated plaque penetrates internal elastic lamina into media</td><td>Focal contrast outpouching beyond expected aortic contour, often with adjacent IMH; typically descending aorta in elderly with heavy atherosclerosis</td></tr>

      <tr><th>Type</th><th>Involvement</th><th>Management Paradigm</th></tr>
      <tr><td><strong>Type A</strong></td><td>Involves ascending aorta (± arch, ± descending)</td><td>Surgical emergency — open repair (mortality ~25% with surgery vs ~50% without); TEVAR not applicable for ascending pathology</td></tr>

    <h4>DeBakey Classification</h4>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Origin</th><th>Extent</th></tr>
      <tr><td>Type I</td><td>Ascending aorta</td><td>Extends to arch and descending (most common Type A pattern)</td></tr>
      <tr><td>Type II</td><td>Ascending aorta</td><td>Confined to ascending only</td></tr>
      <tr><td>Type IIIa</td><td>Descending aorta</td><td>Confined to descending thoracic</td></tr>
      <tr><td>Type IIIb</td><td>Descending aorta</td><td>Extends below diaphragm into abdominal aorta</td></tr>
    </table></div>
  </div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Type B Dissection — Treatment Selection</div>
  <div class="card-body">
    <h4>Uncomplicated Type B</h4>
    <div class="table-scroll"><table>
      <tr><th>Phase</th><th>Management</th></tr>
      <tr><td>Acute (≤14 days)</td><td>Medical: aggressive BP control (target SBP 100–120 mmHg); IV labetalol or esmolol first-line (reduces dP/dt); analgesia; ICU monitoring. ADSORB and INSTEAD-XL trials support early TEVAR in selected uncomplicated cases (reduces late aortic-related mortality and false lumen patency) — increasingly considered for favourable anatomy</td></tr>
      <tr><td>Subacute (15–90 days)</td><td>Ongoing medical therapy; interval CTA at 1, 3, 6, 12 months then annually; consider TEVAR if aortic growth &gt;4 mm, persistent false lumen patency with max diameter &gt;40 mm, or new symptoms</td></tr>
      <tr><td>Chronic (&gt;90 days)</td><td>Lifelong BP control; surveillance CTA; surgical/endovascular repair if aneurysmal degeneration (&gt;55–60 mm) — TEVAR alone less effective in chronic phase (stiff, remodelled flap less likely to reappose)</td></tr>
    </table></div>
    <h4>Complicated Type B — Indications for Urgent TEVAR</h4>
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Detail</th></tr>
      <tr><td><strong>Malperfusion</strong></td><td>Branch vessel compromise → end-organ ischaemia (renal, mesenteric, limb); may be dynamic (flap prolapse) or static (false lumen thrombus compressing true lumen or occluding branch ostium)</td></tr>
      <tr><td><strong>Rupture / impending rupture</strong></td><td>Periaortic haematoma, haemothorax, increasing pain despite BP control</td></tr>
      <tr><td><strong>Rapid aortic expansion</strong></td><td>&gt;4 mm growth between serial imaging studies</td></tr>
      <tr><td><strong>Refractory pain / hypertension</strong></td><td>Persistent despite maximal medical therapy — suggests ongoing propagation or impending rupture</td></tr>
    </table></div>
    <h4>TEVAR Technique for Type B Dissection</h4>
    <ul>
      <li><strong>Goal:</strong> cover primary entry tear → redirect flow to true lumen → promote false lumen thrombosis and aortic remodelling</li>
      <li><strong>Oversizing:</strong> minimal (0–5% based on true lumen diameter at healthy proximal landing zone) — excessive oversizing in acute dissection risks SINE (stent-graft induced new entry)</li>
      <li><strong>Landing zone:</strong> ≥20 mm in non-dissected aorta proximally; distally above the coeliac trunk if possible (avoid covering visceral branches unless necessary)</li>
      <li><strong>Adjuncts for malperfusion:</strong> if branch ischaemia persists after entry tear coverage, may need branch vessel stenting or fenestration of the dissection flap</li>
    </ul>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> IMH & PAU — Management Pathways</div>
  <div class="card-body">
    <h4>Intramural Haematoma</h4>
    <div class="table-scroll"><table>
      <tr><th>Location</th><th>Approach</th></tr>
      <tr><td>Type A (ascending)</td><td>Surgical emergency — same as Type A dissection (high risk of progression to dissection or rupture)</td></tr>
      <tr><td>Type B (descending)</td><td>Medical management (as for uncomplicated Type B dissection); ~10% progress to frank dissection or aneurysmal dilation requiring intervention; serial CTA surveillance essential</td></tr>
    </table></div>
    <h4>Penetrating Atherosclerotic Ulcer</h4>
    <div class="table-scroll"><table>
      <tr><th>Presentation</th><th>Approach</th></tr>
      <tr><td>Asymptomatic, small, stable</td><td>Medical management + CTA surveillance (6-monthly initially)</td></tr>
      <tr><td>Symptomatic / enlarging / &gt;20 mm depth or &gt;10 mm neck</td><td>TEVAR (focal coverage of the ulcer with ≥20 mm proximal and distal seal in non-diseased aorta)</td></tr>
      <tr><td>Associated pseudoaneurysm or rupture</td><td>Urgent TEVAR</td></tr>
    </table></div>
    <div class="tip">PAU is the most common acute aortic syndrome to be treated with TEVAR in the elderly — the focal nature makes it ideally suited to short covered stent-graft coverage. IMH and PAU may coexist.</div>
  </div>
</div>

      <tr><td>Sheath</td><td>8–9 Fr short sheath (for guide catheter); or 8 Fr long sheath to subclavian</td></tr>
      <tr><td>Guide catheter</td><td>6–8 Fr balloon guide catheter (BGC) in cervical ICA or CCA — inflation during retrieval stops antegrade flow and dramatically reduces distal emboli (PROTECT trial: BGC reduces distal emboli, improves TICI 2b/3 rates)</td></tr>
      <tr><td>Microcatheter + wire</td><td>0.021" or 0.027" microcatheter (Marksman, Headway); 0.014" micro wire (Synchro, Traxcess); cross clot under roadmap</td></tr>
      <tr><td>Roadmap</td><td>Biplane DSA suite required; roadmap fluoroscopy to guide wire and device past clot</td></tr>
      <tr><td>Anticoagulation</td><td>IV UFH 2,000–3,000 IU at start (not full dose — haemorrhage risk); aspirin and dual antiplatelet only if stenting performed (tandem occlusion)</td></tr>
    </table></div>
    <h4>Key Trial Evidence</h4>
    <div class="table-scroll"><table>
      <tr><th>Trial</th><th>Year</th><th>Key Result</th></tr>
      <tr><td>MR CLEAN</td><td>2015</td><td>First positive MT RCT; mRS 0–2 at 90d: 33% MT vs 19% control (NNT=7)</td></tr>
      <tr><td>ESCAPE</td><td>2015</td><td>Good collaterals selected; mRS 0–2: 53% MT vs 29% control; stopped early</td></tr>
      <tr><td>SWIFT PRIME</td><td>2015</td><td>Solitaire stent retriever; mRS 0–2: 60% MT vs 35% tPA alone</td></tr>
      <tr><td>EXTEND-IA</td><td>2015</td><td>CTP-selected; reperfusion 100% vs 37%; mRS 0–2: 71% vs 40%</td></tr>
      <tr><td>DAWN</td><td>2018</td><td>6–24h window, CTP mismatch; mRS 0–2: 49% MT vs 13% control — dramatic benefit</td></tr>
      <tr><td>DEFUSE-3</td><td>2018</td><td>6–16h window; mRS 0–2: 45% MT vs 17% control; stopped early</td></tr>
      <tr><td>RESCUE-Japan LIMIT</td><td>2022</td><td>Large core (ASPECTS 3–5); 31% mRS 0–3 with MT vs 13% — supports MT even with large core</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TICI Score — Reperfusion Grading</div>
  <div class="card-body">
    <p>The <strong>modified TICI (Thrombolysis in Cerebral Infarction) score</strong> is the standard angiographic endpoint for MT. Assessed on final DSA run post-thrombectomy.</p>
    <div class="table-scroll"><table>
      <tr><th>TICI Grade</th><th>Definition</th><th>Clinical Outcome Correlation</th></tr>
      <tr><td><strong>0</strong></td><td>No perfusion — no flow past occlusion</td><td>Poor; equivalent to failed recanalization</td></tr>
      <tr><td><strong>1</strong></td><td>Minimal flow — contrast passes occlusion but fails to opacify entire territory</td><td>Poor; functionally equivalent to TICI 0</td></tr>
      <tr><td><strong>2a</strong></td><td>Partial perfusion — &lt;50% of target territory opacified</td><td>Moderate — better than failure but incomplete</td></tr>
      <tr><td><strong>2b</strong></td><td>Partial perfusion — ≥50% and &lt;90% of territory opacified; slow or incomplete filling</td><td><strong>Accepted threshold for procedural success in trials</strong>; good clinical outcomes in majority</td></tr>
      <tr><td><strong>2c</strong></td><td>Near-complete — ≥90% perfusion with slow flow or some distal branch occlusions</td><td>Excellent; outcomes approach TICI 3</td></tr>
      <tr><td><strong>3</strong></td><td>Complete perfusion — full opacification of all expected territory, normal flow</td><td><strong>Best outcome</strong>; target in all cases; mRS 0–2 rates highest with TICI 2b–3</td></tr>
    </table></div>
    <div class="tip"><strong>TICI 2b–3 = successful reperfusion</strong> — this is the endpoint reported in all MT trials. "Successful reperfusion" rates in modern series: 80–90% with combined ADAPT + stent retriever technique. TICI 2c/3 ("excellent reperfusion") associated with best 90-day outcomes and lowest symptomatic haemorrhage rates.</div>
    <h4>After Failed MT</h4>
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Options</th></tr>
      <tr><td>Persistent LVO after 3–4 passes</td><td>Consider intracranial stenting (off-label, last resort), intra-arterial tPA bolus, abandon procedure — diminishing returns and increasing risk with each additional pass</td></tr>
      <tr><td>Distal embolus post-retrieval</td><td>Aspiration catheter to distal M2/M3 if accessible; stent retriever to distal segments (0.017" compatible retrievers); accept if territory small</td></tr>
      <tr><td>Vasospasm post-procedure</td><td>Intra-arterial verapamil or nimodipine; verify true vasospasm vs residual thrombus on roadmap</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Tandem Occlusion — Cervical ICA + Intracranial LVO</div>
  <div class="card-body">
    <p>Tandem occlusion (cervical ICA stenosis/occlusion + ipsilateral intracranial LVO) occurs in ~15–20% of LVO strokes. Order of treatment is debated — most centres treat intracranial LVO first (retrograde approach), then address cervical ICA.</p>
    <div class="table-scroll"><table>
      <tr><th>Strategy</th><th>Approach</th><th>Pros / Cons</th></tr>
      <tr><td>Intracranial first (retrograde)</td><td>Cross cervical ICA via wire, place guide catheter distally, perform intracranial MT, then treat cervical lesion (CAS or balloon)</td><td>Restores intracranial flow fastest; avoids carotid stenting before confirming intracranial recanalization</td></tr>
      <tr><td>Extracranial first (antegrade)</td><td>CAS of cervical ICA first, then intracranial MT via same guide catheter</td><td>Provides stable access; dual antiplatelet required peri-stent → increases intracranial haemorrhage risk</td></tr>
      <tr><td>Cervical balloon angioplasty only</td><td>Balloon cervical ICA (no stent), proceed to intracranial MT; stent decision deferred</td><td>Avoids immediate dual antiplatelet; higher cervical re-occlusion risk</td></tr>
    </table></div>
    <div class="warn">Carotid stenting in the acute setting requires dual antiplatelet (aspirin + clopidogrel or ticagrelor) to prevent acute stent thrombosis. This significantly increases risk of symptomatic intracranial haemorrhage (sICH) in patients who also received IV tPA. Discuss with stroke neurology before stenting. TICH-NOAC (2024) evaluating heparin bridging vs DAPT in this scenario.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Post-Procedure Care & Complications</div>
  <div class="card-body">
    <h4>Immediate Post-MT Monitoring (Stroke Unit / ICU)</h4>
    <div class="table-scroll"><table>
      <tr><th>Parameter</th><th>Target / Action</th></tr>
      <tr><td>Blood pressure</td><td>If TICI 2b–3: BP &lt;180/105 mmHg for 24h (permissive hypertension avoided after successful reperfusion — haemorrhagic transformation risk). If TICI 0–1: allow permissive hypertension to maintain penumbral perfusion.</td></tr>
      <tr><td>Glucose</td><td>4–10 mmol/L; hyperglycaemia worsens infarct; hypoglycaemia mimics stroke</td></tr>
      <tr><td>Temperature</td><td>Normothermia (≤37.5°C); fever doubles infarct volume</td></tr>
      <tr><td>Oxygenation</td><td>SpO2 ≥94%; avoid supplemental O2 if normoxic (hyperoxia may worsen reperfusion injury)</td></tr>
      <tr><td>CT / MRI at 24h</td><td>Non-contrast CT at 24h to assess haemorrhagic transformation before starting antiplatelet or anticoagulation</td></tr>
      <tr><td>Antiplatelet restart</td><td>Aspirin 300 mg loading dose at 24h if no haemorrhagic transformation; then 100 mg/day</td></tr>
    </table></div>
    <h4>Complications of MT</h4>
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Rate</th><th>Prevention / Management</th></tr>
      <tr><td>Symptomatic intracranial haemorrhage (sICH)</td><td>~5% (vs 7% with IV tPA alone in trials)</td><td>Avoid over-anticoagulation; BP control post-reperfusion; suspect if clinical deterioration post-procedure</td></tr>
      <tr><td>Groin haematoma / access site</td><td>~5–10%</td><td>Manual compression; closure device (Angio-Seal, ProGlide); avoid if INR &gt;1.5</td></tr>
      <tr><td>Vessel perforation / dissection</td><td>&lt;1%</td><td>Gentle wire technique; abort if wire doesn't advance freely; intracranial balloon for perforation</td></tr>
      <tr><td>Distal embolisation</td><td>~10–20% new territory</td><td>BGC reduces incidence; combined technique; aspiration for accessible distal emboli</td></tr>
      <tr><td>Vasospasm</td><td>Common (~20%)</td><td>IA verapamil 2.5–5 mg; warm contrast; gentle guide catheter manipulation</td></tr>
      <tr><td>Re-occlusion</td><td>~5%</td><td>Anticoagulation peri-procedure; antiplatelet restart at 24h; consider bridging in atrial fibrillation</td></tr>
    </table></div>
    <div class="tip">Haemorrhagic transformation (HT) is not the same as sICH. HI1/HI2 (petechial) = expected reperfusion finding; PH1/PH2 (parenchymal haematoma) = potentially symptomatic. sICH is defined as any haemorrhage with ≥4-point NIHSS worsening. Report HT type (ECASS classification) on 24h CT.</div>
  </div>
</div>

<h2 class="page-title">Vascular Malformations</h2>
<div class="page-meta"><span class="tag tag-section">Section B · Vascular</span><span class="tag tag-freq-med">Commonly Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Classification Overview (ISSVA 2018)</div>
  <div class="card-body">
    <p>Vascular anomalies are classified by the International Society for the Study of Vascular Anomalies (ISSVA). The fundamental distinction is <strong>vascular tumours</strong> (e.g. haemangioma — proliferating endothelium) vs <strong>vascular malformations</strong> (structural abnormalities of vessels, present at birth, grow with patient, do not involute).</p>
    <div class="table-scroll"><table>
      <tr><th>Category</th><th>Types</th><th>Flow</th><th>IR Role</th></tr>
      <tr><td>Arteriovenous malformation (AVM)</td><td>Brain, spinal, somatic (extracranial)</td><td>High-flow</td><td>Embolisation (pre-operative, palliative, or curative); liquid agents (Onyx, NBCA)</td></tr>
      <tr><td>Arteriovenous fistula (AVF)</td><td>Dural (intracranial), spinal, peripheral</td><td>High-flow</td><td>Transarterial or transvenous embolisation; curative in many dural AVF</td></tr>
      <tr><td>Venous malformation (VM)</td><td>Sporadic, syndromic (Maffucci, Blue Rubber Bleb)</td><td>Low-flow</td><td><strong>Sclerotherapy</strong> — foam/STS, ethanol, bleomycin</td></tr>
      <tr><td>Lymphatic malformation (LM)</td><td>Macrocystic, microcystic, mixed</td><td>None</td><td>Sclerotherapy (doxycycline, bleomycin, STS foam); surgical for accessible lesions</td></tr>
      <tr><td>Capillary malformation</td><td>Port wine stain; telangiectasia</td><td>Low-flow</td><td>Laser (dermatology); IR rarely involved unless HHT-related</td></tr>
      <tr><td>Combined / syndromic</td><td>Klippel-Trénaunay (CM+VM+LM); Parkes-Weber (AVM+CM)</td><td>Mixed</td><td>MDT; VM component → sclerotherapy; AVM component → embolisation</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Spetzler-Martin AVM Grading</div>
  <div class="card-body">
    <p>The <strong>Spetzler-Martin (SM) grading system</strong> predicts surgical risk for intracranial AVM resection. IR uses it to guide embolisation strategy and predict overall treatment complexity.</p>
    <h4>Spetzler-Martin Score</h4>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Score</th></tr>
      <tr><td><strong>Nidus size</strong></td><td></td></tr>
      <tr><td>&nbsp;&nbsp;Small (&lt;3 cm)</td><td>1</td></tr>
      <tr><td>&nbsp;&nbsp;Medium (3–6 cm)</td><td>2</td></tr>
      <tr><td>&nbsp;&nbsp;Large (&gt;6 cm)</td><td>3</td></tr>
      <tr><td><strong>Eloquence of adjacent brain</strong></td><td></td></tr>
      <tr><td>&nbsp;&nbsp;Non-eloquent</td><td>0</td></tr>
      <tr><td>&nbsp;&nbsp;Eloquent (sensorimotor, language, visual cortex, hypothalamus, thalamus, brainstem, cerebellar nuclei, deep cerebellar)</td><td>1</td></tr>
      <tr><td><strong>Pattern of venous drainage</strong></td><td></td></tr>
      <tr><td>&nbsp;&nbsp;Superficial only</td><td>0</td></tr>
      <tr><td>&nbsp;&nbsp;Deep (any deep drainage)</td><td>1</td></tr>
    </table></div>
    <h4>Grade Interpretation</h4>
    <div class="table-scroll"><table>
      <tr><th>SM Grade</th><th>Total Score</th><th>Surgical Risk</th><th>Treatment Strategy</th></tr>
      <tr><td>I</td><td>1</td><td>Low (&lt;5% morbidity)</td><td>Surgery curative; pre-op embolisation often not needed</td></tr>
      <tr><td>II</td><td>2</td><td>Low–moderate</td><td>Surgery ± pre-op embolisation to reduce nidus vascularity</td></tr>
      <tr><td>III</td><td>3</td><td>Moderate (~8–15%)</td><td>MDT decision; embolisation + surgery or radiosurgery (SRS); or multimodal</td></tr>
      <tr><td>IV</td><td>4</td><td>High (~20–30%)</td><td>Conservative or palliative embolisation for symptoms (haemorrhage, steal); SRS for small residual nidus</td></tr>
      <tr><td>V</td><td>5</td><td>Very high (&gt;30%)</td><td>Usually conservative; embolisation only for life-threatening haemorrhage</td></tr>
    </table></div>
    <div class="tip">Grade I–II AVMs: surgery is preferred with low risk. Grade III: MDT-dependent. Grade IV–V: surgical risk prohibitive in most — conservative, SRS for small nidus, or palliative embolisation. Embolisation alone is rarely curative for intracranial AVM (requires complete nidus obliteration — achieved in &lt;20%) but is invaluable as an adjunct to surgery or SRS.</div>
    <h4>Embolisation Agents for AVM</h4>
    <div class="table-scroll"><table>
      <tr><th>Agent</th><th>Mechanism</th><th>Use</th><th>Notes</th></tr>
      <tr><td><strong>Onyx (EVOH)</strong></td><td>Ethylene vinyl alcohol copolymer dissolved in DMSO; precipitates on contact with blood as solid cast; controlled injection allows reflux and deep nidus penetration</td><td>Intracranial AVM nidus; pre-op and palliative; controlled fill; can inject slowly</td><td>Requires DMSO-compatible microcatheter (Marathon, Headway 17); slow injection (0.1 mL/30s); black colour on fluoro; solidifies within minutes</td></tr>
      <tr><td><strong>NBCA (n-butyl cyanoacrylate)</strong></td><td>Liquid glue; polymerises instantly on contact with ionic blood; glue cast</td><td>High-flow AVMs; fistulous components; faster injection needed</td><td>Mixture with Lipiodol controls polymerisation speed (1:1 = fast; 1:4 = slow). Glues catheter in situ if injection too slow — must be withdrawn rapidly post-injection.</td></tr>
      <tr><td><strong>Particles (PVA/microspheres)</strong></td><td>Flow-directed particulate embolisation</td><td>Spinal AVM pre-op; rarely for intracranial (distal emboli risk)</td><td>Not curative; recanalization occurs; useful for haemostasis or pre-operative devascularisation</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Dural Arteriovenous Fistula (dAVF)</div>
  <div class="card-body">
    <p>A dural AVF is an abnormal direct arteriovenous connection within the dural leaflets — fed by dural arteries (meningeal branches of ECA, ICA, or vertebral) draining into dural venous sinuses or cortical veins. Unlike AVM, there is no nidus — the fistula point is within the dura.</p>
    <h4>Cognard Classification (Intracranial dAVF)</h4>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Drainage Pattern</th><th>Haemorrhage Risk</th><th>Management</th></tr>
      <tr><td>I</td><td>Into sinus; antegrade flow</td><td>~0%</td><td>Observation; treat only if symptomatic (tinnitus, headache)</td></tr>
      <tr><td>IIa</td><td>Into sinus; retrograde sinus flow</td><td>~2%</td><td>Treat (embolisation) for symptoms; transvenous preferred</td></tr>
      <tr><td>IIb</td><td>Into sinus + cortical venous reflux</td><td>~10%</td><td>Treat — cortical reflux indicates aggressive behaviour</td></tr>
      <tr><td>IIa+b</td><td>Retrograde sinus + cortical venous reflux</td><td>~10%</td><td>Treat urgently</td></tr>
      <tr><td>III</td><td>Direct cortical venous drainage; no sinus</td><td>~40%</td><td>Urgent treatment — high haemorrhage risk</td></tr>
      <tr><td>IV</td><td>Cortical venous drainage + venous ectasia (&gt;5 mm)</td><td>~65%</td><td>Urgent treatment — highest risk</td></tr>
      <tr><td>V</td><td>Spinal perimedullary venous drainage</td><td>Myelopathy progressive</td><td>Urgent — progressive myelopathy without treatment</td></tr>
    </table></div>
    <h4>Endovascular Treatment Approaches</h4>
    <div class="table-scroll"><table>
      <tr><th>Approach</th><th>Best For</th><th>Technique</th></tr>
      <tr><td><strong>Transarterial embolisation</strong></td><td>Type I–IIa (reduce symptoms); adjunct before transvenous; fistulas accessible via ECA feeders</td><td>Superselective catheterisation of fistulous pedicle; Onyx or NBCA injection at fistula point. Goal: cast at fistula, not just feeder occlusion (feeders will recruit rapidly).</td></tr>
      <tr><td><strong>Transvenous embolisation</strong></td><td>Types IIb–IV; access via sinus or cortical vein; cavernous sinus fistulas; direct cortical vein drainage</td><td>Coil packing of draining sinus segment or cortical vein; followed by liquid agent if needed. Curative in 80–90% of cavernous sinus dAVF.</td></tr>
      <tr><td><strong>Direct percutaneous</strong></td><td>Rare; superficial scalp fistula</td><td>US-guided direct puncture of draining vein; coil + Onyx</td></tr>
    </table></div>
    <div class="tip">Cavernous sinus dAVF (Barrow type A–D fistula) — Barrow type A = direct high-flow ICA–CS fistula (traumatic); types B–D = dural AVF with indirect feeders. Types B–D respond well to transvenous coil embolisation via IPS (inferior petrosal sinus) approach — 80–90% cure. Type A may require detachable balloon or covered stent in ICA.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> HHT — Hereditary Haemorrhagic Telangiectasia</div>
  <div class="card-body">
    <p>HHT (Osler-Weber-Rendu disease) is an autosomal dominant disorder of vascular development (ENG or ACVRL1 gene mutation) causing multisystem arteriovenous malformations and telangiectasias. IR is central to management of pulmonary and hepatic AVMs.</p>
    <h4>Curaçao Diagnostic Criteria (3 of 4 = definite HHT)</h4>
    <ul>
      <li>Spontaneous recurrent epistaxis</li>
      <li>Multiple telangiectasias at characteristic sites (lips, oral mucosa, fingers, nose)</li>
      <li>Visceral AVMs (pulmonary, hepatic, cerebral, spinal)</li>
      <li>First-degree relative with HHT</li>
    </ul>
    <h4>Organ Involvement & IR Management</h4>
    <div class="table-scroll"><table>
      <tr><th>Site</th><th>Prevalence in HHT</th><th>Presentation</th><th>IR Treatment</th></tr>
      <tr><td><strong>Pulmonary AVM (PAVM)</strong></td><td>~30–50%</td><td>Paradoxical embolism (stroke, brain abscess from right-to-left shunt); hypoxia; haemoptysis; dyspnoea</td><td><strong>Coil embolisation of feeding artery</strong> — standard of care. Treat all PAVMs with feeding artery ≥3 mm. Vascular Plugs (AVP) increasingly used. Screen with contrast echo (bubble study) and CT chest. Re-screen every 3–5 years (recanalisation, growth of new PAVMs).</td></tr>
      <tr><td><strong>Hepatic AVM</strong></td><td>~30–70%</td><td>High-output cardiac failure; biliary ischaemia; portal hypertension; hepatic encephalopathy</td><td>Medical management first (anti-VEGF: bevacizumab — reduces AVM burden and bleeding). Hepatic artery embolisation rarely indicated (biliary necrosis risk). Liver transplant for refractory cases. IR role: largely diagnostic (hepatic angiography) and porto-systemic sampling.</td></tr>
      <tr><td><strong>Cerebral AVM</strong></td><td>~10%</td><td>Haemorrhage; seizures; headache</td><td>Refer neurovascular MDT. Treat as per standard AVM criteria (SM grading). ARUBA trial: unruptured brain AVM — medical therapy may be superior to intervention in selected cases (controversial).</td></tr>
      <tr><td><strong>Spinal AVM</strong></td><td>&lt;5%</td><td>Progressive myelopathy</td><td>Embolisation (Onyx) ± surgery; refer specialist spinal AVM unit</td></tr>
    </table></div>
    <div class="warn">PAVM embolisation: use <strong>0.9% saline flush only</strong> — never air in syringes near right heart (paradoxical air embolism). Position patient supine during procedure. Post-embolisation syndrome (pleuritic chest pain, low-grade fever) expected in 5–10%. Avoid air in any IV line in HHT patients with right-to-left shunt.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Venous Malformations — Sclerotherapy</div>
  <div class="card-body">
    <p>Venous malformations (VMs) are low-flow lesions composed of abnormally dilated venous channels with deficient smooth muscle. They are compressible, increase with Valsalva/dependent positioning, and do not thrombose spontaneously (they do develop phleboliths). Sclerotherapy is the primary IR treatment.</p>
    <h4>Sclerosant Agents — Comparison</h4>
    <div class="table-scroll"><table>
      <tr><th>Agent</th><th>Mechanism</th><th>Best For</th><th>Advantages</th><th>Disadvantages / Risks</th></tr>
      <tr><td><strong>Foam sclerotherapy (STS — sodium tetradecyl sulphate 1–3%)</strong></td><td>Detergent disrupts endothelial lipid bilayer → endothelial destruction → fibrosis. Foam prepared 4:1 air:liquid (Tessari method) to increase contact time and surface area.</td><td>Superficial, peripheral, moderately sized VMs; excellent first-line for most truncal/extremity VMs; safe near skin</td><td>Safe; low systemic toxicity; visible on US; can repeat easily; not painful like ethanol; wide availability</td><td>Less potent than ethanol — may require multiple sessions; skin necrosis if extravasation; systemic foam embolism if large right-to-left shunt; UGFS standard: 3% STS ≤8–10 mL per session</td></tr>
      <tr><td><strong>Absolute ethanol (96–99%)</strong></td><td>Protein precipitation → endothelial destruction + red cell lysis → immediate thrombosis and fibrosis. Most potent sclerosant.</td><td>Deep, large, or complex VMs; resistant lesions after foam failure; high-volume deep lesions</td><td>Most effective single agent — higher complete response rates per session; durable sclerosis</td><td><strong>Highest risk profile:</strong> severe pain (GA required); skin/nerve necrosis; pulmonary arterial hypertension (PAH) from microemboli — limit to &lt;0.5–1 mL/kg per session; cardiovascular collapse (bradycardia, arrhythmia) — monitor ECG; deep and visceral lesions only (not superficial — skin necrosis)</td></tr>
      <tr><td><strong>Bleomycin (1–3 mg/mL solution, 0.3–0.5 mg/kg per session)</strong></td><td>Cytotoxic antibiotic; induces endothelial apoptosis and fibrosis; slower action than STS/ethanol</td><td>Orbital/periorbital VMs; facial VMs near critical structures; paediatric patients; lesions where other agents too risky (near nerve, eye)</td><td>Excellent safety near nerves/eye — negligible necrosis risk; good for macrocystic LM as well; no pain in small volumes</td><td>Cumulative pulmonary fibrosis risk (lifetime dose &lt;400 mg total bleomycin); slower response; 2–4 sessions usually needed; swelling post-injection takes weeks to resolve; nausea</td></tr>
      <tr><td><strong>Doxycycline (for lymphatic malformations)</strong></td><td>Tetracycline antibiotic; anti-inflammatory and sclerosant — ideal for macrocystic LM</td><td>Macrocystic lymphatic malformations (large cysts); not for VMs</td><td>Safe; effective for macrocystic LM; outpatient or short stay; well-tolerated</td><td>Not effective for microcystic LM; VMs respond poorly; requires aspiration of cyst fluid first</td></tr>
    </table></div>
    <h4>Sclerotherapy Procedure (VM — General)</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Imaging guidance</td><td>Ultrasound ± fluoroscopy. US confirms needle in VM (compressible, echogenic blood). Fluoroscopy needed if deep — contrast injection maps lesion extent before sclerosant.</td></tr>
      <tr><td>Access</td><td>21–23G needle directly into VM; multiple punctures for large lesions</td></tr>
      <tr><td>Aspiration</td><td>Aspirate blood to confirm intraluminal position; note how easily it refills (high-flow = abort — may be AVM)</td></tr>
      <tr><td>Contrast check (fluoroscopy)</td><td>Inject dilute contrast to delineate VM extent, confirm no direct venous drainage to deep veins (risk of systemic sclerosant embolism)</td></tr>
      <tr><td>Sclerosant injection</td><td>Volume limited to lesion volume; for STS foam — typically 3–8 mL per session; ethanol — calculated by lesion volume (&lt;0.5 mL/kg); bleomycin — dose calculated by weight</td></tr>
      <tr><td>Compression</td><td>Direct pressure over VM for 5–10 min post-injection to maximise contact time and prevent early washout</td></tr>
      <tr><td>Post-procedure</td><td>Compression garment if extremity; LMWH prophylaxis for large extremity VMs (localised intravascular coagulation risk — D-dimer elevated, fibrinogen consumed); review at 6–8 weeks</td></tr>
    </table></div>
    <div class="tip">Venous malformations that communicate directly with a large deep vein (e.g., directly drain to femoral or popliteal vein) require flow control before sclerotherapy — tourniquet inflation, compression, or balloon occlusion of the draining vein — to prevent systemic sclerosant embolism. Always confirm drainage pattern on contrast fluoroscopy before injecting.</div>

</div>

<h2 class="page-title">Vascular Trauma — Haemostatic Embolisation</h2>

<div class="card">

    <p>IR embolisation is a cornerstone of non-operative management (NOM) for solid organ and pelvic trauma. The decision to proceed is driven by CT findings (active contrast extravasation, pseudoaneurysm, vascular injury grade), haemodynamic status, and injury grade. <strong>Haemodynamically unstable patients</strong> go to theatre or the hybrid OR — not the angiography suite.</p>

<div class="card">

  <div class="card-body">
    <p>Pelvic fracture haemorrhage is the leading cause of death in major pelvic trauma. 85% of pelvic bleeding is venous (presacral plexus) — not amenable to embolisation. 15% is arterial — IR-treatable. REBOA (Resuscitative Endovascular Balloon Occlusion of the Aorta) has transformed resuscitation of exsanguinating pelvic haemorrhage.</p>

      <tr><th>Approach</th><th>Detail</th></tr>

      <tr><td>Survey angiogram</td><td>AP pelvic aortogram first (identifies injury level); then selective bilateral internal iliac angiograms</td></tr>
      <tr><td>Selective vs non-selective</td><td>Selective embolisation of identifiable bleeding vessel preferred (superior gluteal, obturator, internal pudendal). If no discrete vessel identified but CT showed arterial blush → non-selective bilateral IIA embolisation (gelfoam ± coils at trunk level)</td></tr>

</div>

<div class="card">

  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Agent</th><th>Mechanism</th><th>Use in Trauma</th><th>Permanence</th><th>Practical Notes</th></tr>
      <tr><td><strong>Gelfoam (gelatine sponge)</strong></td><td>Temporary mechanical occlusion + promotes thrombosis; resorbed in 2–6 weeks → recanalization</td><td>First-line for pelvic IIA, liver, kidney — temporary haemostasis while vessel heals; ideal when organ preservation and recovery of flow desired</td><td>Temporary (weeks)</td><td>Can be cut into pledgets (2–5 mm) or slurry (mix with contrast for distal delivery). Inject slowly — avoid reflux. Cheap and widely available.</td></tr>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> UFE Technique</div>
  <div class="card-body">
    <h4>Access & Catheter Strategy</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Right femoral artery (single puncture) — bilateral uterine arteries accessed via crossover technique. Radial access emerging but longer learning curve.</td></tr>
      <tr><td>Diagnostic angiogram</td><td>Pelvic aortogram (optional) then selective bilateral internal iliac angiogram to define uterine artery origin. Right UTA: usually from anterior division of right IIA. Left UTA: crossover catheter (Cobra, SIM2, Roberts) from right femoral.</td></tr>
      <tr><td>Uterine artery catheterisation</td><td>Microcatheter (2.7 Fr) coaxially via 5 Fr catheter. Advance to horizontal/ascending segment of UTA. Confirm position: "cervicovaginal branch" visible — must position distal to this branch to avoid vaginal necrosis.</td></tr>

    </table></div>
    <h4>Cervicovaginal Branch Rule</h4>
    <p>The cervicovaginal branch arises from the descending segment of the UTA. Embolisation <strong>proximal to</strong> this branch causes cervical and vaginal necrosis — a serious complication. Always advance microcatheter <strong>past</strong> the cervicovaginal branch origin before injecting particles.</p>
    <div class="tip">Utero-ovarian anastomosis (present in ~10% of patients) connects the UTA to the ovarian artery — particles can track into the ovarian circulation causing premature ovarian failure. If identified on pre-embolisation DSA: use larger particles (700–900 µm); embolise slowly; consider limiting particle volume. Post-UFE amenorrhoea from ovarian failure occurs in ~1–3% under age 45, rising to ~40% over age 45.</div>

</div>

    <h4>Post-Embolisation Syndrome (PES)</h4>
    <p>PES is expected and nearly universal after UFE — caused by ischaemic necrosis of fibroid tissue with systemic inflammatory response.</p>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Timing</td><td>Begins within hours of procedure; peaks 24–48h; resolves over 5–7 days</td></tr>
      <tr><td>Symptoms</td><td>Pelvic pain/cramping (often severe — pre-emptive analgesia essential); fever (low-grade to 38.5°C); nausea; malaise; leukocytosis</td></tr>
      <tr><td>Management</td><td>Admitted 23h observation; patient-controlled analgesia (PCA morphine or equivalent); scheduled NSAIDs (ketorolac, ibuprofen); anti-emetics; oral opioids on discharge</td></tr>
      <tr><td>Distinguishing PES from infection</td><td>PES: fever resolves by day 3–5; CRP rises then falls; no uterine tenderness worsening after day 2–3. Infection: fever persists beyond day 5; rising CRP/WCC; purulent discharge; uterine tenderness → start antibiotics, consider CT (endometritis or pyomyoma)</td></tr>
    </table></div>
    <div class="warn"><strong>Fibroid expulsion</strong> occurs in ~5% (particularly submucosal fibroids) — patient presents with cramping and vaginal discharge of necrotic fibroid tissue weeks post-UFE. Usually self-limiting; hysteroscopy for retained expelled fibroid if incomplete. Warn all patients pre-procedure.</div>
  </div>
</div>

<div class="card">

  <div class="card-body">

      <tr><td><strong>Trauma</strong> (laceration, uterine rupture)</td><td>~10%</td><td>Embolisation if surgical control insufficient; covered stent for arterial laceration</td></tr>
      <tr><td><strong>Tissue</strong> (retained products, placenta accreta spectrum)</td><td>~5–7%</td><td>Placenta accreta: pre-operative balloon occlusion of IIA or aorta; prophylactic IIA embolisation at delivery</td></tr>

    <h4>Surgical vs Radiological Management Algorithm</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Intervention</th></tr>
      <tr><td>1st line</td><td>Uterotonics (oxytocin, ergometrine, carboprost, misoprostol); uterine massage; bimanual compression</td></tr>
      <tr><td>2nd line</td><td>Bakri balloon (intrauterine tamponade); B-Lynch suture (surgical compression); uterine compression sutures</td></tr>
      <tr><td>3rd line — IR</td><td><strong>Uterine artery embolisation (UAE)</strong> — success rate ~85–95% for atony PPH; preserves fertility; requires haemodynamic stability for transfer to IR suite</td></tr>
      <tr><td>3rd line — surgical</td><td>Bilateral internal iliac artery ligation; devascularisation sutures; hysterectomy (definitive)</td></tr>
      <tr><td>Haemodynamically unstable</td><td>Hysterectomy in OR; UAE not appropriate if patient cannot be safely transferred; REBOA (Zone III) as bridge</td></tr>
    </table></div>
    <h4>UAE for PPH — Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Bilateral femoral artery access (faster than single crossover access in acute haemorrhage); bilateral 5 Fr sheaths</td></tr>
      <tr><td>Catheter</td><td>Cobra or RDC (reverse curve) directly into anterior division IIA → select UTA. If unable to select UTA: anterior division IIA embolisation (less selective but faster).</td></tr>
      <tr><td>Agent</td><td><strong>Gelfoam (temporary)</strong> — preferred in PPH; allows uterine recovery and future fertility; pledgets or slurry injected to near-stasis. Permanent agents (coils, particles) used if gelfoam fails or placenta accreta.</td></tr>
      <tr><td>Bilateral embolisation</td><td>Always bilateral — rich cross-anastomoses mean unilateral UAE for PPH insufficient</td></tr>
      <tr><td>Post-procedure</td><td>ICU; continuous obstetric monitoring; reassess if bleeding recurs; UAE can be repeated</td></tr>
    </table></div>
    <h4>Internal Iliac Artery Anatomy — Divisions</h4>
    <div class="table-scroll"><table>
      <tr><th>Division</th><th>Branches</th></tr>
      <tr><td><strong>Anterior division</strong></td><td>Uterine artery, vaginal artery, obturator artery, internal pudendal artery, inferior gluteal artery, inferior vesical artery, middle rectal artery</td></tr>
      <tr><td><strong>Posterior division</strong></td><td>Superior gluteal artery (largest branch — responsible for buttock claudication if embolised), iliolumbar artery, lateral sacral arteries</td></tr>
    </table></div>
    <div class="tip"><strong>Temporising balloon:</strong> In placenta accreta spectrum (PAS) surgery, prophylactic balloon occlusion catheters are placed pre-operatively in the common iliac arteries or infrarenal aorta. At delivery, balloons are inflated to reduce haemorrhage during hysterectomy. Evidence for benefit is mixed (RCT data) — used variably at Australian centres. Main risk: lower limb ischaemia if balloon inflated too long; access site haematoma.</div>
  </div>
</div>

      <tr><td><strong>CAVENT</strong> (Norway, 2012; 5-yr follow-up 2016)</td><td>209 patients, iliofemoral DVT; CDT + anticoagulation vs anticoagulation alone</td><td>PTS at 2 years: 41% CDT vs 56% control (NNT ~7). At 5 years: PTS 43% vs 71% — sustained benefit. No difference in recurrent VTE or major bleeding but 20% had minor bleeding with CDT.</td><td>Supports CDT reducing PTS in iliofemoral DVT — foundational evidence, but single lytic-only technique (no pharmacomechanical) and modest sample size</td></tr>
      <tr><td><strong>ATTRACT</strong> (US, 2017)</td><td>692 patients; proximal DVT (femoral-popliteal AND iliofemoral); pharmacomechanical CDT (PCDT) vs anticoagulation alone</td><td>No significant difference in overall PTS at 24 months (47% PCDT vs 48% control). BUT: pre-specified subgroup analysis — iliofemoral DVT subgroup showed reduced moderate-severe PTS and greater improvement in venous-specific QoL and leg pain/swelling with PCDT. Increased major bleeding with PCDT (1.7% vs 0.3%).</td><td>Overall negative trial reshaped practice — routine PCDT for all proximal DVT is not supported. However, the iliofemoral subgroup signal keeps CDT/PCDT as an option for iliofemoral disease in selected patients with low bleeding risk, severe symptoms, and good functional status.</td></tr>
    </table></div>
    <h4>Current Practical Indications for CDT/PCDT</h4>
    <div class="table-scroll"><table>
      <tr><th>Favours CDT/PCDT</th><th>Favours Anticoagulation Alone</th></tr>
      <tr><td>Iliofemoral DVT with severe symptoms (phlegmasia, limb-threatening)</td><td>Isolated femoropopliteal DVT</td></tr>
      <tr><td>Symptom duration &lt;14 days (fresher, more lytic-responsive thrombus)</td><td>Symptom duration &gt;14–21 days (organised, less responsive clot)</td></tr>
      <tr><td>Good functional status, low life expectancy for PTS morbidity to matter, low bleeding risk</td><td>High bleeding risk; frailty; limited life expectancy</td></tr>
      <tr><td>Phlegmasia cerulea dolens (limb-threatening venous congestion)</td><td>Distal (calf-only) DVT</td></tr>
    </table></div>
    <div class="warn">Phlegmasia cerulea dolens is a limb-threatening emergency — massive iliofemoral thrombosis causing venous outflow obstruction severe enough to compromise arterial inflow (compartment pressure rise). Urgent thrombus removal (CDT/PCDT or surgical thrombectomy) is indicated regardless of trial-level evidence for routine DVT — this is a distinct, time-critical clinical scenario.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Iliac Vein Stenting for May-Thurner</div>
  <div class="card-body">
    <p>After clot removal (CDT/PCDT) for iliofemoral DVT, an underlying iliac vein stenosis (May-Thurner compression — see anatomy-venous) is frequently uncovered and should be treated in the same setting to prevent early re-thrombosis.</p>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Confirm stenosis</td><td>IVUS strongly preferred over venography alone — detects the intraluminal spur and true luminal narrowing that venography underestimates</td></tr>
      <tr><td>Stent selection</td><td>Dedicated venous stents (Vici, Zilver Vena, Wallstent) — higher radial force and different fatigue characteristics than arterial stents, designed for the compressive forces at the iliac crossing point</td></tr>
      <tr><td>Sizing</td><td>Oversized relative to adjacent normal vein diameter (typically common iliac vein 14–16 mm, external iliac 12–14 mm) — err toward larger diameter given high flow venous system</td></tr>
      <tr><td>Landing zone</td><td>Stent should extend from healthy vein proximally (into IVC if needed to fully cover the lesion) to healthy vein distally — inadequate distal landing (stopping at the inguinal ligament) risks residual stenosis and re-thrombosis</td></tr>
      <tr><td>Post-stent anticoagulation</td><td>Therapeutic anticoagulation for a minimum of 3–6 months; antiplatelet therapy sometimes added; duration individualised based on underlying thrombophilia and stent patency on follow-up</td></tr>
    </table></div>
    <div class="tip">Stenting across the inguinal ligament into the common femoral vein is sometimes necessary for adequate distal landing zone — historically avoided for fear of stent fracture with hip flexion, but modern venous stents tolerate this location; extending stenting into the femoral vein when required for adequate outflow is now accepted practice in many centres.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Superficial Venous Insufficiency — EVLA & Sclerotherapy</div>
  <div class="card-body">
    <h4>Endovenous Laser Ablation (EVLA) / Radiofrequency Ablation (RFA)</h4>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Indication</td><td>Symptomatic great saphenous vein (GSV) or small saphenous vein (SSV) reflux; CEAP C2 and above; failed conservative management (compression) for symptomatic varicose veins</td></tr>
      <tr><td>Technique</td><td>US-guided venous access, catheter/fibre advanced to within 2 cm of saphenofemoral (or saphenopopliteal) junction; tumescent anaesthesia infiltrated around the vein (protects surrounding tissue from thermal injury, provides anaesthesia, compresses vein against fibre for better wall contact); thermal energy delivered as catheter withdrawn — laser (endovenous laser ablation, EVLA) or radiofrequency (RFA, e.g. ClosureFast)</td></tr>
      <tr><td>Endpoint</td><td>Vein wall collapse and fibrosis; confirmed on completion duplex USS showing occluded/non-compressible treated segment</td></tr>
      <tr><td>Outcomes</td><td>Closure rates &gt;90–95% at 1 year; equivalent or superior to open surgical stripping with less pain, faster recovery, lower complication rates — first-line per NICE and most international guidelines</td></tr>
    </table></div>
    <h4>Sclerotherapy for Superficial Veins</h4>
    <div class="table-scroll"><table>
      <tr><th>Technique</th><th>Best For</th><th>Detail</th></tr>
      <tr><td>Ultrasound-guided foam sclerotherapy (UGFS)</td><td>Larger truncal veins (GSV/SSV), incompetent perforators, recurrent varicosities post-surgery/EVLA</td><td>STS or polidocanol foam (Tessari technique); US-guided injection with compression; effective but higher recurrence than thermal ablation for truncal reflux</td></tr>
      <tr><td>Liquid/microsclerotherapy</td><td>Telangiectasia, reticular veins (cosmetic, C1)</td><td>Direct visual injection of small-calibre sclerosant; multiple sessions typically needed</td></tr>
    </table></div>
    <div class="tip">Tumescent anaesthesia is critical to EVLA/RFA safety and efficacy — it provides a fluid cushion between the vein and the skin/adjacent nerves (reducing thermal skin injury and saphenous/sural nerve injury) and compresses the vein wall against the treatment fibre, improving contact and reducing the flow of blood that can insulate against thermal effect.</div>
  </div>
</div>
`;

    <div class="tip">Submassive PE is subdivided by some societies into "intermediate-low" (either RV dysfunction OR biomarker elevation, not both) and "intermediate-high" (both present) — intermediate-high risk patients are the group most often considered for catheter-directed therapy given higher risk of haemodynamic deterioration.</div>

</div>

<div class="card">

    <p>The Pulmonary Embolism Severity Index (PESI), and its simplified version (sPESI), predict 30-day mortality and guide outpatient vs inpatient management for low-risk PE.</p>

    <div class="table-scroll"><table>
      <tr><th>Criterion</th></tr>
      <tr><td>Age &gt;80 years</td></tr>
      <tr><td>History of cancer</td></tr>

      <tr><td>Severe unmanaged coagulopathy</td><td>Bilirubin markedly elevated (&gt;51 µmol/L) — associated with worse post-TIPS outcomes; MELD &gt;18-24 substantially increases early mortality risk</td></tr>
      <tr><td>Polycystic liver disease (relative-absolute — no safe hepatic parenchymal tract)</td><td>Portal vein thrombosis extending into mesenteric veins (technically challenging, not absolute CI in expert hands)</td></tr>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Technique & Stent Sizing</div>
  <div class="card-body">
    <h4>Procedural Steps</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Right internal jugular vein (standard) → right hepatic vein (see anatomy-venous for trajectory principles)</td></tr>
      <tr><td>Portal pressure measurement</td><td>Free and wedged hepatic venous pressure gradient (HVPG) measured before shunt creation — establishes baseline severity of portal hypertension</td></tr>
      <tr><td>Needle pass</td><td>TIPS needle (e.g. Colapinto or Ring needle set) advanced from hepatic vein through parenchyma into a portal vein branch under fluoroscopic ± wedge venogram roadmap guidance</td></tr>
      <tr><td>Confirm portal access</td><td>Aspirate blood, inject contrast to confirm portal venous system opacification (portal vein branches, splenic/SMV confluence visible) before proceeding</td></tr>
      <tr><td>Tract dilation</td><td>Balloon dilation of the parenchymal tract (typically 8–10 mm)</td></tr>
      <tr><td>Stent deployment</td><td>Covered stent-graft (ePTFE-covered, e.g. Viatorr) placed across the parenchymal tract, extending from the portal vein to the hepatic vein/IVC junction</td></tr>
      <tr><td>Post-deployment pressure</td><td>Repeat portosystemic pressure gradient measurement — target &lt;12 mmHg (or ≥50% reduction from baseline) for variceal bleeding indication</td></tr>
    </table></div>
    <h4>Stent Sizing</h4>
    <div class="table-scroll"><table>
      <tr><th>Parameter</th><th>Typical Range</th><th>Rationale</th></tr>
      <tr><td>Diameter</td><td>8–10 mm (most commonly 8 mm initially, or a controlled-expansion 10 mm device dilated to a lower initial diameter)</td><td>Balances adequate portal decompression against risk of hepatic encephalopathy — larger diameter shunts more flow away from the liver, increasing HE risk</td></tr>
      <tr><td>Controlled expansion devices (Viatorr CX)</td><td>Nominal 10 mm but can be under-dilated to 8 mm initially</td><td>Allows later balloon dilation to full diameter if the initial shunt is insufficient — avoids a second full TIPS procedure</td></tr>
      <tr><td>Target pressure gradient</td><td>&lt;12 mmHg for variceal bleeding; individualised for refractory ascites (may need lower target)</td><td>Reduces variceal rebleeding risk to &lt;10%; going too low increases HE and cardiac preload risk</td></tr>
    </table></div>
    <div class="tip">Covered stent-grafts (Viatorr) have significantly reduced shunt dysfunction/occlusion rates compared to older bare metal stents by preventing bile leak-induced pseudointimal hyperplasia within the tract — covered stents are now standard of care for TIPS.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TIPS Revision & Surveillance</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Detail</th></tr>
      <tr><td>Surveillance</td><td>Doppler USS at 1 week, then 3-monthly to 1 year, then 6–12 monthly — assess shunt velocity/patency; recurrent symptoms (rebleeding, re-accumulating ascites) prompt earlier venography</td></tr>
      <tr><td>Shunt stenosis/dysfunction</td><td>Suspected on rising shunt velocity gradient, recurrent varices/ascites, or falling shunt flow velocity on Doppler; confirmed on venography with pressure gradient remeasurement</td></tr>
      <tr><td>Revision technique</td><td>Balloon angioplasty of the stenotic segment (commonly at the hepatic venous end or within the parenchymal tract); relining with an additional covered stent segment if angioplasty alone is insufficient or there is recurrent/rapid restenosis</td></tr>
      <tr><td>Shunt insufficiency (inadequate pressure reduction)</td><td>Balloon dilation to a larger diameter (if using a controlled-expansion device) or placement of a parallel second TIPS tract in refractory cases</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Hepatic Encephalopathy Risk Stratification</div>
  <div class="card-body">
    <h4>Pre-TIPS Risk Factors for Post-TIPS HE</h4>
    <div class="table-scroll"><table>
      <tr><th>Factor</th><th>Risk Contribution</th></tr>
      <tr><td>Prior episode(s) of hepatic encephalopathy</td><td>Strongest single predictor — history of HE roughly doubles post-TIPS HE risk</td></tr>
      <tr><td>Age &gt;65 years</td><td>Increased risk — reduced physiological reserve</td></tr>
      <tr><td>Low serum albumin / sarcopenia</td><td>Reflects poor hepatic synthetic function and muscle mass (muscle is a site of ammonia metabolism)</td></tr>
      <tr><td>High MELD score</td><td>Reflects severity of underlying liver disease</td></tr>
      <tr><td>Large shunt diameter</td><td>More portal blood bypasses hepatic detoxification — modifiable via controlled stent sizing</td></tr>
      <tr><td>Renal impairment</td><td>Reduced ammonia clearance</td></tr>
    </table></div>
    <h4>HE Management Post-TIPS</h4>
    <div class="table-scroll"><table>
      <tr><th>Line</th><th>Management</th></tr>
      <tr><td>First-line</td><td>Lactulose (titrate to 2–3 soft stools/day); identify and correct precipitants (infection, GI bleeding, constipation, electrolyte disturbance, sedatives)</td></tr>
      <tr><td>Second-line</td><td>Rifaximin added if lactulose alone insufficient — reduces gut ammonia-producing bacteria</td></tr>
      <tr><td>Refractory HE</td><td>Shunt reduction procedure — placement of a reducing stent (parallel smaller stent or constraining device) within the existing TIPS tract to reduce shunt flow while preserving some portal decompression</td></tr>
      <tr><td>Severe/refractory despite reduction</td><td>Shunt occlusion (rarely required) — accepting recurrence of portal hypertension complications to control intractable HE; last resort, individualised decision with hepatology</td></tr>
    </table></div>
    <div class="warn">Careful pre-procedure patient selection (avoiding TIPS or using a smaller initial shunt diameter in patients with strong HE risk factors) is more effective than managing established severe post-TIPS HE — risk-stratify every candidate before the procedure, not just after complications arise.</div>
  </div>
</div>
`;

PAGES['b-buddchiari'] = `
<h2 class="page-title">Budd-Chiari Syndrome</h2>
<div class="page-meta"><span class="tag tag-section">Section B · Vascular</span><span class="tag tag-freq-med">Commonly Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Aetiology</div>
  <div class="card-body">
    <p>Budd-Chiari syndrome (BCS) is obstruction of hepatic venous outflow at any level from the small hepatic venules to the right atrium (excluding cardiac causes, which are termed "cardiac Budd-Chiari" or more typically classified separately as congestive hepatopathy).</p>
    <div class="table-scroll"><table>
      <tr><th>Category</th><th>Causes</th><th>Proportion</th></tr>
      <tr><td><strong>Primary (thrombotic)</strong></td><td>Myeloproliferative neoplasms (polycythaemia vera, essential thrombocythaemia — often with JAK2 V617F mutation, found in up to 50% of primary BCS); other hypercoagulable states (factor V Leiden, antiphospholipid syndrome, paroxysmal nocturnal haemoglobinuria, pregnancy/OCP); membranous webs (more common in Asian populations)</td><td>~75% (Western series)</td></tr>
      <tr><td><strong>Secondary</strong></td><td>Extrinsic compression or invasion — HCC, other hepatic/adrenal tumours, hepatic/caval abscess, trauma</td><td>~25%</td></tr>
    </table></div>
    <div class="tip">Every patient diagnosed with Budd-Chiari syndrome should undergo a full haematological workup for an underlying myeloproliferative neoplasm or thrombophilia, including JAK2 mutation testing, even without an overtly abnormal blood count — subclinical MPN is common in this population.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Classification</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Level of Obstruction</th><th>Notes</th></tr>
      <tr><td>Type I</td><td>Obstruction of the IVC (with or without hepatic vein involvement)</td><td>More common in Asian populations; often membranous webs</td></tr>
      <tr><td>Type II</td><td>Obstruction of major hepatic veins</td><td>Most common pattern in Western populations; thrombotic aetiology predominant</td></tr>
      <tr><td>Type III</td><td>Obstruction of small centrilobular venules (veno-occlusive disease / sinusoidal obstruction syndrome)</td><td>Distinct entity — typically post-chemotherapy or post-transplant conditioning; managed differently from macrovascular BCS</td></tr>
    </table></div>
    <h4>Clinical Presentation Patterns</h4>
    <div class="table-scroll"><table>
      <tr><th>Pattern</th><th>Features</th></tr>
      <tr><td>Acute/fulminant</td><td>Rapid onset abdominal pain, ascites, hepatomegaly, jaundice, liver failure — medical emergency</td></tr>
      <tr><td>Subacute/chronic</td><td>More insidious ascites, hepatomegaly; may present with complications of established cirrhosis/portal hypertension (varices, splenomegaly)</td></tr>
      <tr><td>Asymptomatic/incidental</td><td>Caudate lobe hypertrophy or venous collaterals found incidentally on imaging in a patient with known thrombophilia</td></tr>
    </table></div>
    <div class="tip">Caudate lobe hypertrophy is a hallmark imaging finding — the caudate lobe (segment I) has independent hepatic venous drainage directly into the IVC (see anatomy-hepatic), so it is spared from the outflow obstruction affecting the rest of the liver and compensatorily hypertrophies, which can itself cause secondary IVC compression.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Treatment Algorithm & Budd-Chiari-Specific TIPS Technique</div>
  <div class="card-body">
    <h4>Stepwise Treatment Approach</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Intervention</th></tr>
      <tr><td>1</td><td>Anticoagulation (all patients, regardless of subsequent intervention) + treatment of underlying cause (cytoreductive therapy for MPN, etc.)</td></tr>
      <tr><td>2</td><td>If a focal, short-segment stenosis/web is identified: angioplasty ± stenting of the stenotic hepatic vein or IVC segment — simplest and most direct if anatomically feasible</td></tr>
      <tr><td>3</td><td>If diffuse hepatic vein occlusion or angioplasty/stenting fails: <strong>TIPS</strong> — decompresses the congested liver by creating an alternative outflow pathway from portal vein directly to systemic (caval/atrial) circulation, bypassing the obstructed hepatic veins entirely</td></tr>
      <tr><td>4</td><td>If TIPS technically not feasible or fails: liver transplantation — definitive treatment for progressive liver failure</td></tr>
    </table></div>
    <h4>Budd-Chiari-Specific TIPS Technique</h4>
    <p>TIPS in Budd-Chiari syndrome is technically more demanding than standard TIPS because the target hepatic vein is often occluded, distorted, or absent as a usable access route.</p>
    <div class="table-scroll"><table>
      <tr><th>Technical Challenge</th><th>Approach</th></tr>
      <tr><td>Occluded hepatic veins — no standard hepatic-vein-to-portal-vein access route</td><td><strong>Direct transcaval (or "direct intrahepatic portosystemic shunt" — DIPS) approach</strong> — needle passed directly from the IVC through hepatic parenchyma into a portal vein branch, bypassing the need for a patent hepatic vein entirely</td></tr>
      <tr><td>Identifying portal vein target without a hepatic vein wedge injection route</td><td>Pre-procedure cross-sectional imaging (CT/MR) fused with fluoroscopy, or intracardiac/intravascular ultrasound (ICE/IVUS) guidance from the IVC to target the portal vein directly</td></tr>
      <tr><td>Caudate lobe hypertrophy compressing/distorting the IVC</td><td>May narrow the safe window for IVC puncture — careful pre-procedure planning of the caval segment and trajectory</td></tr>
      <tr><td>Stent-graft placement</td><td>Covered stent from portal vein directly into the IVC (rather than into a hepatic vein remnant), accounting for the different trajectory and length required in the DIPS approach</td></tr>
    </table></div>
    <div class="warn">The DIPS (direct portocaval shunt) technique carries a higher risk of capsular perforation and haemorrhage than standard TIPS because the needle traverses a longer, less predictable path through the liver directly from the IVC — reserve for experienced high-volume operators, with imaging fusion or IVUS guidance strongly recommended.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Anticoagulation Management</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Phase</th><th>Approach</th></tr>
      <tr><td>Initial</td><td>Therapeutic anticoagulation (typically LMWH transitioning to warfarin, or DOAC depending on underlying thrombophilia — warfarin traditionally preferred in antiphospholipid syndrome and some MPN-associated thrombosis) started as soon as diagnosis confirmed and safe from a bleeding perspective</td></tr>
      <tr><td>Peri-procedural (TIPS/angioplasty)</td><td>Anticoagulation typically held peri-procedurally and resumed once haemostasis confirmed, given bleeding risk of hepatic/caval intervention</td></tr>
      <tr><td>Long-term</td><td>Lifelong anticoagulation is standard in most Budd-Chiari patients given the underlying prothrombotic state (particularly MPN, antiphospholipid syndrome) — even after successful TIPS/angioplasty, the systemic thrombophilia persists and shunt/stent thrombosis risk remains</td></tr>
      <tr><td>Underlying MPN treatment</td><td>Concurrent cytoreductive therapy (hydroxyurea, ruxolitinib, or other agents per haematology) to manage the underlying myeloproliferative disorder — treating the cause reduces ongoing thrombotic risk</td></tr>
    </table></div>
    <div class="tip">Anticoagulation is continued indefinitely in essentially all Budd-Chiari patients regardless of whether TIPS/angioplasty has restored hepatic venous outflow — the underlying systemic prothrombotic tendency (MPN, thrombophilia) that caused the original event does not resolve with mechanical treatment of the hepatic venous obstruction.</div>
  </div>
</div>
`;

<h2 class="page-title">Venous Sampling</h2>
<div class="page-meta"><span class="tag tag-section">Section B · Vascular</span><span class="tag tag-freq-med">Commonly Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Inferior Petrosal Sinus Sampling (IPSS)</div>
  <div class="card-body">
    <h4>Indication</h4>
    <p>IPSS distinguishes pituitary (Cushing's disease) from ectopic ACTH-secreting sources as the cause of ACTH-dependent Cushing's syndrome, when biochemical testing and pituitary MRI are discordant, equivocal, or MRI shows no clear pituitary lesion (common — up to 40% of microadenomas are not visible on MRI).</p>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Bilateral femoral vein access (or bilateral jugular in some protocols)</td></tr>
      <tr><td>Catheterisation</td><td>Bilateral catheterisation of the inferior petrosal sinuses (drain the cavernous sinus, which receives pituitary venous outflow) via the internal jugular veins — confirmed with venography showing the characteristic petrosal sinus anatomy</td></tr>
      <tr><td>Sampling protocol</td><td>Simultaneous bilateral IPS and peripheral (femoral vein) blood samples for ACTH at baseline, then after CRH (corticotropin-releasing hormone) stimulation at set intervals (e.g. 3, 5, 10 minutes)</td></tr>
      <tr><td>Prolactin co-sampling</td><td>Simultaneous prolactin sampling is used by some centres to normalise for catheter positioning adequacy/dilutional factors, improving diagnostic accuracy</td></tr>
    </table></div>
    <h4>Interpretation — Lateralisation & Diagnostic Ratios</h4>
    <div class="table-scroll"><table>
      <tr><th>Ratio</th><th>Threshold</th><th>Interpretation</th></tr>
      <tr><td>Central:peripheral ACTH ratio (baseline)</td><td>≥2</td><td>Suggests pituitary source (Cushing's disease)</td></tr>
      <tr><td>Central:peripheral ACTH ratio (post-CRH)</td><td>≥3</td><td>Highly sensitive/specific for pituitary source</td></tr>
      <tr><td>Inter-petrosal sinus ratio (lateralisation, side-to-side)</td><td>≥1.4</td><td>Suggested to lateralise the adenoma to the side with the higher value — but lateralisation accuracy is only moderate (~70%) and should not solely dictate the extent of surgery</td></tr>
      <tr><td>Ratio below thresholds</td><td>—</td><td>Suggests ectopic ACTH source — prompts search for occult neuroendocrine tumour (chest/abdomen imaging, e.g. bronchial carcinoid)</td></tr>
    </table></div>
    <div class="tip">IPSS has high sensitivity and specificity (&gt;95%) for distinguishing pituitary from ectopic ACTH source when both catheters are confirmed correctly positioned — the main technical pitfall is failed or asymmetric catheterisation, which can produce a falsely low central:peripheral gradient and a false impression of an ectopic source.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Adrenal Vein Sampling (AVS)</div>
  <div class="card-body">
    <h4>Indication</h4>
    <p>AVS is used in primary aldosteronism (Conn's syndrome) to distinguish unilateral disease (aldosterone-producing adenoma — surgically curable) from bilateral disease (bilateral adrenal hyperplasia — managed medically with mineralocorticoid receptor antagonists), particularly important because adrenal CT frequently cannot reliably distinguish a functioning adenoma from a non-functioning incidentaloma, and small culprit adenomas can be missed on imaging.</p>
    <h4>Technique</h4>
    <p>See anatomy-gu for adrenal venous anatomy (right adrenal vein short and technically difficult; left drains via a confluence with the inferior phrenic vein into the left renal vein). Bilateral simultaneous or sequential sampling of adrenal vein cortisol and aldosterone, with a simultaneous peripheral (IVC) sample.</p>
    <div class="table-scroll"><table>
      <tr><th>Protocol Element</th><th>Detail</th></tr>
      <tr><td>ACTH stimulation</td><td>Many protocols use continuous ACTH infusion during sampling — reduces stress-induced fluctuation in aldosterone secretion and improves the reliability of the selectivity index</td></tr>
      <tr><td>Sequential vs simultaneous sampling</td><td>Simultaneous bilateral sampling (two operators/catheters) reduces the confounding effect of pulsatile aldosterone secretion between the two sides; sequential sampling is more commonly performed given resource/technical constraints</td></tr>
    </table></div>
    <h4>Diagnostic Ratios</h4>
    <div class="table-scroll"><table>
      <tr><th>Ratio</th><th>Formula / Threshold</th><th>Purpose</th></tr>
      <tr><td>Selectivity index (SI)</td><td>Adrenal vein cortisol ÷ peripheral vein cortisol; threshold ≥3 (unstimulated) or ≥5 (with ACTH stimulation)</td><td>Confirms successful selective cannulation of the adrenal vein (not a tributary or unrelated vein) — mandatory before interpreting the aldosterone data</td></tr>
      <tr><td>Lateralisation index (LI)</td><td>(Aldosterone:cortisol ratio, dominant side) ÷ (Aldosterone:cortisol ratio, non-dominant side); threshold typically ≥4 (with ACTH stimulation)</td><td>LI ≥4 indicates unilateral aldosterone excess (lateralised disease) — supports unilateral adrenalectomy. LI &lt;3 suggests bilateral disease. Intermediate values (3–4) require clinical correlation.</td></tr>
      <tr><td>Contralateral suppression index</td><td>Aldosterone:cortisol ratio of the non-dominant side ÷ peripheral aldosterone:cortisol ratio</td><td>A ratio &lt;1 (suppression of the contralateral gland) supports true unilateral disease and adds confidence to the lateralisation result</td></tr>
    </table></div>
    <div class="warn">Right adrenal vein cannulation fails in a meaningful proportion of AVS attempts (historically up to 25–30% even in experienced hands, though improved with CT-based vein mapping and cone-beam CT guidance) due to its short length and variable origin — an inconclusive selectivity index on the right side invalidates lateralisation interpretation and should prompt a repeat procedure rather than proceeding to a treatment decision on incomplete data.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Parathyroid Venous Sampling</div>
  <div class="card-body">
    <h4>Indication</h4>
    <p>Selective parathyroid venous sampling (PVS) is reserved for persistent or recurrent primary hyperparathyroidism after a failed initial surgical exploration, when non-invasive localisation studies (ultrasound, sestamibi, 4D-CT, choline PET) are negative, discordant, or inconclusive — used to lateralise/localise residual or ectopic hyperfunctioning parathyroid tissue before re-operation.</p>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Femoral vein access; catheterisation of multiple venous stations bilaterally — internal jugular veins, thyroid veins (superior, middle, inferior), thymic veins, and other mediastinal/neck venous tributaries depending on suspected ectopic location</td></tr>
      <tr><td>Sampling</td><td>PTH levels measured at each sampled site plus a peripheral (systemic) reference sample; a gradient at a given venous station suggests a nearby hyperfunctioning gland draining into that vein</td></tr>
      <tr><td>Extent of sampling</td><td>More extensive than AVS/IPSS given the wide range of possible parathyroid locations (normal, ectopic cervical, mediastinal, intrathyroidal) — may require sampling 10+ venous sites</td></tr>
    </table></div>
    <h4>Interpretation — Lateralisation Ratios</h4>
    <div class="table-scroll"><table>
      <tr><th>Ratio</th><th>Threshold</th><th>Interpretation</th></tr>
      <tr><td>Selective:peripheral PTH ratio</td><td>Typically ≥1.5–2× the peripheral level</td><td>A "step-up" gradient at a given site localises the abnormal gland to the venous drainage territory of that site</td></tr>
      <tr><td>Highest gradient site</td><td>—</td><td>Identifies the most likely region for targeted re-exploration — used to guide the surgeon to a focused rather than a repeat bilateral neck exploration, reducing operative time and complication risk (recurrent laryngeal nerve injury, hypoparathyroidism)</td></tr>
    </table></div>
    <div class="tip">Parathyroid venous sampling is technically demanding and time-consuming given the number of venous stations required and the variability of thyroid/thymic venous anatomy — it is generally reserved for tertiary referral centres and used only after non-invasive localisation has failed, given the complexity relative to AVS or IPSS.</div>
  </div>
</div>
`;
