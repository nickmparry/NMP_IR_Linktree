    <div class="table-scroll"><table>
      <tr><th>Collection Type</th><th>Recommended Catheter</th><th>Rationale</th></tr>
      <tr><td>Simple, thin fluid (e.g. seroma, simple abscess with low viscosity pus)</td><td>8–10 Fr pigtail</td><td>Smaller catheters sufficient for low-viscosity fluid; less discomfort, lower insertion risk</td></tr>
      <tr><td>Thick/complex pus, debris</td><td>12–14 Fr (or larger) pigtail; consider multiple side holes</td><td>Larger bore reduces obstruction risk from viscous or particulate material</td></tr>
      <tr><td>Multiloculated or complex collection</td><td>Larger catheter ± multiple catheters for separate loculations; consider adjunctive fibrinolytic instillation (e.g. tPA) if loculations don't respond to single-catheter drainage</td></tr>
      <tr><td>Biliary/urinary/pancreatic fluid collections</td><td>Locking pigtail catheter, typically 8–12 Fr, sized to expected output and viscosity</td><td>Locking mechanism (loop-retaining string) prevents catheter dislodgement given typically longer dwell times</td></tr>
    </table></div>
    <h4>Catheter Design Features</h4>
    <ul>
      <li><strong>Pigtail (self-retaining loop):</strong> standard design for most drainage catheters — loop configuration resists dislodgement</li>
      <li><strong>Multiple side holes:</strong> distributed along the distal segment to maximise drainage surface area and reduce obstruction risk from a single occluded hole</li>
      <li><strong>Locking mechanism:</strong> a suture-locking pigtail loop provides additional security for longer-term drainage catheters</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Trocar vs Seldinger Technique</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Technique</th><th>Method</th><th>Best For</th><th>Considerations</th></tr>
      <tr><td><strong>Trocar</strong></td><td>Catheter mounted on a sharp central stylet advanced directly into the collection in a single step under real-time imaging guidance (typically ultrasound)</td><td>Large, superficial, easily accessible collections with a safe direct trajectory and adequate window</td><td>Faster — single-step; requires a collection large enough and positioned safely enough to tolerate a more forceful single pass; less control than Seldinger for deep or small collections</td></tr>
      <tr><td><strong>Seldinger</strong></td><td>Initial needle access into the collection, confirmed with aspiration ± contrast, wire passed through the needle, tract sequentially dilated, catheter advanced over the wire</td><td>Deep, small, or complex collections; when a controlled, precise, stepwise approach is preferred; most CT-guided drainages</td><td>More steps, longer procedure time, but greater control and ability to confirm position with contrast/aspiration before committing to full catheter placement</td></tr>
    </table></div>
    <div class="tip">The choice is largely governed by collection size, depth, and safety of trajectory rather than institutional preference alone — a large, superficial, easily visualised collection under ultrasound lends itself well to trocar technique; deep or small collections requiring CT guidance more often favour the stepwise control of Seldinger technique.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Drain Management</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Initial aspiration</td><td>Complete initial aspiration of accessible fluid at the time of placement — send for Gram stain, culture, and relevant biochemistry (amylase for suspected pancreatic collection, bilirubin for suspected biloma, creatinine for suspected urinoma)</td></tr>
      <tr><td>Flushing</td><td>Regular saline flushes (e.g. 10 mL normal saline every 8–12h, or per local protocol) to maintain patency, particularly for viscous collections</td></tr>
      <tr><td>Drainage bag/output monitoring</td><td>Daily output volume and character recorded — trend informs decisions on catheter upsizing, imaging follow-up, or removal readiness</td></tr>
      <tr><td>Antibiotic therapy</td><td>Continued per microbiology/infectious disease guidance alongside source control — drainage does not replace appropriate systemic antibiotic therapy for infected collections</td></tr>
      <tr><td>Follow-up imaging</td><td>Repeat ultrasound or CT if output fails to decrease as expected, or if clinical improvement stalls — assesses for residual undrained loculations, catheter malposition, or a new/missed collection</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> When to Upsize or Remove</div>
  <div class="card-body">
    <h4>Indications to Upsize / Reposition / Add a Second Catheter</h4>
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Action</th></tr>
      <tr><td>Persistent high output with clinical signs of ongoing sepsis</td><td>Consider catheter upsizing (exchange over a wire to a larger French size) if output is thick/viscous and current catheter may be undersized</td></tr>
      <tr><td>Output plateau/decline before clinical resolution, imaging shows residual undrained fluid</td><td>Reposition catheter under imaging guidance; consider a second catheter for a separate, inaccessible loculation</td></tr>
      <tr><td>Catheter obstruction (thick debris, fibrin)</td><td>Flush aggressively; consider fibrinolytic instillation (alteplase) for persistent obstruction from loculated/fibrinous material; exchange if flushing fails</td></tr>
      <tr><td>Suspected catheter malposition/dislodgement</td><td>Confirm position with contrast injection (sinogram) under fluoroscopy; reposition or replace as needed</td></tr>
    </table></div>
    <h4>Criteria for Catheter Removal</h4>
    <div class="table-scroll"><table>
      <tr><th>Criterion</th><th>Detail</th></tr>
      <tr><td>Output minimal</td><td>Typically &lt;10–20 mL/day (threshold varies by collection type and institutional protocol)</td></tr>
      <tr><td>Clinical resolution</td><td>Afebrile, resolving leukocytosis/CRP, clinical improvement</td></tr>
      <tr><td>Imaging confirmation</td><td>Repeat imaging (USS or CT, or a contrast sinogram via the catheter) confirms collapse of the cavity with no significant residual collection</td></tr>
      <tr><td>No ongoing communication</td><td>For collections with a suspected fistulous communication (e.g. bowel, biliary, pancreatic duct), a contrast sinogram should confirm no persistent communication before removal — premature removal with an unrecognised fistula risks recollection</td></tr>
    </table></div>
    <div class="warn">Never remove a drainage catheter based on output volume alone without imaging or sinogram confirmation when there is any suspicion of an underlying fistulous communication (enteric, biliary, pancreatic) — low output can reflect catheter obstruction or malposition rather than true resolution, and premature removal risks a recurrent, now inaccessible collection.</div>
  </div>
</div>
`;

      <tr><td>Contrast injection</td><td>Lipiodol (ethiodised oil) injected slowly under fluoroscopic monitoring — opacifies the lymphatic channels draining from the node, allowing real-time tracking of lymphatic flow toward the cisterna chyli and thoracic duct</td></tr>
      <tr><td>Fluoroscopic tracking</td><td>Sequential imaging follows contrast progression through lymphatic channels, cisterna chyli (if present — a dilated lymphatic reservoir at approximately L1–L2, present in ~50% of individuals), and the thoracic duct, up to the site of leak or the venous confluence at the junction of the left subclavian and internal jugular veins</td></tr>

    </table></div>
    <div class="tip">Intranodal lymphangiography is both diagnostic (confirming and localising a lymphatic leak) and the first procedural step toward thoracic duct embolisation — the same Lipiodol opacification used for diagnosis also assists in subsequently identifying the duct for percutaneous cannulation (transabdominal approach) at the cisterna chyli.</div>

</div>

      <tr><td>Cisterna chyli access</td><td>Following intranodal lymphangiography opacification, a transabdominal percutaneous needle is advanced under fluoroscopic guidance to directly puncture the cisterna chyli or a proximal lymphatic trunk (typically a paraspinal approach near L1–L2)</td></tr>
      <tr><td>Duct cannulation</td><td>A microcatheter/microwire is advanced through the needle into the thoracic duct, navigated cranially toward the site of leak or to the venous confluence in the neck</td></tr>
      <tr><td>Embolisation</td><td>Coils and/or liquid embolic (glue — NBCA) deployed to occlude the thoracic duct, typically just proximal to the site of leak, and often also at the cisterna chyli/proximal duct to prevent collateral lymphatic reconstitution</td></tr>
      <tr><td>If duct cannulation fails</td><td>Alternative technique — needle disruption (multiple needle passes through the cisterna chyli/duct region under fluoroscopic guidance without formal cannulation, inducing localised fibrosis and duct disruption) can be effective when the duct cannot be selectively catheterised</td></tr>

      <tr><td><strong>External drainage</strong></td><td>Catheter tip sits proximal to the obstruction; all bile drains externally into a bag</td><td>Initial drainage in an unwell/septic patient; when the stricture cannot be safely crossed at first attempt; active cholangitis requiring rapid decompression</td><td>Advantage: fast, simple, lower immediate risk. Disadvantage: complete loss of enterohepatic bile circulation — electrolyte/nutritional consequences with prolonged external-only drainage; catheter care burden for the patient</td></tr>
      <tr><td><strong>Internal-external drainage</strong></td><td>Catheter crosses the stricture, with side holes both above and below the obstruction and a distal pigtail in the duodenum — can be capped to allow internal drainage or opened to external bag</td><td>Once the stricture has been successfully crossed and the patient is stable — intermediate step before definitive internal stenting, or definitive palliative drainage itself</td><td>Advantage: preserves enterohepatic circulation when capped; provides a safety valve (can be uncapped if internal drainage is inadequate/cholangitis develops). Disadvantage: still an external catheter requiring ongoing care</td></tr>
    </table></div>
    <div class="tip">The typical sequence in a deteriorating/septic patient with malignant biliary obstruction is: external drainage first for rapid, safe decompression → convert to internal-external once stable and stricture crossed → definitive internal SEMS once the patient has recovered and biliary sepsis has resolved, avoiding placement of a permanent internal stent in an unwell, potentially bacteraemic patient.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Cholangioplasty</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Indication</th><th>Detail</th></tr>
      <tr><td>Benign biliary stricture</td><td>Post-surgical (post-cholecystectomy bile duct injury, post-transplant anastomotic stricture — most common indication), post-inflammatory (chronic pancreatitis, IgG4-related sclerosing cholangitis), post-radiotherapy</td></tr>
      <tr><td>Technique</td><td>Percutaneous transhepatic access, balloon dilation of the stricture (typically 6–10 mm balloon depending on duct calibre), often performed as a staged series of dilations over weeks to months with an indwelling catheter maintaining access between sessions</td></tr>
      <tr><td>Repeat dilation protocol</td><td>Serial dilation sessions (e.g. every 2–4 weeks) with progressive catheter upsizing, maintaining transhepatic access throughout the treatment course rather than a single one-off dilation, given the tendency for benign strictures to recur/recoil after a single treatment</td></tr>
      <tr><td>Duration of access</td><td>Total treatment course commonly extends 6–12 months for benign strictures before a trial of catheter removal, reflecting the fibrotic, recoil-prone nature of benign stricture tissue compared to the more mechanically stented approach used for malignant disease</td></tr>
    </table></div>
    <div class="warn">Metal stents (SEMS) are generally avoided for benign biliary strictures given the intended long life expectancy of these patients — SEMS are difficult or impossible to remove once tissue ingrowth occurs, creating a long-term management problem in a population expected to live for years. Balloon dilation ± temporary plastic stenting is preferred for benign disease.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Stone Clearance</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Technique</th><th>Detail</th></tr>
      <tr><td>First-line</td><td>ERCP with sphincterotomy and balloon/basket extraction remains first-line for choledocholithiasis — percutaneous approach reserved for failed ERCP (altered surgical anatomy, e.g. Roux-en-Y, duodenal diverticulum obscuring the papilla, or large/impacted stones)</td></tr>
      <tr><td>Percutaneous transhepatic approach</td><td>Access established, tract matured (often over several days to allow a stable tract for larger instrumentation), then balloon sweep of the duct pushing stones through the sphincter of Oddi into the duodenum, or basket retrieval/fragmentation for larger stones</td></tr>
      <tr><td>Percutaneous transhepatic cholangioscopy</td><td>Direct visualisation via a mature percutaneous tract using a cholangioscope, allowing targeted mechanical or laser/electrohydraulic lithotripsy for large or impacted stones not amenable to simple balloon sweep</td></tr>
      <tr><td>Rendezvous technique</td><td>Combined percutaneous (IR) and endoscopic (ERCP) approach in a single session — percutaneous wire passed antegrade through the papilla into the duodenum, snared endoscopically, allowing endoscopic sphincterotomy and stone extraction using the percutaneous access as a guide when the papilla cannot be cannulated endoscopically alone</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Biliary Stenting — SEMS vs Plastic</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Plastic Stent</th><th>Self-Expanding Metal Stent (SEMS)</th></tr>
      <tr><td>Diameter</td><td>Smaller (typically 7–11.5 Fr)</td><td>Larger (expanded diameter typically 8–10 mm)</td></tr>
      <tr><td>Patency duration</td><td>Shorter — typically occludes within 3–4 months due to biofilm/sludge accumulation in the narrower lumen</td><td>Longer — median patency 6–12 months given larger diameter resists occlusion</td></tr>
      <tr><td>Cost</td><td>Lower per stent, but requires more frequent exchange</td><td>Higher upfront cost, but fewer exchanges needed over a comparable time period — more cost-effective for patients with longer expected survival</td></tr>
      <tr><td>Removability</td><td>Easily removed/exchanged</td><td>Uncovered SEMS essentially permanent (tissue ingrowth); covered SEMS removable but higher migration risk</td></tr>
      <tr><td>Best use</td><td>Short expected survival (weeks to a few months); benign disease requiring eventual removal; bridge before definitive management</td><td>Longer expected survival (&gt;3 months) with unresectable malignant obstruction — the general rule of thumb for choosing SEMS over plastic in palliative malignant biliary obstruction</td></tr>
    </table></div>
    <h4>Covered vs Uncovered SEMS</h4>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Use</th><th>Trade-off</th></tr>
      <tr><td>Uncovered SEMS</td><td>Hilar strictures (allows side-branch bile flow through the mesh at the confluence — see dm-cca); most extrahepatic malignant strictures</td><td>Cannot be removed once tissue ingrowth occurs; tumour ingrowth can cause stent occlusion, treated with a second stent-in-stent rather than removal</td></tr>
      <tr><td>Covered SEMS</td><td>Distal CBD strictures away from the hilum/cystic duct takeoff (covering the cystic duct origin risks acute cholecystitis); situations where future removability matters</td><td>Higher migration risk than uncovered; must avoid covering major side branches (cystic duct, contralateral hepatic duct at the hilum)</td></tr>
    </table></div>
    <div class="tip">Estimated patient survival is the key decision point between plastic and metal biliary stents in the palliative setting — the crossover point where SEMS becomes more cost-effective and clinically preferable is generally considered to be an expected survival beyond approximately 3 months.</div>
  </div>
</div>
`;

<div class="page-meta"><span class="tag tag-section">Section D · GU</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Technique</div>

    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Guidance</td><td>Ultrasound to identify and puncture the target calyx, followed by fluoroscopy for wire manipulation, tract dilation, and catheter positioning; combined US/fluoroscopy is standard</td></tr>
      <tr><td>Target calyx</td><td>Posterior lower or mid-pole calyx via Brödel's avascular line — provides a direct, relatively avascular trajectory and good catheter loop stability in the renal pelvis</td></tr>
      <tr><td>Needle puncture</td><td>21–22G initial access needle into the target calyx; confirm with aspiration of urine ± contrast injection to opacify the collecting system</td></tr>
      <tr><td>Tract dilation</td><td>Sequential fascial dilators over a stiff wire to the catheter's French size</td></tr>
      <tr><td>Catheter placement</td><td>Self-retaining pigtail nephrostomy catheter (typically 8–10 Fr) advanced over the wire with the pigtail loop formed in the renal pelvis</td></tr>
      <tr><td>Confirmation</td><td>Contrast injection through the catheter confirms position and adequate drainage before securing</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Single vs Double Puncture</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Approach</th><th>Use</th><th>Detail</th></tr>
      <tr><td><strong>Single puncture</strong></td><td>Standard for uncomplicated drainage of a non-obstructed or simply obstructed collecting system</td><td>One calyx accessed, catheter placed with the pigtail in the renal pelvis — adequate to drain the whole collecting system in most cases given intrarenal communication between calyces</td></tr>
      <tr><td><strong>Double puncture</strong></td><td>Complex staghorn/branched calculi requiring PCNL access to both upper and lower pole systems; complex, poorly communicating (e.g. post-surgical, congenitally duplicated) collecting systems; when a single access cannot adequately drain isolated, non-communicating calyceal groups</td><td>Two separate calyces accessed and catheterised (or two separate PCNL tracts) to ensure adequate drainage/access to functionally separate portions of the collecting system</td></tr>
    </table></div>
    <div class="tip">A duplex (duplicated) collecting system with two non-communicating moieties (upper and lower pole, each with its own ureter — as in a complete ureteric duplication) requires separate nephrostomy access to each moiety if both need drainage — a single puncture into one moiety will not drain the other.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Antegrade Ureteric Stenting</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Indication</td><td>Definitive internal drainage once obstruction cause identified and nephrostomy access established; avoids external catheter for suitable patients; used for both benign (stone, stricture) and malignant ureteric obstruction</td></tr>
      <tr><td>Technique</td><td>Via existing nephrostomy tract, a hydrophilic wire is negotiated antegrade down the ureter, across the site of obstruction, into the bladder — a double-J (JJ) stent is then advanced over the wire with one coil in the renal pelvis and one coil in the bladder</td></tr>
      <tr><td>Safety/backup catheter</td><td>A temporary nephrostomy catheter is often left in situ alongside or after JJ stent placement for 24–48h to confirm adequate drainage before removal — protects against occult stent malfunction or inadequate drainage in the immediate post-procedure period</td></tr>
      <tr><td>Stent exchange</td><td>Double-J stents require exchange typically every 3–6 months (encrustation, biofilm, and material degradation over time) — usually performed via a retrograde cystoscopic approach by urology, or antegrade via a fresh nephrostomy if retrograde access fails</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Exchange & Urosepsis Management</div>
  <div class="card-body">

      <tr><th>Aspect</th><th>Detail</th></tr>

      <tr><td>Technique</td><td>Catheter exchanged over a guidewire following contrast confirmation of tract patency and collecting system position</td></tr>
      <tr><td>Blocked/dysfunctional catheter</td><td>Sooner exchange indicated — reduced output, leakage around the catheter, or clinical signs of obstruction/infection</td></tr>
    </table></div>
    <h4>Urosepsis Management — Peri-Procedural</h4>
    <div class="table-scroll"><table>
      <tr><th>Principle</th><th>Detail</th></tr>
      <tr><td>Antibiotic prophylaxis</td><td>Broad-spectrum IV antibiotics before nephrostomy placement in any patient with suspected infected/obstructed system — infected hydronephrosis is a surgical/IR emergency requiring urgent decompression</td></tr>
      <tr><td>Minimal manipulation principle</td><td>In an infected obstructed system, the priority is decompression — avoid excessive contrast injection or manipulation that could raise intrarenal pressure and precipitate bacteraemia/septic shock ("pyonephrosis" — do not overdistend the system with contrast before achieving drainage)</td></tr>
      <tr><td>Low-pressure initial drainage</td><td>Aspirate urine for culture immediately upon accessing the collecting system, before injecting any contrast, in a patient with suspected pyonephrosis</td></tr>

      <tr><td>Deferred definitive treatment</td><td>Definitive stone treatment (PCNL) or ureteric stenting for the underlying cause is deferred until sepsis has resolved with a period of external drainage and antibiotic treatment — do not proceed to definitive intervention in the acutely septic patient</td></tr>
    </table></div>
    <div class="warn">In a patient presenting with an obstructed, infected (pyonephrosis) collecting system, prioritise urgent low-pressure decompression over full diagnostic contrast opacification — injecting contrast under pressure into an infected, obstructed system can precipitate bacteraemia and septic shock (pyelovenous/pyelolymphatic backflow of bacteria into the systemic circulation).</div>
  </div>
</div>
`;

<h2 class="page-title">Renal Transplant Interventions</h2>
<div class="page-meta"><span class="tag tag-section">Section D · GU</span><span class="tag tag-freq-med">Commonly Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Transplant Renal Artery Stenosis (TRAS)</div>
  <div class="card-body">
    <p>See anatomy-gu for transplant vascular anatomy. TRAS is the most common vascular complication of renal transplantation, occurring in ~1–10% of transplants.</p>
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Typical location</td><td>At or just distal to the arterial anastomosis (donor renal artery to recipient external/internal iliac artery) — related to surgical technique, vessel size mismatch, or clamp injury; less commonly more diffuse/intrarenal</td></tr>
      <tr><td>Presentation</td><td>New or worsening hypertension resistant to medical therapy, unexplained rise in creatinine, or an audible bruit over the graft — classic triad reflects the physiology of renal artery stenosis affecting a solitary functioning kidney</td></tr>
      <tr><td>Diagnosis</td><td>Duplex ultrasound (elevated peak systolic velocity, turbulence) as first-line screening; confirmed with CT or MR angiography, or catheter angiography if intervention is planned</td></tr>
      <tr><td>Treatment</td><td><strong>Balloon angioplasty</strong> is first-line (± stenting for elastic recoil, dissection, or suboptimal angioplasty result) — technical success high (~90%+); surgical revision reserved for angioplasty failure or unfavourable anatomy given the higher risk of surgical re-exploration of a transplant</td></tr>
      <tr><td>Access considerations</td><td>Contralateral femoral or radial access typically used, with careful catheter shaping to negotiate the acute angle of the anastomosis onto the iliac artery</td></tr>
    </table></div>
    <div class="tip">Because the transplant kidney is typically the patient's only functioning kidney, TRAS causes a disproportionately significant rise in creatinine and blood pressure compared to native renal artery stenosis with a normal contralateral kidney — a high index of suspicion and low threshold for duplex screening is warranted in a transplant patient with new hypertension or unexplained creatinine rise.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Ureteric Obstruction Post-Transplant</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Cause</td><td>Most commonly ischaemic stricture at the ureterovesical anastomosis (the donor ureter's blood supply is entirely dependent on the transplanted renal artery, making the distal ureter particularly vulnerable to ischaemia); also lymphocele compression, rejection-related oedema, or (rarely) stone/blood clot obstruction</td></tr>
      <tr><td>Presentation</td><td>Rising creatinine, hydronephrosis on ultrasound surveillance imaging (routine post-transplant duplex/ultrasound surveillance often detects this before symptoms develop)</td></tr>
      <tr><td>Initial management</td><td>Percutaneous nephrostomy for decompression (same technique principles as d-nephrostomy, adapted to the transplant kidney's ectopic iliac fossa position and typically more superficial location) — provides immediate relief and allows assessment of the obstruction via antegrade nephrostogram</td></tr>
      <tr><td>Definitive management</td><td>Antegrade ureteric stent placement across the stricture if feasible; balloon dilation of a short, focal anastomotic stricture; surgical ureteric reimplantation for strictures not amenable to percutaneous management or recurring despite dilation/stenting</td></tr>
      <tr><td>Lymphocele-related obstruction</td><td>If the cause is external compression by a peri-transplant lymphocele rather than an intrinsic ureteric stricture, percutaneous lymphocele drainage (± sclerotherapy) addresses the underlying cause directly rather than treating the ureter</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> AV Fistula Post-Biopsy</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Incidence</td><td>A recognised complication of transplant renal biopsy (higher relative bleeding/vascular complication risk than native kidney biopsy given the superficial position and proximity to the anastomosed vessels — see anatomy-gu); most AV fistulae are small and clinically silent, detected incidentally on post-biopsy surveillance duplex</td></tr>
      <tr><td>Presentation</td><td>Most are asymptomatic and detected on routine post-biopsy Doppler ultrasound (audible bruit, turbulent flow pattern); larger fistulae can cause haematuria, new or worsening hypertension, or (rarely) high-output cardiac effects or graft dysfunction from a significant vascular steal</td></tr>
      <tr><td>Natural history</td><td>The majority of small post-biopsy AV fistulae close spontaneously within weeks to months without intervention — conservative management with follow-up duplex surveillance is appropriate for small, asymptomatic fistulae</td></tr>
      <tr><td>Indications for intervention</td><td>Persistent fistula with significant flow, symptomatic haematuria, hypertension attributable to the fistula, evidence of graft dysfunction, or a large fistula unlikely to close spontaneously on follow-up imaging</td></tr>
      <tr><td>Treatment</td><td><strong>Selective transcatheter embolisation</strong> — superselective catheterisation of the feeding segmental/interlobar artery supplying the fistula, with coil embolisation to occlude the fistulous connection while preserving as much normal renal parenchyma as possible, given the transplant kidney's importance as the patient's sole renal function</td></tr>
    </table></div>
    <div class="tip">Superselective technique is particularly important when embolising a post-biopsy AV fistula in a transplant kidney — unlike a native kidney with a paired contralateral kidney, unnecessary sacrifice of transplant renal parenchyma directly reduces the patient's total renal function, so the embolisation should be as targeted as possible to the fistula itself.</div>
  </div>
</div>
`;

<h2 class="page-title">MSK Biopsy</h2>
<div class="page-meta"><span class="tag tag-section">Section E · MSK</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Bone vs Soft Tissue Approach</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Bone Lesion</th><th>Soft Tissue Lesion</th></tr>
      <tr><td>Guidance</td><td>CT (most common — allows precise trajectory planning through cortex); fluoroscopy for spine; occasionally MR-guided for lesions poorly seen on CT</td><td>Ultrasound (superficial, well-defined masses) or CT (deep, poorly visualised on US)</td></tr>
      <tr><td>Needle</td><td>Bone biopsy needle/drill system (e.g. Ostycut, powered coaxial drill systems) to penetrate cortex, followed by core sampling of the lesion; trephine or Jamshidi-type needles for sclerotic lesions</td><td>Standard coaxial core biopsy needle (14–18G), no cortical penetration required</td></tr>
      <tr><td>Approach principle</td><td>Trajectory planned in conjunction with the treating orthopaedic oncology surgeon — the biopsy tract must lie within the planned surgical resection field (oncologic principle, see anatomy-msk)</td><td>Same oncologic principle applies — avoid contaminating uninvolved compartments or crossing fascial planes unnecessarily</td></tr>
      <tr><td>Lytic vs sclerotic bone lesions</td><td>Lytic lesions — standard needle biopsy usually adequate. Sclerotic lesions — may require a drill/trephine system to penetrate dense bone; yield can be lower and may need larger core samples</td><td>N/A</td></tr>
    </table></div>
    <div class="warn">Never plan a bone or soft tissue biopsy trajectory without input from the treating surgical oncology team — an incorrectly placed tract can contaminate an otherwise uninvolved compartment, potentially upstaging the surgical resection required or precluding limb-sparing surgery.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Coaxial Technique</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Advantage</th><th>Detail</th></tr>
      <tr><td>Single cortical breach</td><td>Outer coaxial cannula placed once through the cortex/fascial planes; multiple core samples obtained through it without repeat cortical penetration — reduces pain, procedure time, and tract seeding risk</td></tr>
      <tr><td>Reproducible trajectory</td><td>Confirmed position of the outer needle on imaging before sampling ensures every core is taken from the same validated location</td></tr>
      <tr><td>Multiple tissue targets</td><td>Allows sampling from different areas of a heterogeneous lesion (e.g. both a lytic and sclerotic component) through the same access point by angling the inner needle</td></tr>
      <tr><td>Tract management</td><td>On withdrawal, the coaxial sheath can be used to inject a small volume of tissue glue or place a marker at the tract for the surgical team, or in some practices to embolise the tract with gelfoam if seeding risk is a specific concern</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Specimen Handling</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Specimen Destination</th><th>Purpose</th><th>Handling</th></tr>
      <tr><td>Formalin-fixed histology</td><td>Standard histopathological diagnosis, tumour typing, grading</td><td>Majority of cores placed directly into formalin</td></tr>
      <tr><td>Fresh tissue (no fixative)</td><td>Molecular/cytogenetic studies — critical for sarcoma subtyping (many soft tissue and bone sarcomas are defined by specific translocations, e.g. Ewing sarcoma EWSR1 rearrangement)</td><td>At least one core kept fresh/on saline-soaked gauze and transported promptly — coordinate with pathology in advance regarding expected turnaround</td></tr>
      <tr><td>Microbiology</td><td>Suspected infection (osteomyelitis, septic arthritis, discitis) — culture and sensitivity</td><td>Separate core/aspirate sent in sterile saline (not formalin) for culture; consider holding antibiotics pre-biopsy where clinically safe to maximise culture yield</td></tr>
      <tr><td>Cytogenetics/flow cytometry</td><td>Suspected lymphoma or round blue cell tumour in a child (differential includes Ewing sarcoma, lymphoma, rhabdomyosarcoma, neuroblastoma)</td><td>Fresh tissue in appropriate transport medium per local lab protocol — communicate the differential diagnosis to pathology before the procedure so appropriate ancillary tests are set up in advance</td></tr>
    </table></div>
    <div class="tip">For any lesion where sarcoma is a realistic differential, discuss specimen handling requirements with the pathology/molecular laboratory <em>before</em> the biopsy — accurate sarcoma subtyping increasingly depends on molecular/cytogenetic testing that requires fresh (non-formalin-fixed) tissue, and this cannot be retrieved after the fact if only formalin-fixed cores were taken.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Primary vs Metastatic Workup</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Workup Emphasis</th></tr>
      <tr><td>Suspected primary bone/soft tissue sarcoma (no known primary elsewhere)</td><td>MRI of the lesion (local staging), CT chest (metastasis screening — bone/soft tissue sarcomas classically metastasise haematogenously to lung), whole-body imaging (bone scan or PET) as indicated by histological subtype; biopsy performed only after full imaging workup and MDT discussion of trajectory (per the "biopsy last" principle in suspected sarcoma) — biopsy of a suspected primary sarcoma should never precede definitive imaging, unlike most other biopsy indications</td></tr>
      <tr><td>Suspected metastatic bone lesion (known primary malignancy)</td><td>Confirms metastatic disease and can provide tissue for biomarker/molecular testing relevant to systemic therapy selection (e.g. ER/PR/HER2 in breast cancer bone mets, or targetable mutations) — often the more straightforward and common scenario in general IR practice</td></tr>
      <tr><td>New bone lesion, no known primary, atypical imaging features for a benign process</td><td>Full staging CT (chest/abdo/pelvis) to search for an occult primary before biopsy where possible — knowing the likely primary informs biopsy technique and specimen handling; if no primary found, biopsy proceeds with broader differential (primary bone tumour vs metastasis of unknown primary vs myeloma/lymphoma)</td></tr>
    </table></div>
    <div class="warn">A solitary bone lesion in a patient without a known primary malignancy should not be assumed to be metastatic and biopsied casually — until proven otherwise it must be treated with the same "biopsy last, after full imaging and MDT planning" caution as a suspected primary sarcoma, since an inappropriately performed biopsy of a true primary sarcoma can compromise limb-sparing surgical options.</div>
  </div>
</div>
`;

</div>

      <tr><td>Goal</td><td>Dual purpose — pain relief (from stabilisation of microfractures and cement polymerisation exothermic/chemical tumoricidal effect) and structural reinforcement to reduce fracture risk, often combined with prior ablation of the lesion (see f-msk-onc "ablate and augment" combination technique)</td></tr>
      <tr><td>Patient selection</td><td>Symptomatic lytic lesion with cortical involvement/thinning; life expectancy and functional status considered given this is a palliative, not curative, intervention; MDT discussion with orthopaedic oncology particularly for lesions at high fracture risk where prophylactic internal fixation may be preferred or combined with osteoplasty</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Technique</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Guidance</td><td>CT (most common — precise trajectory and real-time cement monitoring) or fluoroscopy, or combined</td></tr>
      <tr><td>Access</td><td>Bone biopsy needle/trocar system advanced to the target lesion, often via a transosseous approach analogous to vertebral access principles</td></tr>
      <tr><td>Pre-cement ablation</td><td>Where combined with ablation (RFA/MWA/cryo — see f-msk-onc), the ablation is performed first through the same or a co-planned access, followed by cement injection once the ablation probe is withdrawn</td></tr>
      <tr><td>Cement injection</td><td>PMMA (polymethylmethacrylate) cement injected under continuous imaging monitoring (fluoroscopy or intermittent CT) in its doughy phase, filling the lytic defect and reinforcing the surrounding trabecular structure</td></tr>
      <tr><td>Volume</td><td>Individualised to lesion size and location — sufficient to provide structural support without excessive extravasation risk; large defects may require a scaffold/mesh-assisted technique in some specialised systems to contain the cement</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Cement Extravasation Risk</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Site of Extravasation</th><th>Risk / Consequence</th><th>Mitigation</th></tr>
      <tr><td>Adjacent soft tissue</td><td>Usually asymptomatic — most common and least clinically significant pattern</td><td>Careful injection under continuous imaging, stopping if cement tracks unexpectedly</td></tr>
      <tr><td>Adjacent joint space</td><td>Can cause joint irritation/pain or impair joint function if significant volume enters an articular space (relevant for periacetabular or proximal femoral lesions near the hip joint)</td><td>Awareness of joint proximity on pre-procedure imaging; slow, monitored injection with immediate cessation if cement approaches the joint margin</td></tr>
      <tr><td>Vascular extravasation (venous)</td><td>Cement can embolise via venous channels to the lungs — pulmonary cement embolism, usually small and asymptomatic but rarely can be clinically significant</td><td>Injection in the appropriately viscous (doughy, not runny) phase reduces vascular tracking; monitor for cement filling venous structures during injection and pause if seen</td></tr>
      <tr><td>Neural structures</td><td>Extravasation toward a nerve root or (in perispinal lesions) the epidural space/cord can cause new neurological deficit</td><td>Careful trajectory planning respecting anatomical margins from neural structures (see e-ablation thermal protection principles for the general concept, though cement leak is a mechanical rather than thermal risk)</td></tr>
    </table></div>
    <div class="warn">Continuous imaging monitoring throughout cement injection — not just before and after — is essential; extravasation, particularly early venous filling, can be recognised and the injection halted before a clinically significant volume has left the intended target, whereas a "inject then check" approach risks a larger, potentially symptomatic leak going unrecognised until it has already occurred.</div>
  </div>
</div>
`;

<h2 class="page-title">Vertebroplasty / Kyphoplasty</h2>
<div class="page-meta"><span class="tag tag-section">Section E · MSK</span><span class="tag tag-freq-med">Commonly Tested</span></div>

    </table></div>
    <div class="tip">The choice between vertebroplasty and kyphoplasty is often guided by fracture morphology and clinical goals — kyphoplasty may be favoured for more acute fractures with significant height loss where kyphosis correction is a specific goal, while vertebroplasty is often preferred for its simplicity and lower cost in stable, chronic, or multi-level painful fractures without a primary height-restoration goal.</div>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Access: Transpedicular vs Extrapedicular</div>

    <p>See anatomy-msk for the underlying pedicle safe-corridor anatomy and needle trajectory angles. Approach selection:</p>
    <div class="table-scroll"><table>

      <tr><td><strong>Transpedicular</strong></td><td>Needle passes directly through the bony pedicle into the vertebral body — the pedicle acts as a protective bony corridor keeping the needle away from the spinal canal medially and the exiting nerve root laterally</td><td>Lumbar vertebrae (pedicles are typically large enough for a single needle to reach the midline of the vertebral body from one side, or bilateral needles for symmetric fill); most commonly used approach given its inherent safety corridor</td></tr>
      <tr><td><strong>Extrapedicular (parapedicular / posterolateral)</strong></td><td>Needle trajectory passes lateral to the pedicle, entering the vertebral body between the pedicle and the rib head (thoracic) or via a more oblique lateral path (lumbar), rather than through the pedicle itself</td><td>Thoracic vertebrae where pedicles are often too small/steeply angled to reliably accommodate a needle reaching the vertebral body midline transpedicularly; useful when a single needle needs to reach further across the midline than a transpedicular approach allows</td></tr>

    </table></div>
    <div class="warn">Thoracic pedicles, particularly in the upper-mid thoracic spine, are frequently too narrow and steeply angled to safely accommodate a standard transpedicular trajectory reaching the vertebral body midline — forcing a transpedicular approach in this situation risks medial pedicle wall breach into the spinal canal; the extrapedicular approach exists specifically to avoid this risk in unsuitable thoracic anatomy.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> PMMA Cement</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Property</th><th>Detail</th></tr>
      <tr><td>Composition</td><td>Polymethylmethacrylate — a self-curing acrylic polymer, mixed from a powder (polymer beads, often with barium sulfate or similar for radiopacity) and a liquid monomer component immediately before use</td></tr>

      <tr><td>Injection timing</td><td>Injection should occur during the doughy phase — injecting too early (too liquid) significantly increases extravasation risk; the cement's working time is limited (typically several minutes) and is temperature-dependent, requiring efficient technique</td></tr>

      <tr><td>Radiopacity</td><td>Cement is radiopaque, allowing continuous fluoroscopic monitoring of fill pattern and early detection of any extravasation during injection</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Cement Leak Patterns</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Leak Pattern</th><th>Route</th><th>Clinical Significance</th></tr>

      <tr><td><strong>Epidural/spinal canal</strong></td><td>Through the posterior vertebral body cortex into the epidural space</td><td>Can cause cord or cauda equina compression — a neurosurgical emergency if causing significant neurological deficit; higher risk with posterior cortical disruption from the underlying fracture/lesion</td></tr>

      <tr><td>Discal (into the intervertebral disc)</td><td>Through an endplate fracture/defect into the adjacent disc space</td><td>Usually asymptomatic acutely, but associated with an increased risk of adjacent-level vertebral fracture over time (altered biomechanical loading on the adjacent vertebral body)</td></tr>
    </table></div>
    <div class="warn">Posterior vertebral body cortical disruption on pre-procedure imaging (common with metastatic lesions and some severe osteoporotic fractures) substantially raises the risk of epidural cement leak — careful pre-procedure review of the posterior cortex, cautious low-volume/low-pressure injection technique, and continuous imaging monitoring are particularly important in this scenario, and the procedure should be aborted or paused immediately if cement is seen approaching the posterior cortical margin.</div>
  </div>
</div>
`;

<h2 class="page-title">IO Fundamentals — Principles & Response Assessment</h2>
<div class="page-meta"><span class="tag tag-section">Section F · Interventional Oncology</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Local Ablation vs Embolisation vs Combination</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Mechanism</th><th>Best Suited For</th></tr>
      <tr><td><strong>Local ablation</strong> (RFA, MWA, cryo, irreversible electroporation)</td><td>Direct cytotoxic destruction of tumour tissue at the probe tip via thermal or non-thermal (electrical) energy — a focal, curative-intent technique for small, well-defined lesions</td><td>Small tumours (generally &lt;3 cm, ideally &lt;3 lesions) where a defined margin of destruction can reliably cover the whole tumour plus an ablative margin — curative intent in early-stage disease (e.g. BCLC 0-A HCC, small RCC, oligometastatic disease)</td></tr>
      <tr><td><strong>Transarterial embolisation</strong> (bland, TACE, TARE)</td><td>Occludes or selectively delivers therapy via the tumour's arterial blood supply — exploits the fact that many tumours (particularly HCC) derive the great majority of their blood supply from the hepatic artery, while normal liver parenchyma is predominantly portally supplied</td><td>Larger or multifocal tumours beyond the size/number threshold for reliable single-session ablation; intermediate-stage disease (BCLC B HCC); tumours where a whole-organ or whole-lobe treatment field is needed</td></tr>
      <tr><td><strong>Combination therapy</strong></td><td>Sequential or same-session ablation + embolisation — embolisation first reduces perfusion-mediated heat/cold sink around the tumour (improving ablation zone predictability and size for larger lesions), and/or delivers a cytotoxic/radiation effect complementary to the ablation zone</td><td>Larger lesions (typically 3–5 cm) at the upper size limit for ablation alone, where combination extends the effective treatable size beyond what either modality alone reliably achieves; e.g. TACE + ablation for HCC 3–5 cm</td></tr>
    </table></div>
    <div class="tip">The rationale for TACE immediately before or combined with ablation in larger HCC is that embolisation reduces the "heat sink" effect from tumour blood flow during subsequent thermal ablation, allowing a larger and more predictable ablation zone than thermal ablation alone could reliably achieve in a similarly sized, well-perfused tumour.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Tumour Microenvironment — IO-Relevant Principles</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Concept</th><th>IO Relevance</th></tr>
      <tr><td>Dual hepatic blood supply</td><td>Normal liver parenchyma receives ~70–80% of its blood supply from the portal vein and ~20–30% from the hepatic artery; HCC (and most hypervascular liver tumours) derive the great majority of their supply from the hepatic artery — this differential is the entire rationale for transarterial hepatic therapies (TACE/TARE), which selectively deliver therapy to the tumour while relatively sparing surrounding normal liver</td></tr>
      <tr><td>Heat sink effect</td><td>Adjacent flowing blood (in a vessel &gt;3 mm) conducts heat away from a thermal ablation zone, reducing achieved temperatures and potentially leaving viable tumour cells near vessels — a key reason perivascular tumours are harder to ablate completely with thermal techniques (RFA more than MWA) and a rationale for combination embolisation-ablation approaches</td></tr>
      <tr><td>Immunogenic cell death</td><td>Ablation (particularly cryoablation and irreversible electroporation) can induce a form of cell death that releases tumour antigens in a manner that may stimulate a systemic anti-tumour immune response (the "abscopal effect") — an area of active research interest in combining ablation with systemic immunotherapy, though not yet standard clinical practice</td></tr>
      <tr><td>Post-embolisation hypoxia and neoangiogenesis</td><td>Incomplete embolisation/ablation can trigger a hypoxia-driven upregulation of VEGF and other angiogenic factors, potentially stimulating residual tumour regrowth and neovascularisation — reinforces the importance of achieving complete treatment (adequate margin) rather than partial, incomplete therapy</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Response Assessment — RECIST 1.1 vs mRECIST</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Criteria</th><th>Basis for Response</th><th>Application</th></tr>
      <tr><td><strong>RECIST 1.1</strong></td><td>Change in the sum of longest diameters of target lesions on unenhanced/standard cross-sectional imaging — measures overall tumour size regardless of viability/enhancement</td><td>Standard response criteria for most solid tumours and systemic oncology trials generally; does not distinguish viable from necrotic (non-enhancing) tumour tissue, a significant limitation after locoregional therapy which often leaves a similarly-sized but now-necrotic (non-viable) lesion</td></tr>
      <tr><td><strong>mRECIST (modified RECIST for HCC)</strong></td><td>Measures only the <strong>viable (arterially enhancing) portion</strong> of the target lesion on contrast-enhanced imaging — necrotic, non-enhancing tumour tissue (including areas successfully treated by TACE/TARE/ablation) is excluded from the measurement</td><td>Developed specifically for HCC given its typical arterial hypervascularity and the fact that locoregional therapy (TACE, TARE, ablation) characteristically leaves necrotic but still similarly-sized tissue that RECIST 1.1 would incorrectly score as stable/non-responding disease</td></tr>
    </table></div>
    <h4>mRECIST Response Categories</h4>
    <div class="table-scroll"><table>
      <tr><th>Category</th><th>Definition</th></tr>
      <tr><td>Complete response (CR)</td><td>Disappearance of any intratumoural arterial enhancement in all target lesions</td></tr>
      <tr><td>Partial response (PR)</td><td>≥30% decrease in the sum of diameters of viable (enhancing) target lesions</td></tr>
      <tr><td>Stable disease (SD)</td><td>Neither PR nor progressive disease criteria met</td></tr>
      <tr><td>Progressive disease (PD)</td><td>≥20% increase in the sum of diameters of viable target lesions, or appearance of new lesions</td></tr>
    </table></div>
    <div class="tip">mRECIST exists specifically because RECIST 1.1 is poorly suited to assessing response after locoregional liver-directed therapy — a large, completely necrotic (successfully treated) HCC can remain unchanged or only slightly reduced in overall size on standard imaging for months, which RECIST 1.1 would score as "stable disease" despite complete tumour kill, whereas mRECIST correctly identifies this as a complete response by measuring only the enhancing (viable) component.</div>
  </div>
</div>
`;

PAGES['f-tace'] = `
<h2 class="page-title">TACE — Transarterial Chemoembolisation</h2>
<div class="page-meta"><span class="tag tag-section">Section F · Interventional Oncology</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">

  <div class="card-body">

      <tr><td>Pharmacokinetics</td><td>Higher peak systemic drug concentration (more rapid release/washout) — associated with more systemic chemotoxicity (nausea, myelosuppression) in some comparative studies</td><td>Sustained, more controlled local drug release with lower peak systemic levels — theoretically reduced systemic chemotoxicity</td></tr>

  </div>
</div>

<div class="card">

  <div class="card-body">

      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Pre-procedure imaging</td><td>Multiphase contrast CT or MRI to confirm tumour number/size, arterial supply pattern, and portal vein patency (see contraindications below)</td></tr>
      <tr><td>Access</td><td>Common femoral artery (or radial) access; catheter advanced to the coeliac axis/common hepatic artery</td></tr>
      <tr><td>Diagnostic angiogram</td><td>Assess hepatic arterial anatomy and variants (see anatomy-arterial Michel classification), identify the tumour-feeding vessel(s), assess portal vein patency on the venous phase</td></tr>
      <tr><td>Superselective catheterisation</td><td>Microcatheter advanced as selectively as possible into the segmental/subsegmental branch(es) directly supplying the tumour — superselective ("segmental" or lesion-directed) TACE reduces non-target embolisation of normal liver parenchyma and improves the therapeutic ratio compared to lobar treatment</td></tr>
      <tr><td>Chemoembolic delivery</td><td>Lipiodol-chemotherapy emulsion (cTACE) or drug-eluting beads (DEB-TACE) injected slowly under fluoroscopic monitoring until near-stasis of antegrade flow is achieved in the target vessel</td></tr>
      <tr><td>Endpoint</td><td>Near-stasis (2–5 heartbeats to clear contrast) in the treated vessel — complete stasis/reflux is avoided as it risks non-target embolisation and does not improve outcomes over a near-stasis endpoint</td></tr>
      <tr><td>Post-procedure imaging</td><td>Non-contrast CT immediately post-procedure (cTACE) shows Lipiodol uptake pattern within the tumour — a marker of treatment distribution; follow-up contrast imaging at 4–6 weeks assesses response (mRECIST — see f-fund)</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Lipiodol — Role & Mechanism</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Property</th><th>Detail</th></tr>
      <tr><td>Composition</td><td>Ethiodised poppy seed oil — an iodinated oil contrast agent</td></tr>
      <tr><td>Selective tumour retention</td><td>When injected into the hepatic artery, Lipiodol is selectively and preferentially retained within HCC tissue (due to the tumour's arterial hypervascularity and altered sinusoidal architecture lacking normal Kupffer cell clearance) for weeks to months, while being cleared relatively quickly from normal liver parenchyma — this differential retention is the basis for its dual role as both a drug carrier and an imaging marker</td></tr>
      <tr><td>Drug carrier role (cTACE)</td><td>Forms an emulsion with the chemotherapeutic agent, prolonging local drug contact time within the tumour compared to chemotherapy injection alone</td></tr>
      <tr><td>Imaging marker role</td><td>Retained Lipiodol is visible as a dense, radiopaque area on non-contrast CT immediately after treatment — used to assess the completeness of treatment distribution across the tumour and can serve as a rough surrogate marker for treated tumour location/extent on subsequent follow-up imaging</td></tr>
      <tr><td>DEB-TACE distinction</td><td>Lipiodol is not used in DEB-TACE — this is a key technical difference between the two TACE approaches (see comparison table above)</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Post-Embolisation Syndrome & TACE Checklist</div>
  <div class="card-body">
    <h4>Post-Embolisation Syndrome (PES)</h4>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Presentation</td><td>Right upper quadrant pain, fever (low-grade), nausea, malaise — expected inflammatory response to tumour/parenchymal ischaemia, occurring in the majority of patients to some degree</td></tr>
      <tr><td>Timing</td><td>Onset within hours, typically peaks 24–48h, resolves over 3–7 days</td></tr>
      <tr><td>Management</td><td>Analgesia (opioids often required for the first 24–48h), antiemetics, antipyretics; most managed with overnight admission and can be discharged once oral intake and pain are adequately controlled</td></tr>
      <tr><td>Distinguishing from complication</td><td>Persistent fever beyond 5–7 days, rising inflammatory markers beyond the expected trajectory, or signs of liver decompensation/abscess should prompt investigation for infection (liver abscess — particularly relevant in patients with a bilioenteric anastomosis given ascending infection risk), rather than being attributed to expected PES</td></tr>
    </table></div>
    <h4>TACE Pre-Procedure Checklist</h4>
    <div class="table-scroll"><table>
      <tr><th>Item</th><th>Rationale</th></tr>
      <tr><td>Child-Pugh / liver function assessment</td><td>TACE in decompensated cirrhosis (Child-Pugh C) risks precipitating liver failure — generally reserved for Child-Pugh A, selected B; avoided in C</td></tr>
      <tr><td>Portal vein patency</td><td>Main portal vein thrombosis is a relative-to-absolute contraindication to TACE in many protocols — normal liver relies on portal flow, and combined arterial embolisation with portal compromise risks severe hepatic ischaemia/infarction; branch/segmental PVT is a less absolute contraindication with adequate collateral flow</td></tr>
      <tr><td>Bilirubin</td><td>Significantly elevated bilirubin is a relative contraindication/caution — reflects impaired hepatic reserve</td></tr>
      <tr><td>Renal function</td><td>Contrast load considerations, particularly with repeat procedures</td></tr>
      <tr><td>Biliary-enteric anastomosis / prior sphincterotomy</td><td>Higher risk of hepatic abscess post-TACE given ascending bacterial contamination of the biliary tree — some protocols use peri-procedural antibiotic prophylaxis in this group</td></tr>
      <tr><td>Tumour burden assessment</td><td>Confirm number/size/distribution of lesions and eligibility per BCLC staging (see dm-hcc) before proceeding</td></tr>
    </table></div>
    <div class="warn">Main portal vein thrombosis is one of the most important contraindications to check before TACE — normal hepatic parenchyma depends predominantly on portal venous inflow, so combining arterial embolisation with an already-compromised portal supply risks precipitating acute hepatic ischaemia/failure; TARE is often better tolerated than TACE in the setting of portal vein thrombosis given its different embolic profile (see f-tare).</div>
  </div>
</div>
`;

<h2 class="page-title">TARE — Transarterial Radioembolisation (Y-90)</h2>
<div class="page-meta"><span class="tag tag-section">Section F · Interventional Oncology</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Yttrium-90 Physics</div>

      <tr><td>Isotope</td><td>Yttrium-90 (⁹⁰Y) — a pure beta-emitter (no clinically significant gamma emission, simplifying radiation safety compared to gamma-emitting isotopes)</td></tr>
      <tr><td>Half-life</td><td>64.2 hours (~2.7 days)</td></tr>
      <tr><td>Mean tissue penetration</td><td>~2.5 mm mean, ~11 mm maximum — a relatively short-range, high-energy beta particle allowing localised tumoricidal radiation with relative sparing of tissue beyond a few millimetres from the microsphere deposition site</td></tr>
      <tr><td>Mechanism</td><td>Microspheres loaded with ⁹⁰Y are injected into the hepatic artery and lodge in the tumour's arteriolar/capillary bed (exploiting the same arterial hypervascularity principle as TACE — see f-fund) delivering localised internal radiation over subsequent days as the isotope decays; unlike TACE, TARE is not primarily an embolic/ischaemic technique — the therapeutic effect is radiation-mediated, and significant vessel occlusion is not the goal</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Resin vs Glass Microspheres</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Resin Microspheres (SIR-Spheres)</th><th>Glass Microspheres (TheraSphere)</th></tr>
      <tr><td>Sphere size</td><td>~20–60 µm</td><td>~20–30 µm</td></tr>
      <tr><td>Number of spheres per treatment</td><td>Higher number of spheres for an equivalent activity (lower activity per sphere) — more embolic effect given the higher particle count</td><td>Lower number of spheres for an equivalent activity (higher activity per sphere) — less embolic effect, allowing higher radiation doses to be delivered with relatively less vascular occlusion</td></tr>
      <tr><td>Embolic effect</td><td>More embolic — can cause more significant flow stasis, particularly relevant when considering treatment in patients with borderline portal vein flow</td><td>Less embolic — often preferred/considered safer in patients with portal vein thrombosis given the reduced additional flow-limiting effect</td></tr>
      <tr><td>Dosimetry method historically</td><td>Body surface area (BSA) method traditionally used (though partition model increasingly applied)</td><td>MIRD (Medical Internal Radiation Dose) method traditionally used, allowing higher tumour-absorbed doses to be calculated and delivered</td></tr>
      <tr><td>Regulatory approval basis</td><td>FDA-approved for colorectal liver metastases (with chemotherapy) and HCC</td><td>FDA-approved (humanitarian device exemption historically, now broader) predominantly for HCC</td></tr>
    </table></div>
    <div class="tip">The choice between resin and glass microspheres is influenced by the clinical scenario — glass spheres' lower embolic effect and MIRD-based higher achievable tumour dose make them a common choice for radiation segmentectomy/lobectomy strategies aiming for ablative-intent high-dose treatment, while resin spheres have a longer track record in colorectal liver metastases treatment protocols.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Lung Shunt Fraction</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Aspect</th><th>Detail</th></tr>
      <tr><td>Cause</td><td>Arteriovenous shunting within or around the tumour allows a fraction of injected material to bypass the hepatic capillary bed and pass via the hepatic vein → IVC → right heart → pulmonary circulation; more pronounced in larger, more hypervascular tumours (particularly HCC, especially with a higher tumour burden)</td></tr>
      <tr><td>Pre-treatment assessment</td><td>Performed at the "work-up" angiogram (mapping angiogram) using a technetium-99m macroaggregated albumin (⁹⁹ᵐTc-MAA) injection into the hepatic artery, followed by planar or SPECT imaging to calculate the percentage of activity reaching the lungs relative to the liver — used as a surrogate to predict the ⁹⁰Y lung shunt fraction (LSF) that would occur with the therapeutic microspheres</td></tr>
      <tr><td>LSF thresholds</td><td>LSF &lt;10%: standard dosing proceeds. LSF 10–20%: dose reduction required to keep lung radiation dose within safe limits. LSF &gt;20%: treatment is generally contraindicated or requires very significant dose reduction — excessive lung radiation risks radiation pneumonitis</td></tr>
      <tr><td>Maximum lung dose limit</td><td>Cumulative lung dose is capped (commonly cited threshold ~30 Gy for a single treatment, ~50 Gy cumulative across multiple treatments) — LSF-based dose adjustment ensures this ceiling is not exceeded</td></tr>

    <div class="warn">The pre-treatment ⁹⁹ᵐTc-MAA mapping angiogram is not merely a formality — it identifies both the lung shunt fraction (for dose safety) and any extrahepatic gastrointestinal shunting (stomach, duodenum, pancreas via aberrant/collateral vessels) that would risk radiation-induced GI ulceration if not identified and coil-embolised (or the catheter position adjusted) before the therapeutic treatment.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Dosimetry — BSA, MIRD & Partition Models</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Method</th><th>Basis</th><th>Typical Association</th></tr>
      <tr><td><strong>Body surface area (BSA) method</strong></td><td>Empirical formula incorporating the patient's body surface area and the estimated tumour involvement fraction of the liver — a simpler, population-based dosing approach not directly personalising to individual tumour vs normal liver dose distribution</td><td>Historically associated with resin microspheres; simpler to apply but less precisely tailored to individual dosimetry</td></tr>
      <tr><td><strong>MIRD (Medical Internal Radiation Dose) method</strong></td><td>Calculates activity based on desired absorbed dose (Gy) to the target liver volume (tumour + treated liver mass), using the injected liver volume and target dose in the calculation</td><td>Historically associated with glass microspheres; allows for higher, more individually tailored tumour-absorbed doses</td></tr>
      <tr><td><strong>Partition model</strong></td><td>The most personalised approach — separately estimates the tumour-to-normal-liver uptake ratio (from the pre-treatment MAA SPECT/CT) to calculate distinct absorbed doses to the tumour compartment, the normal liver compartment, and the lung compartment, allowing dose optimisation to maximise tumour dose while respecting normal liver and lung dose constraints</td><td>Increasingly used across both microsphere types for personalised, dosimetry-driven treatment planning, particularly for radiation segmentectomy/lobectomy ablative-intent strategies</td></tr>
    </table></div>
    <div class="tip">The partition model represents the most sophisticated and individualised of the three dosimetry approaches because it explicitly accounts for the tumour-to-normal-liver uptake ratio measured on the patient's own pre-treatment MAA scan, rather than relying on population-average assumptions (BSA method) or a single target-volume dose calculation without separating tumour and background liver uptake (standard MIRD) — this individualisation is central to modern "radiation segmentectomy" ablative-intent TARE protocols aiming for very high tumour-absorbed doses.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Radioembolisation Syndrome</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Presentation</td><td>Fatigue (often the most prominent and persistent symptom), low-grade fever, nausea, abdominal discomfort, anorexia</td></tr>
      <tr><td>Comparison to TACE post-embolisation syndrome</td><td>Generally milder in intensity than TACE's PES (given TARE's predominantly radiation-mediated rather than ischaemic mechanism) but the <strong>fatigue component is often more prolonged</strong>, sometimes persisting for 1–2 weeks or longer, reflecting the ongoing radiobiological effect over the isotope's decay period rather than an acute ischaemic insult</td></tr>

    </table></div>
  </div>
</div>

<h2 class="page-title">Tumour Ablation — RFA vs MWA vs Cryoablation</h2>
<div class="page-meta"><span class="tag tag-section">Section F · Interventional Oncology</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Mechanism Comparison</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Mechanism</th><th>Cell Death Pathway</th></tr>
      <tr><td><strong>Radiofrequency Ablation (RFA)</strong></td><td>Alternating current (~450–500 kHz) passed between an active electrode and grounding pads causes ionic agitation and resistive (Joule) heating of tissue around the electrode tip</td><td>Coagulative necrosis when tissue temperature exceeds ~60°C; cell membrane and protein denaturation</td></tr>
      <tr><td><strong>Microwave Ablation (MWA)</strong></td><td>Electromagnetic energy (~900 MHz–2.45 GHz) causes water molecules to rapidly oscillate, generating frictional heat directly and more uniformly throughout the target tissue volume, rather than relying on electrical conduction from a point source</td><td>Coagulative necrosis, typically achieving higher peak temperatures more quickly than RFA</td></tr>
      <tr><td><strong>Cryoablation</strong></td><td>Argon gas causes rapid cooling (Joule-Thomson effect) to form an ice ball around the probe tip, with cyclical freeze-thaw cycles (typically 2 freeze cycles separated by an active thaw)</td><td>Direct cellular injury from ice crystal formation (intracellular and extracellular), osmotic shift, vascular thrombosis in the microcirculation, and apoptosis in the peripheral (less severely frozen) zone of the ice ball</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Size Limits & Heat Sink Effect</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Typical Single-Probe Effective Size Limit</th><th>Heat Sink Susceptibility</th></tr>
      <tr><td>RFA</td><td>~3 cm reliably with a single electrode (multi-tined/cluster electrodes can extend this); older single-electrode systems limited to smaller volumes</td><td><strong>Most susceptible</strong> — relies on electrical/thermal conduction through tissue, which is significantly disrupted by adjacent flowing blood in vessels &gt;3 mm carrying heat away from the ablation zone before adequate coagulative temperatures are reached</td></tr>
      <tr><td>MWA</td><td>Larger, more predictable ablation zones than RFA for an equivalent single-probe application (~3–5 cm), with the ability to use multiple probes simultaneously to further extend coverage</td><td><strong>Less susceptible</strong> than RFA — MWA generates heat throughout the tissue volume directly via dielectric heating rather than depending on electrical conduction, making it comparatively more resistant to (though not entirely immune from) the heat sink effect, an advantage for perivascular tumours</td></tr>
      <tr><td>Cryoablation</td><td>Multiple probes commonly combined ("probe clustering") to sculpt a larger, more customised ice ball shape to match irregular tumour geometry, extending effective coverage beyond a single probe's ice ball</td><td>Analogous "heat sink" phenomenon exists for cryoablation (sometimes termed a thermal sink in this context) — adjacent flowing blood can locally warm tissue and limit the achieved freeze temperature nearby, similarly reducing ablation completeness near larger vessels</td></tr>
    </table></div>
    <div class="warn">Heat sink effect is a critical consideration when planning ablation of a tumour adjacent to a vessel ≥3 mm in diameter (e.g. a major hepatic or portal vein branch) — the vessel-adjacent tumour margin is at highest risk of incomplete ablation and local recurrence; MWA is generally preferred over RFA in this scenario given its comparatively greater resistance to the effect, and combination with transarterial embolisation (see f-fund) is an alternative strategy to reduce blood flow before thermal ablation.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Margin Adequacy</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Concept</th><th>Detail</th></tr>
      <tr><td>Ablative margin</td><td>The zone of ablated (destroyed) tissue must extend beyond the visible tumour margin on imaging by a defined safety margin — analogous to a surgical resection margin — because microscopic tumour extension beyond the imaging-visible tumour boundary is common, particularly in infiltrative tumours</td></tr>
      <tr><td>Target margin</td><td>A minimum ≥5 mm circumferential ablative margin beyond the tumour edge is the generally cited target for most solid organ ablations (liver, kidney, lung) — margins &lt;5 mm are associated with significantly higher local tumour progression rates in multiple published series</td></tr>
      <tr><td>Assessment</td><td>Confirmed on immediate post-ablation contrast-enhanced imaging (CT or MRI) — the ablation zone should show no residual enhancement within the treated area and should visually encompass the pre-treatment tumour outline with an adequate margin on image fusion/comparison</td></tr>
      <tr><td>Consequence of inadequate margin</td><td>Local tumour progression (recurrence at the ablation site margin) — the most common mode of ablation failure, distinguishing it from a "new" metachronous lesion elsewhere in the organ</td></tr>
    </table></div>
    <div class="tip">Achieving an adequate ablative margin is the single most important technical determinant of long-term local tumour control after ablation — probe positioning should be planned not simply to cover the visible tumour, but to ensure the entire tumour plus a 5mm (or greater) margin falls within the anticipated ablation zone for the chosen modality, energy, and time settings.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Applicator Selection</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Consideration</th><th>Detail</th></tr>
      <tr><td>Number of applicators/probes</td><td>Single probe for small, favourably located tumours within that modality's reliable single-probe coverage; multiple simultaneous probes for larger tumours or to achieve a more customised ablation zone shape matching tumour geometry (particularly useful for cryoablation ice ball sculpting and for MWA/RFA when treating larger lesions)</td></tr>
      <tr><td>Tumour location relative to critical structures</td><td>Cryoablation often favoured near critical structures (bowel, nerve, ureter, bladder) given the directly visible ice ball margin on CT/MRI allowing real-time confidence in the treatment margin relative to the at-risk structure, combined with hydrodissection/warming protective techniques (see d-renal-mass, e-ablation)</td></tr>
      <tr><td>Perivascular location</td><td>MWA generally favoured over RFA for tumours adjacent to vessels ≥3 mm given its reduced heat sink susceptibility (see above)</td></tr>
      <tr><td>Coagulopathy</td><td>Cryoablation is associated with a theoretically higher bleeding risk at probe removal compared to thermal modalities (which cauterise the needle tract as the probe is withdrawn) — some protocols use active tract ablation/cauterisation on cryoprobe withdrawal or favour thermal modalities in higher bleeding risk patients</td></tr>
      <tr><td>Number of lesions</td><td>Multiple simultaneous applicators from different manufacturers/generators can allow synchronous multi-lesion treatment in a single session for oligometastatic disease, reducing total procedure time and anaesthesia exposure compared to sequential single-probe treatments</td></tr>
      <tr><td>Institutional/generator availability</td><td>Practical consideration — choice of modality is also guided by which ablation systems and generators are available at a given institution, alongside the clinical/technical factors above</td></tr>
    </table></div>
  </div>
</div>
`;

<h2 class="page-title">Malignant Biliary Obstruction — IO Perspective</h2>
<div class="page-meta"><span class="tag tag-section">Section F · Interventional Oncology</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Stent Type Selection — SEMS vs Plastic</div>
  <div class="card-body">
    <p>See c-hpb for full technical detail on stent types and biliary drainage principles. Key decision points in the malignant setting:</p>
    <div class="table-scroll"><table>
