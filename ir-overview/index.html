  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Vascular Closure Devices</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Device</th><th>Mechanism</th><th>Max Sheath</th><th>Key Points</th></tr>
      <tr><td>Angioseal (Terumo)</td><td>Collagen plug + anchor sandwich arteriotomy</td><td>8Fr</td><td>Anchor inside lumen resorbs in 60–90 days; cannot re-access same site for 90 days; contraindicated if CFA heavily calcified or atherosclerotic</td></tr>
      <tr><td>Perclose ProGlide (Abbott)</td><td>Suture-mediated arteriotomy closure; permanent monofilament suture</td><td>Up to 24Fr (pre-close technique for EVAR)</td><td>Requires vessel diameter ≥5 mm; can deploy 2 devices at 60° offset for large-bore closure (pre-close)</td></tr>
      <tr><td>Mynx (Cardinal Health)</td><td>Extraluminal PEG sealant plug in perivascular space</td><td>7Fr</td><td>No intraluminal component; can re-access earlier than Angioseal; requires long arteriotomy for purchase</td></tr>
      <tr><td>MANTA (Teleflex)</td><td>Large-bore collagen plug; dedicated TAVI/EVAR 14–22Fr closure</td><td>22Fr</td><td>Position-sensitive; ultrasound-guided deployment; failure rate higher than surgical cut-down in experienced hands</td></tr>
    </table></div>
    <h4>Closure Device Failure — Management</h4>
    <ul>
      <li>Angioseal failure (bleeding despite deployment): manual compression; if persistent → ultrasound-guided thrombin injection for pseudoaneurysm; surgical if manual fails</li>
      <li>Perclose failure: apply manual compression immediately and hold for 20 min; balloon tamponade from contralateral access if brisk haemorrhage; surgical repair if needed</li>
      <li>Absolute contraindications to any closure device: puncture not in CFA (profunda, SFA, or above inguinal ligament); heavily calcified arteriotomy; active infection at site</li>
    </ul>
    <div class="tip">Pre-close technique (Perclose for large-bore): deploy 1–2 ProGlide devices at start of procedure before sheath upsizing. Leave sutures untied. After procedure: remove sheath, tie sutures sequentially to close large arteriotomy. Requires technique experience — have surgical backup available.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Thrombectomy & Aspiration Devices</div>
  <div class="card-body">
    <div class="table-scroll"><table>
      <tr><th>Device</th><th>Mechanism</th><th>Vessel / Indication</th></tr>
      <tr><td>Indigo (Penumbra)</td><td>Continuous aspiration; CAT 6/8/12 Fr catheters; ENGINE pump</td><td>PE (FLASH trial); DVT; peripheral arterial thrombus; venous</td></tr>
      <tr><td>AngioJet (BD/Bayer)</td><td>Rheolytic thrombectomy — high-speed saline jets create Venturi effect; thrombus aspirated; power pulse mode for thrombus softening</td><td>DVT (PEARL); PE; dialysis graft; peripheral arterial</td></tr>
      <tr><td>ASPIREX (Straub)</td><td>Rotating Archimedes screw aspiration</td><td>DVT (iliac-femoral, subclavian); PE</td></tr>
      <tr><td>FlowTriever (Inari)</td><td>Large-bore aspiration (20Fr) + trilobed nitinol disc for thrombus engagement; PE-specific</td><td>Massive/submassive PE (FLASH trial); no thrombolytics needed</td></tr>

<h2 class="page-title">ISSVA Classification & Yakes AVM Types</h2>
<div class="page-meta"><span class="tag tag-section">Classification Systems</span><span class="tag tag-freq-med">Commonly Tested</span></div>

<div class="card">

    <p>The <strong>International Society for the Study of Vascular Anomalies (ISSVA)</strong> classification divides vascular anomalies into two fundamentally different categories: <strong>tumours</strong> (neoplastic proliferation of endothelial cells) and <strong>malformations</strong> (structural errors of morphogenesis — present from birth, grow commensurately, never involute).</p>

      <tr><td><strong>Congenital haemangioma (RICH/NICH)</strong></td><td>Fully formed at birth; RICH rapidly involutes; NICH never involutes</td><td>GLUT-1 negative (distinguishes from IH); may have central pallor or purple hue</td><td>RICH: observe → involutes by 12–14 months; NICH: surgery if symptomatic</td></tr>
      <tr><td><strong>Kaposiform haemangioendothelioma (KHE)</strong></td><td>Locally aggressive; associated with <strong>Kasabach-Merritt phenomenon</strong> (consumptive coagulopathy: thrombocytopenia, hypofibrinogenaemia)</td><td>Diffuse firm mass; deep dermal/retroperitoneal; platelet trapping in tumour</td><td>Sirolimus (first-line); vincristine; steroids; embolisation for haemorrhage</td></tr>

    <h4>Vascular Malformations</h4>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Flow</th><th>Components</th><th>Key Features</th><th>IR Treatment</th></tr>
      <tr><td><strong>Capillary malformation (CM)</strong></td><td>Slow-flow</td><td>Capillaries</td><td>Port-wine stain; flat, pink-to-purple; Sturge-Weber syndrome if facial V1 distribution</td><td>Not typically IR-treated; pulsed dye laser</td></tr>

    <div class="warning"><strong>Critical distinction:</strong> "Haemangioma" in adults is almost always a misnomer — most are venous malformations (VMs), NOT infantile haemangiomas. True infantile haemangiomas are a disease of infancy that involutes. Using correct ISSVA terminology avoids inappropriate treatment (propranolol won't work on a VM; sclerotherapy is not indicated for a proliferating IH).</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Yakes AVM Classification</div>
  <div class="card-body">
    <p>The Yakes classification categorises peripheral AVMs by angioarchitecture, which directly determines treatment approach and embolic agent selection.</p>
    <div class="table-scroll"><table>
      <tr><th>Type</th><th>Angioarchitecture</th><th>Diagram</th><th>Treatment Approach</th></tr>

    <h4>Key Treatment Principles for AVMs</h4>
    <ul>
      <li><strong>NEVER embolise feeding arteries alone</strong> — collateral recruitment will restore flow to the nidus; the AVM recurs and becomes harder to treat. The nidus is the target</li>

    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Venous Malformation Sclerotherapy</div>
  <div class="card-body">
    <p>Venous malformations (VMs) are the most common vascular malformation referred to IR. Percutaneous sclerotherapy is the mainstay of treatment.</p>
    <h4>Sclerosant Selection</h4>
    <div class="table-scroll"><table>
      <tr><th>Agent</th><th>Mechanism</th><th>Best For</th><th>Risks/Limitations</th></tr>
      <tr><td><strong>Ethanol (absolute)</strong></td><td>Endothelial destruction → thrombosis → fibrosis; permanent</td><td>Large VMs; deep VMs; most effective single agent</td><td>Most toxic — pain, tissue necrosis, nerve injury, skin ulceration, haemoglobinuria, cardiac depression at high volumes (&gt;1 mL/kg); GA required</td></tr>
      <tr><td><strong>Sodium tetradecyl sulphate (STS / Sotradecol)</strong></td><td>Detergent sclerosant → endothelial damage; as foam = more effective (higher surface area contact)</td><td>Superficial VMs; facial VMs (less tissue destruction than ethanol); moderate-size VMs</td><td>Skin discoloration; DVT risk if large-volume venous drainage; less effective for large deep VMs than ethanol</td></tr>

    </table></div>
    <h4>Technique Highlights</h4>
    <ul>
      <li><strong>Access:</strong> Direct percutaneous puncture of the VM under USS guidance; confirm intravascular position with contrast injection under fluoroscopy</li>

  </div>
</div>

<div class="card">

<div class="card">

    <p>Downstaging uses locoregional therapy (TACE, TARE, ablation) to reduce tumour burden to within transplant criteria, enabling listing for patients who initially exceed them.</p>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Bridging to Transplant</div>
  <div class="card-body">
    <p>Bridging treats patients already within Milan criteria who are on the transplant waitlist, preventing tumour progression beyond criteria during the waiting period.</p>
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Evidence</th><th>When Preferred</th></tr>
      <tr><td>TACE</td><td>Most established; reduces dropout from waitlist</td><td>Multinodular within Milan; Child-Pugh A–B</td></tr>

      <tr><td>Stereotactic body RT (SBRT)</td><td>Emerging; useful for patients not suitable for IR procedures</td><td>Difficult anatomical access; prior TACE/ablation failure</td></tr>
    </table></div>
    <div class="tip">Bridging is indicated when expected wait time &gt;6 months. AASLD/EASL recommend treatment if wait &gt;6 months for tumours ≥2 cm. Goal is to maintain within Milan — not necessarily achieve CR (though CR correlates with better post-transplant outcomes).</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Post-Treatment Surveillance & mRECIST</div>
  <div class="card-body">
    <p>Response assessment uses <strong>mRECIST</strong> (modified RECIST), which measures enhancing viable tumour rather than total tumour size — essential for locoregional therapy assessment.</p>
    <div class="table-scroll"><table>
      <tr><th>mRECIST</th><th>Definition</th><th>Action</th></tr>
      <tr><td>Complete Response (CR)</td><td>No arterial enhancement in all target lesions</td><td>Continue surveillance; consider ablation of residual if possible</td></tr>
      <tr><td>Partial Response (PR)</td><td>≥30% decrease in sum of viable (enhancing) diameters</td><td>Re-TACE if liver function preserved; reassess for transplant listing</td></tr>
      <tr><td>Stable Disease (SD)</td><td>&lt;30% decrease or &lt;20% increase in viable diameters</td><td>Re-TACE if viable tumour present and liver function allows</td></tr>
      <tr><td>Progressive Disease (PD)</td><td>≥20% increase in viable diameters or new lesions</td><td>Reassess BCLC stage; consider switch to systemic if BCLC C; retreat if still B</td></tr>
    </table></div>
    <h4>Surveillance Schedule</h4>
    <ul>
      <li>After curative treatment (ablation/resection): CT/MRI at 1 month (baseline), then 3-monthly × 2 years, then 6-monthly</li>
      <li>After TACE/TARE: CT/MRI at 4–6 weeks post-procedure; re-TACE decisions based on ART score or objective response + liver function</li>
      <li>Re-TACE contraindications: Child-Pugh C, ECOG PS ≥2, progressive tumour despite 2 × TACE (consider TARE or systemic)</li>
    </ul>
    <div class="tip">AFP trend is useful alongside imaging — rising AFP with stable imaging may indicate new viable foci not yet visible. Falling AFP after TACE is a good prognostic indicator.</div>
  </div>
</div>
`;

<h2 class="page-title">Portal Hypertension — MDT Management Pathway</h2>
<div class="page-meta"><span class="tag tag-section">Disease Management</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Pathophysiology & HVPG</div>
  <div class="card-body">
    <p>Portal hypertension (PH) = portal pressure above 5 mmHg. Clinically significant PH (CSPH) = HVPG ≥10 mmHg — this threshold predicts variceal formation, decompensation risk, and post-resection liver failure.</p>
    <h4>Hepatic Venous Pressure Gradient (HVPG)</h4>
    <div class="table-scroll"><table>
      <tr><th>HVPG</th><th>Significance</th><th>Clinical Correlate</th></tr>
      <tr><td>&lt;5 mmHg</td><td>Normal</td><td>—</td></tr>
      <tr><td>5–9 mmHg</td><td>Subclinical PH</td><td>No varices; no decompensation</td></tr>
      <tr><td><strong>≥10 mmHg (CSPH)</strong></td><td>Clinically significant</td><td>Variceal formation; decompensation risk; high-risk for post-hepatectomy liver failure</td></tr>
      <tr><td>≥12 mmHg</td><td>Variceal bleeding threshold</td><td>Risk of first variceal bleed; mandatory primary prophylaxis</td></tr>
      <tr><td>≥16–20 mmHg</td><td>Refractory ascites / recurrent bleeding territory</td><td>TIPS typically indicated</td></tr>
    </table></div>
    <p><strong>HVPG Measurement:</strong> Transjugular hepatic vein catheterisation. Wedged hepatic venous pressure (WHVP) − free hepatic venous pressure (FHVP) = HVPG. Balloon occlusion technique is gold standard. Normal FHVP = 2–6 mmHg; WHVP approximates sinusoidal/portal pressure in cirrhosis.</p>
    <div class="tip">HVPG only reflects sinusoidal (intrahepatic) portal hypertension — the most common type (cirrhosis). Pre-sinusoidal (PVT, schistosomiasis) or post-sinusoidal (Budd-Chiari, RHF) causes have normal or elevated FHVP and are not accurately measured by HVPG.</div>
    <h4>Aetiology Classification</h4>
    <div class="table-scroll"><table>
      <tr><th>Level</th><th>Causes</th></tr>
      <tr><td>Pre-hepatic</td><td>Portal vein thrombosis (PVT), splenic vein thrombosis, AV fistula</td></tr>
      <tr><td>Intrahepatic — Pre-sinusoidal</td><td>Schistosomiasis, primary biliary cholangitis (early), congenital hepatic fibrosis</td></tr>
      <tr><td>Intrahepatic — Sinusoidal</td><td>Cirrhosis (all causes) — most common</td></tr>
      <tr><td>Intrahepatic — Post-sinusoidal</td><td>Sinusoidal obstruction syndrome (SOS/VOD), Budd-Chiari</td></tr>
      <tr><td>Post-hepatic</td><td>Right heart failure, constrictive pericarditis, IVC obstruction, Budd-Chiari</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Variceal Bleeding Management Pathway</div>
  <div class="card-body">
    <h4>Primary Prophylaxis (before first bleed)</h4>
    <div class="table-scroll"><table>
      <tr><th>Situation</th><th>Recommended Prophylaxis</th></tr>
      <tr><td>Small varices + no red signs + Child-Pugh A</td><td>No treatment; repeat EGD in 2–3 years</td></tr>
      <tr><td>Small varices + red signs OR Child-Pugh B/C</td><td>Non-selective beta-blocker (NSBB: propranolol or carvedilol)</td></tr>
      <tr><td>Medium/large varices</td><td>NSBB (first-line) OR endoscopic band ligation (EBL) if NSBB intolerant/contraindicated</td></tr>
    </table></div>
    <div class="tip">Carvedilol (12.5 mg/day) is preferred over propranolol for primary prophylaxis — superior HVPG reduction, better tolerability. Target: HVPG reduction to &lt;12 mmHg or &gt;20% reduction from baseline (haemodynamic responder = significantly lower bleed risk).</div>
    <h4>Acute Variceal Bleed — Emergency Protocol</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Intervention</th><th>Timing</th></tr>
      <tr><td>1. Resuscitation</td><td>Restrictive transfusion (Hb target 70–80 g/L); avoid over-resuscitation (worsens portal pressure)</td><td>Immediate</td></tr>
      <tr><td>2. Vasoactive drugs</td><td>Terlipressin (2 mg IV q6h, first 24–48h then 1 mg q6h) OR octreotide/somatostatin; continue 3–5 days</td><td>Immediately on clinical suspicion, before endoscopy</td></tr>
      <tr><td>3. Antibiotics</td><td>IV ceftriaxone 1 g/day × 7 days (or norfloxacin); SBP prophylaxis improves survival</td><td>Immediately</td></tr>
      <tr><td>4. Endoscopy</td><td>EGD + band ligation within 12 hours (ideally &lt;6h if Child-Pugh C)</td><td>&lt;12 hours of presentation</td></tr>
      <tr><td>5. TIPS (early/pre-emptive)</td><td>In high-risk patients (see below); within 72h of index bleed</td><td>After initial control</td></tr>
    </table></div>
    <h4>Baveno VII (2022) High-Risk Criteria — Pre-emptive TIPS</h4>
    <p>Pre-emptive TIPS within <strong>72 hours</strong> (ideally &lt;24h) improves survival in high-risk acute variceal bleeders:</p>
    <ul>
      <li>Child-Pugh C (≤13 points) OR</li>
      <li>Child-Pugh B (7–9) + active bleeding at endoscopy</li>
      <li>HVPG ≥20 mmHg at time of acute bleed (if available)</li>
    </ul>
    <div class="warn">Child-Pugh C ≥14 or MELD &gt;24 = very high mortality even with TIPS; discuss with hepatology — benefit is less clear and transplant pathway should be prioritised if possible.</div>
    <h4>Secondary Prophylaxis (after first bleed)</h4>
    <ul>
      <li>Combination NSBB + EBL (superior to either alone)</li>
      <li>TIPS if: rebleeding despite combination therapy; Child-Pugh B/C with active bleed; HVPG ≥20 mmHg</li>
      <li>Transplant assessment: variceal bleed = decompensation event → consider listing</li>
    </ul>
    <h4>Salvage TIPS (failure of initial control)</h4>
    <p>Uncontrolled or recurrent bleed within 5 days despite vasoactive drugs + endoscopy → immediate TIPS or balloon tamponade (Sengstaken-Blakemore or Linton-Nachlas) as bridge to TIPS.</p>
    <div class="tip">Baveno VI introduced the concept of "early TIPS" (now "pre-emptive TIPS" in Baveno VII) as standard of care in high-risk patients — this changed practice significantly. Covered stents (e-PTFE) are mandatory for TIPS — uncovered stents have unacceptable stenosis rates.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> TIPS — Patient Selection & Pre-Procedure Workup</div>
  <div class="card-body">
    <h4>Indications</h4>
    <div class="table-scroll"><table>
      <tr><th>Indication</th><th>Evidence Grade</th></tr>
      <tr><td>Acute variceal haemorrhage — salvage (failure of medical/endoscopic control)</td><td>Strong</td></tr>
      <tr><td>Pre-emptive TIPS in high-risk acute bleed (Baveno VII criteria)</td><td>Strong</td></tr>
      <tr><td>Secondary prophylaxis — recurrent variceal bleed despite NSBB + EBL</td><td>Strong</td></tr>
      <tr><td>Refractory ascites (requiring &gt;3 LVP/year)</td><td>Strong</td></tr>
      <tr><td>Hepatic hydrothorax (refractory)</td><td>Moderate</td></tr>
      <tr><td>Budd-Chiari syndrome (medical failure)</td><td>Moderate</td></tr>
      <tr><td>Portal hypertensive gastropathy (refractory)</td><td>Moderate</td></tr>
      <tr><td>Ectopic variceal bleeding</td><td>Moderate</td></tr>
    </table></div>
    <h4>Absolute Contraindications</h4>
    <ul>
      <li>Severe right heart failure (PCWP &gt;15 mmHg, TR — increased risk of cardiac decompensation from increased preload)</li>
      <li>Severe hepatic encephalopathy (uncontrolled grade 3–4 HE)</li>
      <li>Unrelieved biliary obstruction (risk of biliary sepsis from hepatic vein-biliary communication)</li>
      <li>Uncontrolled systemic infection / sepsis</li>
      <li>Severe irreversible liver failure (Child-Pugh C ≥14 or MELD &gt;18 are relative, depending on urgency)</li>
      <li>Polycystic liver disease (technical — extensive cysts prevent passage)</li>
    </ul>
    <h4>Pre-TIPS Workup</h4>
    <div class="table-scroll"><table>
      <tr><th>Investigation</th><th>Purpose</th></tr>
      <tr><td>Doppler US liver/portal system</td><td>Portal vein patency (thrombosis = technical challenge, not absolute CI); hepatic vein anatomy; liver size</td></tr>
      <tr><td>CT or MRI with contrast</td><td>Tumour exclusion; detailed vascular anatomy; IVC/hepatic vein anatomy for planning</td></tr>
      <tr><td>Echocardiogram</td><td>Exclude right heart failure, pulmonary hypertension (PAP &gt;45 mmHg = relative CI)</td></tr>
      <tr><td>LFTs, coagulation, FBC, renal function</td><td>Child-Pugh / MELD calculation; periprocedural risk</td></tr>
      <tr><td>EEG / psychometric testing</td><td>Baseline HE assessment; predict post-TIPS HE risk</td></tr>
    </table></div>
    <div class="tip">Predictors of post-TIPS hepatic encephalopathy: age &gt;65, pre-existing HE, Child-Pugh C, low albumin, low Na. Consider TIPS + HE prophylaxis protocols (lactulose, rifaximin). TIPS shunt diameter &lt;10 mm (8 mm covered stent) reduces HE risk in elective refractory ascites patients (EASL 2022 guidance).</div>
    <div class="warn">MELD &gt;18 (some say &gt;15): carefully weigh TIPS benefit vs risk of hepatic decompensation. In refractory ascites (non-emergency), MELD is a key prognostic marker — MELD &gt;18 may have better outcomes with transplant than TIPS.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Refractory Ascites — Management Pathway</div>
  <div class="card-body">
    <p>Refractory ascites = ascites that cannot be controlled with maximal diuretic therapy (spironolactone 400 mg + frusemide 160 mg/day) OR diuretic-induced complications preclude their use.</p>
    <div class="table-scroll"><table>
      <tr><th>Option</th><th>Indication</th><th>Notes</th></tr>
      <tr><td>Large-volume paracentesis (LVP) + albumin</td><td>All patients — first-line palliation</td><td>Albumin 6–8 g per litre removed &gt;5L (prevents post-paracentesis circulatory dysfunction); 4-weekly or as needed</td></tr>
      <tr><td>TIPS</td><td>Requiring LVP &gt;3×/year; no major HE or cardiac contraindications; Child-Pugh ≤12 or MELD ≤18</td><td>Controls ascites in ~60–70%; improves QoL; potential survival benefit over LVP in selected patients (ATTIRE, ANSWER trials); increases HE risk</td></tr>
      <tr><td>Liver transplant</td><td>Ascites as decompensation = transplant indication; MELD-based allocation</td><td>Refractory ascites on transplant list = high urgency; TIPS as bridge</td></tr>
      <tr><td>Tolvaptan / satavaptan</td><td>Hyponatraemia-associated ascites</td><td>V2 receptor antagonist; limited evidence for survival benefit; not standard first-line</td></tr>
      <tr><td>Alfapump (subcutaneous peritoneal drain)</td><td>Patients unsuitable for TIPS or transplant</td><td>Automated LVP via implanted pump; infection and renal impairment risk</td></tr>
    </table></div>
    <h4>Baveno VI/VII Definitions for TIPS in Ascites</h4>
    <ul>
      <li><strong>Baveno VI (2015):</strong> TIPS recommended for refractory ascites; covered stents mandatory; 8 mm diameter preferred to limit HE risk</li>
      <li><strong>Baveno VII (2022):</strong> Confirms covered TIPS (e-PTFE) as standard; emphasises that TIPS improves transplant-free survival vs LVP in carefully selected patients; recommends early referral for transplant in all refractory ascites patients</li>
      <li>Lactulose + rifaximin prophylaxis recommended post-TIPS for HE prevention</li>
    </ul>
    <div class="tip">TIPS target post-procedure portal pressure gradient (PPG) &lt;12 mmHg (ideally &lt;8 mmHg) for ascites; &lt;12 mmHg for bleeding prevention. Measure PPG at end of procedure and adjust stent diameter accordingly.</div>
  </div>
</div>
`;

<h2 class="page-title">Colorectal Liver Metastases (CRLM) — Management Pathway</h2>
<div class="page-meta"><span class="tag tag-section">Disease Management</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Resectability Assessment</div>
  <div class="card-body">
    <p>CRLM are present in ~50% of CRC patients at some point. Unlike HCC, CRLM arise in non-cirrhotic livers — so the focus is on adequacy of future liver remnant (FLR), not underlying liver disease. <strong>MDT decision-making</strong> (hepatobiliary surgery + oncology + IR) is essential.</p>
    <h4>Resectability Criteria (ESMO/EORTC framework)</h4>
    <div class="table-scroll"><table>
      <tr><th>Category</th><th>Definition</th><th>Goal</th></tr>
      <tr><td><strong>Upfront resectable</strong></td><td>All CRLM removable in R0 fashion; FLR ≥25% (non-steatotic); &lt;3 hepatic segments involved</td><td>Surgery first; no neoadjuvant required but often given</td></tr>
      <tr><td><strong>Potentially resectable</strong></td><td>Technically unresectable now but may become resectable with downsizing or FLR augmentation</td><td>Conversion chemotherapy ± IR (TARE, ablation) → reassess → surgery</td></tr>
      <tr><td><strong>Unresectable</strong></td><td>Extensive bilateral disease; ≥4 hepatic segments involved; FLR inadequate despite augmentation; extrahepatic disease beyond control</td><td>Palliative: systemic ± liver-directed therapy (TARE, TACE) for symptom/progression control</td></tr>
    </table></div>
    <h4>FLR Requirements (standardised FLR — sFLR = FLR / total liver volume)</h4>
    <div class="table-scroll"><table>
      <tr><th>Liver Status</th><th>Minimum sFLR</th></tr>
      <tr><td>Normal liver (no chemotherapy damage, no steatosis)</td><td>≥25–30%</td></tr>
      <tr><td>Chemotherapy-associated steatohepatitis (CASH) — &gt;6 cycles oxaliplatin</td><td>≥40%</td></tr>
      <tr><td>Sinusoidal obstruction syndrome (irinotecan hepatotoxicity)</td><td>≥40%</td></tr>
    </table></div>
    <div class="warn">Oxaliplatin-based chemotherapy causes sinusoidal injury ("blue liver" — sinusoidal obstruction syndrome). Irinotecan causes steatohepatitis. Both increase post-resection liver failure risk — sFLR thresholds must be applied more conservatively after prolonged chemotherapy.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Ablation — Criteria, Modality Selection, Role of IR</div>
  <div class="card-body">
    <p>Ablation (RFA, MWA, or cryoablation) is used as a <strong>primary treatment</strong> (in unresectable or patient-preference scenarios) or as an <strong>adjunct to resection</strong> ("ablate and resect" strategy to treat bilobar disease in a single operation).</p>
    <h4>Ideal Ablation Criteria for CRLM</h4>
    <ul>
      <li>≤3 lesions (some centres extend to ≤5 if small)</li>
      <li>Each lesion ≤3 cm (preferred); up to 5 cm with MWA in experienced centres</li>
      <li>≥1 cm clear margin achievable (R0 ablation — margin &lt;5 mm associated with local recurrence rates &gt;50%)</li>
      <li>No major vascular or biliary proximity precluding safe margin</li>
      <li>No extrahepatic uncontrolled disease</li>
    </ul>
    <h4>Ablation Modality Comparison for CRLM</h4>
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Advantages</th><th>Disadvantages / Notes</th></tr>
      <tr><td>RFA</td><td>Well-established; good local control for ≤3 cm; CT guidance</td><td>Heat-sink effect near vessels &gt;3 mm; limited ablation zone size (~4 cm); higher local recurrence for CRLM vs HCC (desmoplastic stroma)</td></tr>
      <tr><td>MWA</td><td>Larger ablation zone; less susceptible to heat-sink; faster; can treat tumours &gt;3 cm</td><td>Less predictable margin geometry; risk of thermal injury if not carefully planned</td></tr>
      <tr><td>Cryoablation</td><td>Visible ice-ball on CT; better for tumours near bile ducts (cold less injurious than heat); no heat-sink</td><td>Larger probe; cryo-shock (rare); haemorrhage risk; slower</td></tr>
      <tr><td>Irreversible electroporation (IRE)</td><td>Non-thermal; safe adjacent to bile ducts, vessels, bowel</td><td>Expensive; requires general anaesthesia + muscle relaxants; limited zone size; evidence still maturing for CRLM</td></tr>
    </table></div>
    <div class="tip">For CRLM, local recurrence rates after ablation are higher than HCC at the same size (~20–30% at 3 cm vs ~5–10% for HCC). This is partly due to desmoplastic tumour borders making adequate margin harder to achieve. A 10 mm ablative margin should be the goal wherever technically feasible.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Portal Vein Embolisation (PVE) for FLR Augmentation</div>
  <div class="card-body">
    <p>PVE induces hypertrophy of the future liver remnant (FLR) by redirecting portal blood flow from the tumour-bearing lobe to the contralateral lobe. Standard pre-operative technique before extended hepatectomy when FLR is inadequate.</p>
    <h4>PVE — Key Facts</h4>
    <div class="table-scroll"><table>
      <tr><th>Parameter</th><th>Detail</th></tr>
      <tr><td>Approach</td><td>Percutaneous ipsilateral (same side as resection) portal vein access; typically right-sided approach for right hepatectomy. Ipsilateral approach avoids needle pass through FLR.</td></tr>
      <tr><td>Target</td><td>Embolise portal branches to segments being resected (right lobe ± segment 4 for right trisectionectomy)</td></tr>
      <tr><td>Embolic agents</td><td>n-BCA (glue) + Lipiodol (most effective); PVA particles; coils; combination. n-BCA superior to particles alone for hypertrophy (denser embolisation, less recanalization).</td></tr>
      <tr><td>Degree of hypertrophy (DH)</td><td>FLR should increase by ≥5% sFLR or KGR ≥2% per week; reassess CT volumetry at 4–6 weeks</td></tr>
      <tr><td>Inadequate response</td><td>Consider repeat PVE, hepatic vein embolisation (HVE) to augment effect (simultaneous PVE + HVE = "liver venous deprivation"), or ALPPS</td></tr>
    </table></div>
    <h4>Liver Venous Deprivation (LVD)</h4>
    <p>Simultaneous PVE + hepatic vein embolisation of the resection side. More complete devascularisation of future-resected lobe → faster, greater hypertrophy of FLR. Achieves similar hypertrophy to ALPPS in some series with lower morbidity than ALPPS stage 1.</p>
    <div class="tip">Kinetic growth rate (KGR) = change in sFLR (%) per week. KGR &lt;2% per week after PVE = inadequate response → consider LVD, ALPPS, or systemic oncology discussion. Adequate hypertrophy: FLR reaches threshold AND growth has plateaued (typically 4–8 weeks post-PVE).</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> ALPPS — Associating Liver Partition and Portal Vein Ligation</div>
  <div class="card-body">
    <p>ALPPS achieves rapid FLR hypertrophy (~70–100% increase in 1–2 weeks) vs ~30–40% for PVE over 4–6 weeks. A 2-stage surgical procedure.</p>
    <h4>ALPPS Two-Stage Procedure</h4>
    <div class="table-scroll"><table>
      <tr><th>Stage</th><th>What Happens</th><th>Timing</th></tr>
      <tr><td><strong>Stage 1</strong></td><td>Surgical ligation of portal vein to resection side + in-situ liver splitting (partition) along resection plane while leaving hepatic veins and arteries intact</td><td>Day 0</td></tr>
      <tr><td><strong>Stage 2</strong></td><td>Completion hepatectomy once FLR has hypertrophied sufficiently (sFLR ≥25–30%)</td><td>Usually 7–14 days post stage 1</td></tr>
    </table></div>
    <h4>ALPPS vs PVE — When to Choose</h4>
    <div class="table-scroll"><table>
      <tr><th>ALPPS Favoured</th><th>PVE Favoured</th></tr>
      <tr><td>Insufficient time for PVE (rapidly progressing disease)</td><td>FLR borderline, time permits 4–6 week wait</td></tr>
      <tr><td>Failed / inadequate PVE response</td><td>Standard right hepatectomy; no previous inadequate PVE</td></tr>
      <tr><td>Contralateral (segment 4) involvement requiring trisectionectomy</td><td>Patient unfit for two major surgical stages</td></tr>
      <tr><td>Bilateral disease requiring total clearance</td><td>—</td></tr>
    </table></div>
    <div class="warn">ALPPS stage 1 morbidity is significant (~30–40%); 90-day mortality ~8–10% in original series. Perioperative bile leak, liver failure, and sepsis are main concerns. Should be performed only in high-volume HPB centres. Recent refinements (mini-ALPPS, laparoscopic ALPPS) have improved outcomes.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Role of TARE (Y-90) in CRLM</div>
  <div class="card-body">
    <p>TARE with yttrium-90 microspheres is used in CRLM for: disease control in unresectable patients, liver-dominant disease progression on chemotherapy, and as a <em>radiation lobectomy</em> / conversion strategy.</p>
    <div class="table-scroll"><table>
      <tr><th>Role</th><th>Evidence</th><th>Patient Selection</th></tr>
      <tr><td>Palliative disease control (hepatic-only / liver-dominant)</td><td>SIRFLOX, FOXFIRE, EPOCH trials — improved hepatic PFS; no OS benefit in unselected population but benefit in right-lobe treated patients (FOXFIRE subgroup)</td><td>Chemotherapy-refractory; limited extrahepatic disease; good PS (ECOG 0–1)</td></tr>
      <tr><td>Radiation lobectomy (conversion strategy)</td><td>Case series; growing evidence — selective high-dose lobar TARE → tumour response + FLR contralateral hypertrophy; potential downstage to resection</td><td>Dominant right-lobe disease, inadequate FLR; consider before PVE decision</td></tr>
      <tr><td>Conversion to resectability</td><td>EPOCH-CONVERT; retrospective series; ~20–30% of initially unresectable patients converted to resection</td><td>Multidisciplinary assessment; baseline FLR, tumour response on systemic chemo</td></tr>
    </table></div>
    <div class="tip">Radiation lobectomy = high-dose lobar TARE to the diseased lobe, causing tumour destruction PLUS contralateral FLR hypertrophy over 6–8 weeks (typically 15–30% sFLR increase). Avoids the need for PVE in some patients, and delivers treatment simultaneously. Glass microspheres (TheraSphere) allow very high absorbed doses per run.</div>
    <div class="warn">TARE is NOT standard first-line for resectable CRLM. Role in 2nd/3rd-line or as a conversion strategy is established in multidisciplinary practice but patient selection must be individualised. Hepatopulmonary shunt fraction &gt;20% = contraindication to Y-90 (radiation pneumonitis risk).</div>
  </div>
</div>
`;

    <div class="tip">In functional NETs undergoing ANY embolization procedure: pre-medicate with IV octreotide 250–500 mcg/h starting 12h prior and continue 24h post-procedure to prevent <strong>carcinoid crisis</strong> (hypertensive or hypotensive crisis, bronchospasm, flushing). This is potentially life-threatening — never skip in functional carcinoid tumours.</div>

      <tr><td>Type IV</td><td>Both sides to second-order ducts (multicentric or bilateral)</td><td>Usually unresectable; complex bilateral drainage needed for palliation</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Resectable vs Unresectable — Decision Pathway</div>

</div>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Angiosome-Directed Therapy</div>
  <div class="card-body">
    <p>The angiosome concept (Taylor & Palmer, 1987) divides the foot and leg into 3D tissue territories supplied by specific source arteries. In CLTI with tissue loss, restoring direct flow to the angiosome containing the wound (direct revascularisation) is associated with better wound healing compared to indirect revascularisation.</p>

    <h4>Clinical Application</h4>
    <ul>

      <li>Wound on the <strong>medial sole</strong>: target the medial plantar branch of posterior tibial</li>

    <div class="warn">In diabetic patients with calcified tibial arteries, ABI may be falsely elevated (ABI &gt;1.3 = non-compressible). Use <strong>toe-brachial index (TBI)</strong> — TBI &lt;0.7 indicates ischaemia; TBI &lt;0.5 suggests CLTI. Transcutaneous oxygen pressure (TcPO2) &lt;30 mmHg at wound site predicts poor healing without revascularisation.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Wound Healing MDT & When NOT to Intervene</div>
  <div class="card-body">
    <h4>Wound Healing MDT Components</h4>
    <div class="table-scroll"><table>
      <tr><th>Discipline</th><th>Role</th></tr>
      <tr><td>Vascular surgery / IR</td><td>Revascularisation; define anatomy; decide endovascular vs bypass</td></tr>

      <tr><td>Endocrinology / Diabetes</td><td>Glucose optimisation (HbA1c target); neuropathy management</td></tr>
      <tr><td>Infectious disease</td><td>Bone vs soft tissue infection; osteomyelitis workup (MRI ± bone biopsy); antibiotic selection</td></tr>
      <tr><td>Orthopaedics</td><td>Surgical debridement, Charcot reconstruction, minor / major amputation</td></tr>
      <tr><td>Rehabilitation</td><td>Prosthetics, gait training post-amputation; functional optimisation</td></tr>
      <tr><td>Nutrition</td><td>Protein supplementation; hypoalbuminaemia (albumin &lt;30 g/L) delays wound healing</td></tr>
    </table></div>
    <h4>When NOT to Intervene</h4>
    <div class="table-scroll"><table>
      <tr><th>Situation</th><th>Rationale</th></tr>
      <tr><td>Claudication — adequate walking distance, stable lifestyle</td><td>Natural history is benign in non-smokers on medical therapy; procedural risk exceeds benefit</td></tr>
      <tr><td>Non-reconstructable anatomy</td><td>No suitable outflow target; infected graft bed; diffuse calcification precluding catheter passage</td></tr>
      <tr><td>Unsalvageable limb</td><td>Extensive gangrene above forefoot; infection tracking to deep compartments of mid-foot; primary amputation is safer than failed revascularisation</td></tr>
      <tr><td>Poor life expectancy (&lt;6 months)</td><td>Goal shifts to comfort and pain management; major revascularisation not justified</td></tr>
      <tr><td>Patient declines / frailty</td><td>Shared decision-making; high-risk bypass in frail patient may worsen QoL without benefit</td></tr>
      <tr><td>Active infection uncontrolled</td><td>Revascularisation into infected territory risks graft infection; control infection first with debridement + antibiotics before revascularisation</td></tr>
    </table></div>
    <div class="warn">Primary amputation should not be seen as failure — in an unsalvageable limb, timely amputation and rapid rehabilitation is superior to repeated futile revascularisation attempts that delay prosthetic fitting and prolong hospitalisation.</div>
  </div>
</div>

<div class="card">

  <div class="card-body">
    <h4>Compartment Syndrome & Fasciotomy</h4>

      <tr><th>Mechanism</th><th>Consequence</th><th>Management</th></tr>

  </div>
</div>

      <tr><td><strong>Type Ib</strong></td><td>Inadequate distal iliac seal</td><td>High pressure; rupture risk; treat urgently</td><td>Iliac limb extension; or IBD if common iliac aneurysm</td></tr>

      <tr><td><strong>Type IV</strong></td><td>Fabric porosity (early generation devices)</td><td>Usually self-limiting; seen in first 30 days; not clinically significant</td><td>Observation; resolves as thrombus forms</td></tr>

    </table></div>
    <h4>Post-EVAR Surveillance Protocol</h4>
    <div class="table-scroll"><table>
      <tr><th>Time Point</th><th>Imaging</th><th>What to Assess</th></tr>
      <tr><td>30 days post-EVAR</td><td>CT angiography (with/without contrast)</td><td>Endoleak type; sac diameter; stent position; limb patency</td></tr>
      <tr><td>12 months</td><td>CT angiography</td><td>Sac shrinkage (goal: &gt;5 mm reduction); endoleak; limb kinking</td></tr>
      <tr><td>Annual thereafter</td><td>Duplex USS (if sac stable at 1 year, no endoleak) or CT every 2–5 years</td><td>Sac size change; endoleak detection; device integrity</td></tr>
      <tr><td>If Type II endoleak detected</td><td>6-month interval CT</td><td>Sac growth? If expanding: intervene. If stable: continue 6-monthly</td></tr>
    </table></div>
    <div class="warn">Sac expansion (&gt;5 mm increase) is the key intervention trigger for type II endoleak — sac size, not endoleak presence alone, drives management. A type II endoleak with stable or shrinking sac can be observed indefinitely. Type I and III endoleaks require intervention regardless of sac size due to direct systemic pressure transmission.</div>
  </div>
</div>
`;

<h2 class="page-title">Lung Cancer — IR Management Pathway</h2>
<div class="page-meta"><span class="tag tag-section">Disease Management</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> CT-Guided Percutaneous Lung Biopsy</div>
  <div class="card-body">
    <p>CT-guided percutaneous transthoracic needle biopsy (PTNB) is the primary method for obtaining tissue diagnosis of peripheral lung lesions. It establishes histological subtype and provides sufficient material for molecular/PD-L1 testing, which directly determines systemic therapy selection.</p>
    <h4>Indications & Contraindications</h4>
    <div class="table-scroll"><table>
      <tr><th>Indications</th><th>Relative Contraindications</th><th>Absolute Contraindications</th></tr>

      <tr><th>Step</th><th>Detail</th></tr>

    <h4>Complications</h4>
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Incidence</th><th>Management</th></tr>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Percutaneous Thermal Ablation — Stage I NSCLC</div>
  <div class="card-body">
    <p>Percutaneous thermal ablation is a guideline-endorsed alternative to surgery for <strong>stage IA NSCLC in medically inoperable patients</strong>. NCCN, ESMO, and ACCP all recognise ablation when surgery is contraindicated or declined. Best outcomes are for tumours ≤3 cm.</p>

      <tr><th>Ideal Candidate</th><th>Relative Contraindication</th><th>Not Appropriate</th></tr>

    </table></div>
    <h4>Modality Comparison for Lung Ablation</h4>
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Mechanism</th><th>Advantages</th><th>Limitations</th></tr>
      <tr><td><strong>Microwave (MWA)</strong></td><td>Electromagnetic oscillation → rapid high-temperature heating</td><td>Fast ablation time; larger zones; less heat-sink effect; currently most used for lung</td><td>Less long-term data than RFA; harder to predict zone shape</td></tr>

    </table></div>
    <h4>Outcomes</h4>
    <div class="table-scroll"><table>
      <tr><th>Endpoint</th><th>Ablation (≤3 cm)</th><th>SBRT Comparison</th><th>Surgery (lobectomy)</th></tr>
      <tr><td>Local control (3 yr)</td><td>~80–90%</td><td>~90–95%</td><td>~95–98%</td></tr>
      <tr><td>Overall survival (3 yr)</td><td>~60–70%</td><td>~55–70%</td><td>~80–90%</td></tr>
      <tr><td>Procedure mortality</td><td><1%</td><td><1%</td><td>1–4%</td></tr>

    <div class="tip">Ablation vs SBRT: No completed RCTs directly comparing the two. Both are guideline-endorsed for inoperable stage IA. Ablation advantage = repeatable, immediate imaging confirmation, tissue sampling possible at same session. SBRT advantage = non-invasive, no pneumothorax risk, better for central tumours. Choice often depends on local expertise and tumour location.</div>
    <h4>Follow-Up Imaging After Ablation</h4>
    <div class="table-scroll"><table>
      <tr><th>Timepoint</th><th>Expected Findings</th><th>Concerning Findings</th></tr>

      <tr><td>1 month</td><td>Consolidation/cavity at ablation site; surrounding GGO resolving</td><td>Increasing size with enhancement — incomplete ablation</td></tr>
      <tr><td>3–6 months</td><td>Progressive shrinkage; central cavity may persist; no enhancement</td><td>Nodular enhancement at margin = local recurrence → consider re-ablation</td></tr>
      <tr><td>Annual</td><td>Scar/fibrosis ± thin-wall cavity; no enhancement; stable or decreasing</td><td>New enhancement; increasing size; new PET avidity</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Bronchial Artery Embolisation (BAE) for Haemoptysis</div>
  <div class="card-body">
    <p>Lung cancer is one of the most common causes of massive haemoptysis. BAE is the first-line interventional treatment for life-threatening haemoptysis, achieving immediate haemostasis in >90% of cases.</p>
    <h4>Anatomy</h4>
    <ul>
      <li><strong>Bronchial arteries</strong> arise from the descending thoracic aorta, typically between T5–T6 vertebral levels</li>
      <li>Most common pattern (Cauldwell): 2 left + 1 right bronchial arteries; right bronchial commonly shares a trunk with an intercostal artery (<strong>ICBT — intercostobronchial trunk</strong>)</li>
      <li><strong>Anterior spinal artery</strong> may arise from the ICBT or bronchial arteries — must identify before embolisation to prevent spinal cord ischaemia</li>
      <li>Non-bronchial systemic supply: intercostals, internal mammary, inferior phrenic, thyrocervical/costocervical trunks — may need embolisation if bronchial alone doesn't control bleeding</li>
    </ul>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>CFA → 5Fr Cobra/Simmons catheter; aortogram to map bronchial origins; selective catheterisation with microcatheter</td></tr>
      <tr><td>Identify target</td><td>Hypertrophied tortuous bronchial artery supplying tumour/bleeding territory; contrast blush or extravasation</td></tr>
      <tr><td>Exclude spinal supply</td><td>Careful DSA looking for anterior spinal artery (hairpin loop at midline); if present — embolise distal to its origin or avoid that vessel</td></tr>
      <tr><td>Embolic agent</td><td>PVA particles (300–500 µm preferred; avoid <300 µm — risk of bronchial mucosal necrosis); microspheres; gelatin sponge for temporary. <strong>No coils proximally</strong> — prevents future re-access if recurrence</td></tr>
      <tr><td>Endpoint</td><td>Stasis/near-stasis in bronchial artery; absent parenchymal blush; check all potential feeders (bilateral bronchial + non-bronchial systemic)</td></tr>
    </table></div>
    <h4>Complications</h4>
    <div class="table-scroll"><table>
      <tr><th>Complication</th><th>Prevention</th></tr>
      <tr><td>Spinal cord ischaemia (transverse myelitis) — rare but devastating</td><td>Identify anterior spinal artery; embolise distally beyond spinal branch; use particles ≥300 µm</td></tr>
      <tr><td>Chest pain / dysphagia (bronchial/oesophageal mucosal ischaemia)</td><td>Use appropriately sized particles; avoid over-embolisation</td></tr>
      <tr><td>Recurrent haemoptysis (30–50% in cancer patients at 1 yr)</td><td>Embolise all feeders including non-bronchial systemic; re-embolisation feasible if no proximal coils</td></tr>
    </table></div>
    <div class="warning">In lung cancer, haemoptysis recurrence after BAE is higher (~30–50%) than for other aetiologies (bronchiectasis ~10–20%) because tumour neovascularisation recruits new arterial supply. Palliative intent should be communicated.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> SVC Stenting for Malignant SVC Syndrome</div>
  <div class="card-body">
    <p>Malignant SVC syndrome occurs in ~5% of lung cancers (most commonly right upper lobe NSCLC or mediastinal SCLC/lymphoma). Endovascular stenting provides rapid symptom relief, often within 24–48 hours.</p>
    <h4>Clinical Presentation</h4>
    <ul>
      <li>Facial/upper limb oedema, plethora, dyspnoea, distended neck/chest wall veins, headache worse with bending</li>
      <li>Severity: mild oedema → cerebral oedema/laryngeal oedema (emergency)</li>
    </ul>
    <h4>Management Algorithm</h4>
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Primary Treatment</th><th>IR Role</th></tr>
      <tr><td>SCLC / lymphoma — chemo-sensitive</td><td>Urgent chemotherapy ± radiotherapy</td><td>Stent if symptoms refractory to 48–72h chemo; or if tissue diagnosis already established and symptoms severe</td></tr>
      <tr><td>NSCLC — less chemo-responsive</td><td>Endovascular stenting + concurrent systemic therapy</td><td>First-line stenting provides rapid relief while awaiting systemic therapy effect</td></tr>
      <tr><td>Acute severe symptoms (stridor, cerebral oedema)</td><td>Emergency SVC stenting</td><td>Stent immediately — do not wait for tissue diagnosis; biopsy can follow</td></tr>
    </table></div>
    <h4>Stenting Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>Femoral vein (primary); ± jugular/brachial vein for bilateral access or kissing stents</td></tr>
      <tr><td>Venography</td><td>Map occlusion length, collaterals, extent into brachiocephalic veins</td></tr>
      <tr><td>Crossing</td><td>Hydrophilic wire + support catheter; chronic occlusion may need stiff wire/sharp recanalisation</td></tr>
      <tr><td>Stent</td><td>Self-expanding metallic stent (Wallstent, Z-stent); 12–16 mm diameter; cover full length of stenosis/occlusion with ≥1 cm landing zones in normal vein</td></tr>
      <tr><td>Post-dilation</td><td>Balloon angioplasty after deployment if residual waist; avoid over-dilation (rupture risk in irradiated/invaded vessel)</td></tr>
    </table></div>
    <div class="tip">Technical success >95%; clinical improvement in >90% within 48h. Stent patency ~80–90% at 6 months. Anticoagulation (LMWH → warfarin/DOAC) recommended post-stenting to reduce in-stent thrombosis — especially if bilateral stents or pre-existing thrombosis. Re-intervention (restenting, thrombolysis) feasible for recurrent obstruction.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Malignant Pleural Effusion — Drainage & Palliation</div>
  <div class="card-body">
    <p>Malignant pleural effusion (MPE) occurs in ~15% of lung cancers and is a marker of advanced disease (stage IV). It causes dyspnoea, cough, and reduced quality of life. IR provides definitive palliation through indwelling pleural catheters (IPC) and image-guided drainage.</p>
    <h4>Management Options</h4>
    <div class="table-scroll"><table>
      <tr><th>Option</th><th>Mechanism</th><th>Best For</th><th>Considerations</th></tr>
      <tr><td><strong>Therapeutic thoracentesis</strong></td><td>Large-bore needle/catheter aspiration under USS guidance</td><td>Diagnostic + initial relief; infrequent recurrence; short life expectancy</td><td>Temporary (~days to weeks); repeated procedures; risk of trapped lung limiting drainage</td></tr>
      <tr><td><strong>Indwelling pleural catheter (IPC)</strong></td><td>Tunnelled silicone catheter (PleurX); patient/carer drains at home</td><td>Recurrent MPE; trapped lung (talc won't work); patient preference for home management</td><td>Spontaneous pleurodesis occurs in ~50% at 3 months (can then remove); infection risk ~5%; blockage; protein loss</td></tr>
      <tr><td><strong>Talc pleurodesis (via chest drain)</strong></td><td>Talc slurry via intercostal drain → pleural symphysis</td><td>Freely draining (expandable) lung; expected survival >3 months; want definitive</td><td>Requires inpatient stay 3–5 days; pain; failed pleurodesis rate ~20–30%; contraindicated if trapped lung</td></tr>
      <tr><td><strong>VATS pleurodesis/pleurectomy</strong></td><td>Surgical talc poudrage ± partial pleurectomy</td><td>Fit patient; combined with biopsy/staging; highest pleurodesis success (~90%)</td><td>GA required; morbidity; rarely appropriate for advanced cancer</td></tr>
    </table></div>
    <h4>IPC Insertion Technique (IR)</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Pre-procedure</td><td>USS to confirm effusion, mark entry site; check for septations (may need concurrent image-guided drainage)</td></tr>
      <tr><td>Position</td><td>Seated upright, leaning forward over table; lateral decubitus acceptable</td></tr>
      <tr><td>Technique</td><td>Local anaesthesia; Seldinger or trocar technique into pleural space; tunnel catheter subcutaneously (~5 cm) to exit site; connect to drainage bottle</td></tr>
      <tr><td>Drain</td><td>Initial drainage ≤1500 mL (re-expansion pulmonary oedema risk if rapid); subsequent home drainage 3×/week, 500–1000 mL/session</td></tr>
      <tr><td>Follow-up</td><td>Weekly nurse review initially; CXR if symptoms change; remove IPC if spontaneous pleurodesis achieved (no drainage for 3 consecutive sessions + CXR shows apposition)</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Bone Metastasis Palliation — Ablation & Cementoplasty</div>
  <div class="card-body">
    <p>Lung cancer is the most common source of bone metastases, occurring in ~30–40% of advanced NSCLC. IR provides pain palliation through ablation ± cementoplasty when radiation therapy has failed, is contraindicated, or is unavailable.</p>
    <h4>IR Palliative Options</h4>
    <div class="table-scroll"><table>
      <tr><th>Technique</th><th>Mechanism</th><th>Indications</th><th>Efficacy</th></tr>
      <tr><td><strong>Percutaneous cementoplasty</strong></td><td>PMMA bone cement injection under CT/fluoro guidance → mechanical stabilisation</td><td>Painful lytic metastases (vertebral = vertebroplasty; extraspinal = osteoplasty); pathological fracture risk; post-radiation persistent pain</td><td>Pain relief in ~80–90% within 48h; not tumoricidal</td></tr>
      <tr><td><strong>Thermal ablation (RFA/MWA/cryo) + cementoplasty</strong></td><td>Ablation destroys tumour periosteal nerve stimulation → cement stabilises</td><td>Larger lytic lesions; weight-bearing bones; radiation-refractory pain; acetabular/long bone lesions</td><td>Superior pain relief vs cementoplasty alone for larger lesions; tumour volume reduction</td></tr>
      <tr><td><strong>Cryoablation alone</strong></td><td>Ice ball formation → tumour cell death + sensory nerve destruction</td><td>Extraspinal soft-tissue extension; lesions near nerves (ice ball visible on CT — precise margin control)</td><td>Pain reduction in ~75–85%; analgesic effect rapid (48–72h)</td></tr>
    </table></div>
    <h4>Vertebroplasty/Kyphoplasty — Key Points</h4>
    <ul>
      <li><strong>Access:</strong> Transpedicular (most common) or parapedicular; CT + fluoroscopy guidance; 11–13G trocar</li>
      <li><strong>Cement:</strong> PMMA mixed with barium/tungsten opacifier; inject under live fluoroscopy; fill anterior 2/3 of vertebral body</li>
      <li><strong>Complications:</strong> Cement leak (~10–15%, mostly asymptomatic); neural foraminal leak → radiculopathy (<1%); pulmonary cement embolism (rare, screen with post-procedure CXR); adjacent level fracture</li>
      <li><strong>Kyphoplasty</strong> uses balloon tamp to create cavity before cement — restores height, lower leak rate, but more expensive</li>
    </ul>
    <div class="tip">Multidisciplinary approach: ablation ± cementoplasty complements radiation and systemic therapy. Best suited for: ≤3 painful sites, focal pain correlating with imaging, post-radiation failure, patient declining/unsuitable for further radiotherapy. Not appropriate for diffuse bony disease.</div>
  </div>
</div>
`;

<div class="page-meta"><span class="tag tag-section">Disease Management</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> VTE Classification & Risk Stratification</div>
  <div class="card-body">
    <p>Venous thromboembolism (VTE) encompasses deep vein thrombosis (DVT) and pulmonary embolism (PE). IR plays a critical role in acute massive/submassive PE, iliofemoral DVT, IVC filter placement/retrieval, and chronic thromboembolic disease.</p>

<div class="card">

    <p>Iliofemoral DVT carries the highest risk of post-thrombotic syndrome (PTS: chronic pain, oedema, skin changes, venous ulceration). Early thrombus removal aims to preserve venous valve function and reduce PTS.</p>

  </div>
</div>

<div class="card">

    <h4>Indications</h4>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Chronic Thromboembolic Disease & May-Thurner Syndrome</div>
  <div class="card-body">
    <h4>Chronic Thromboembolic Pulmonary Hypertension (CTEPH)</h4>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Definition</td><td>Persistent organised thrombus in pulmonary arteries → pulmonary hypertension (mPAP ≥25 mmHg) after ≥3 months of anticoagulation</td></tr>
      <tr><td>Incidence</td><td>~2–4% of acute PE survivors</td></tr>

      <tr><td>Primary treatment</td><td>Pulmonary endarterectomy (PEA) — surgical, curative in operable cases</td></tr>
      <tr><td>IR role</td><td><strong>Balloon pulmonary angioplasty (BPA)</strong> for inoperable CTEPH or residual PH post-PEA; serial sessions (3–6) dilating segmental/subsegmental webs</td></tr>
    </table></div>
    <h4>May-Thurner Syndrome (Iliac Vein Compression)</h4>
    <div class="table-scroll"><table>
      <tr><th>Feature</th><th>Detail</th></tr>
      <tr><td>Anatomy</td><td>Left common iliac vein compressed between right common iliac artery (anteriorly) and L5 vertebral body (posteriorly)</td></tr>
      <tr><td>Prevalence</td><td>Anatomic compression in ~25% of population; clinically significant in ~2–5%</td></tr>
      <tr><td>Presentation</td><td>Left iliofemoral DVT (especially in young women); chronic left leg swelling; pelvic congestion symptoms</td></tr>
      <tr><td>Diagnosis</td><td>CTV/MRV showing compression; IVUS (gold standard — &gt;50% area reduction significant); venography showing collaterals</td></tr>
      <tr><td>Treatment</td><td>Iliac vein stenting (self-expanding, 14–16 mm Wallstent or dedicated venous stent — VENOVO, Abre); CDT first if acute DVT overlying compression</td></tr>
      <tr><td>Outcomes</td><td>Primary patency ~90% at 2 years; anticoagulation 3–6 months post-stent ± lifelong antiplatelet</td></tr>
    </table></div>
  </div>
</div>

      <tr><td>CT angiography (CTA)</td><td>~0.3–0.5 mL/min</td><td>First-line localisation; high sensitivity; perform before angiography to guide catheter selection</td></tr>
      <tr><td>Conventional angiography</td><td>~0.5–1.0 mL/min</td><td>Therapeutic — proceed directly to embolisation; can use provocative measures if negative and high suspicion</td></tr>
      <tr><td>Tagged RBC scan (Tc-99m)</td><td>~0.1–0.2 mL/min</td><td>Most sensitive; useful for intermittent bleeding; delayed imaging possible; poor localisation precision</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Arterial Anatomy for GI Embolisation</div>
  <div class="card-body">
    <h4>Coeliac Axis (Upper GI Supply)</h4>
    <ul>
      <li><strong>Left gastric artery</strong> → lesser curvature of stomach; oesophageal branches</li>
      <li><strong>Common hepatic → gastroduodenal artery (GDA)</strong> → superior pancreaticoduodenal; right gastroepiploic. GDA is the most commonly embolised vessel in UGIB (duodenal ulcer bleeding)</li>
      <li><strong>Splenic artery</strong> → short gastrics; left gastroepiploic → greater curvature</li>
    </ul>
    <h4>Superior Mesenteric Artery (SMA) — Mid & Right Colon</h4>
    <ul>
      <li><strong>Inferior pancreaticoduodenal artery</strong> — anastomoses with GDA branches (critical collateral)</li>
      <li><strong>Jejunal and ileal branches</strong> — vasa recta to small bowel</li>
      <li><strong>Ileocolic, right colic, middle colic</strong> — supply caecum to splenic flexure</li>
      <li><strong>Marginal artery of Drummond</strong> — anastomotic arcade along colon mesenteric border</li>
    </ul>
    <h4>Inferior Mesenteric Artery (IMA) — Left Colon & Rectum</h4>
    <ul>
      <li><strong>Left colic artery</strong> → descending colon; anastomoses with middle colic via arc of Riolan</li>
      <li><strong>Sigmoid branches</strong> → sigmoid colon (diverticular bleeding territory)</li>
      <li><strong>Superior rectal artery</strong> → upper rectum; anastomoses with middle and inferior rectal (internal iliac branches)</li>
    </ul>
    <div class="tip">Key collateral pathways: GDA ↔ inferior pancreaticoduodenal (coeliac ↔ SMA); marginal artery of Drummond and arc of Riolan (SMA ↔ IMA); superior ↔ middle/inferior rectal arteries (IMA ↔ internal iliac). These collaterals protect against ischaemia after embolisation — but also allow re-bleeding through back-door supply.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Upper GI Bleeding — Embolisation Technique</div>
  <div class="card-body">
    <h4>Pre-Procedure</h4>
    <ul>
      <li>CTA first (if haemodynamically stable) — localises bleed, maps anatomy, identifies variants</li>
      <li>Failed endoscopic haemostasis (typically 2 attempts) = IR referral; or primary IR if massive uncontrolled haemorrhage</li>
      <li>Resuscitate: transfuse to Hb >70 g/L; correct coagulopathy (INR <1.5, platelets >50); large-bore IV access</li>
    </ul>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>CFA → 5Fr Cobra C2 or SOS Omni for coeliac/SMA selection; microcatheter (2.4–2.8Fr) for superselective</td></tr>
      <tr><td>Diagnostic runs</td><td>Coeliac arteriogram → selective GDA, left gastric, splenic as guided by CTA; SMA if duodenal/pancreaticoduodenal suspected</td></tr>
      <tr><td>Identify bleeding</td><td>Active extravasation (contrast blush); pseudoaneurysm; vessel irregularity/spasm at ulcer bed</td></tr>
      <tr><td>Embolise</td><td><strong>Coils</strong> (pushable or detachable, 2–4 mm) — most common for UGIB; sandwich technique for GDA (coil distal and proximal to bleeding point to prevent back-door filling)</td></tr>
      <tr><td>Completion</td><td>Repeat arteriogram to confirm haemostasis; check collateral pathways for persistent filling</td></tr>
    </table></div>
    <h4>Embolic Agent Selection — Upper GI</h4>
    <div class="table-scroll"><table>
      <tr><th>Agent</th><th>Use Case</th><th>Advantage</th><th>Risk</th></tr>
      <tr><td><strong>Coils</strong></td><td>Standard for UGIB; GDA embolisation; pseudoaneurysm</td><td>Precise; permanent; can pack a vessel</td><td>Re-bleeding via collaterals (15–20%); coil migration if oversized</td></tr>
      <tr><td><strong>Gelatin sponge (Gelfoam)</strong></td><td>Temporary occlusion; diffuse mucosal bleeding; adjunct to coils</td><td>Temporary (~2 weeks); allows vessel recanalisation</td><td>Less durable; higher re-bleeding rate alone</td></tr>
      <tr><td><strong>Glue (NBCA)</strong></td><td>Coagulopathic patients; when coils alone insufficient; pseudoaneurysm sac</td><td>Works independent of coagulation status; immediate occlusion</td><td>Non-target embolisation; catheter glued in place; operator-dependent</td></tr>
    </table></div>
    <div class="warning">The GDA/duodenum has rich collateral supply from the coeliac and SMA territories. Always perform the <strong>sandwich technique</strong> (embolise distal then proximal to the bleeding point) — proximal-only coiling allows back-door bleeding through pancreaticoduodenal arcades. Ischaemic complications in UGIB embolisation are rare (~1–2%) due to extensive gastroduodenal collateralisation.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Lower GI Bleeding — Embolisation Technique</div>
  <div class="card-body">
    <p>Lower GI embolisation differs from upper GI — the colon has fewer collaterals (watershed areas at splenic flexure and rectosigmoid), so ischaemic risk is higher. Superselective catheterisation is essential.</p>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>CTA localisation</td><td>Essential before angiography — identifies bleeding territory and guides SMA vs IMA catheterisation</td></tr>
      <tr><td>SMA/IMA angiography</td><td>Selective injection of the artery supplying the CTA-positive territory; look for contrast extravasation</td></tr>
      <tr><td>Superselective catheterisation</td><td>Microcatheter into the vasa recta (terminal straight arteries to bowel wall) feeding the bleed — as distal as possible</td></tr>
      <tr><td>Embolisation</td><td><strong>Microcoils</strong> (2–3 mm) at the vasa recta level — most common; aim for single vasa recta occlusion</td></tr>
      <tr><td>Alternative agents</td><td>Gelfoam pledgets for diffuse bleeding; NBCA rarely needed</td></tr>
    </table></div>
    <h4>Outcomes & Complications</h4>
    <div class="table-scroll"><table>
      <tr><th>Outcome</th><th>Rate</th></tr>
      <tr><td>Technical success (haemostasis)</td><td>~90–95%</td></tr>
      <tr><td>Clinical success (no re-bleeding 30 days)</td><td>~70–80%</td></tr>
      <tr><td>Bowel ischaemia (minor — mucosal, self-limiting)</td><td>~5–10%</td></tr>
      <tr><td>Bowel infarction (requiring surgery)</td><td>~2–4%</td></tr>
      <tr><td>Re-bleeding (30 days)</td><td>~15–25%</td></tr>
    </table></div>
    <div class="tip">Lower GI ischaemia risk is higher than upper GI because the colon's end-artery (vasa recta) supply has fewer collaterals. Superselective embolisation at the vasa recta level minimises this risk. Avoid embolising the marginal artery or named branches (ileocolic, right colic) — this occludes supply to a larger territory and increases infarction risk. Particles (PVA) are generally avoided in LGIB due to unpredictable distal penetration and higher ischaemia rates.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Empiric & Provocative Angiography</div>
  <div class="card-body">
    <h4>When Angiography Is Negative</h4>
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Approach</th></tr>
      <tr><td>CTA positive but angiogram negative (intermittent bleed stopped)</td><td>Empiric embolisation of the CTA-positive territory if high clinical suspicion and CTA findings convincing; or observe and repeat angiogram if re-bleeds</td></tr>
      <tr><td>Recurrent bleeding, negative angiogram</td><td>Provocative angiography: heparin (5000 U IV), ± vasodilators (tolazoline), ± tPA (low dose via catheter) to provoke bleeding. Controversial — informed consent essential; only in haemodynamically stable patients with surgical backup</td></tr>
      <tr><td>Suspected Meckel diverticulum</td><td>Tc-99m pertechnetate scan; or mesenteric angiography looking for ectopic right lower quadrant blush from omphalomesenteric artery (branch of SMA)</td></tr>
    </table></div>
    <h4>Empiric Embolisation</h4>
    <ul>
      <li>Embolisation of a vessel supplying the territory identified on CTA even without active extravasation on angiography</li>
      <li>Most evidence for GDA ulcer bleeding — empiric GDA coiling is well-established and safe due to rich collaterals</li>
      <li>More controversial in lower GI — higher ischaemia risk with empiric embolisation; clinical context critical</li>
      <li>Decision should involve MDT discussion (gastroenterology, surgery, IR)</li>
    </ul>
  </div>
</div>
`;

<h2 class="page-title">Trauma & Haemorrhage — Embolisation</h2>
<div class="page-meta"><span class="tag tag-section">Disease Management</span><span class="tag tag-freq-high">Frequently Tested</span></div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Overview & Triage Principles</div>
  <div class="card-body">
    <p>Transcatheter arterial embolisation (TAE) is a cornerstone of non-operative management (NOM) of solid organ injury and is first-line for pelvic haemorrhage. The decision to embolise vs operate is driven by haemodynamic status, CT findings, and injury grade.</p>
    <h4>When to Embolise vs Operate</h4>
    <div class="table-scroll"><table>
      <tr><th>Scenario</th><th>Approach</th></tr>

    <div class="tip">Australian trauma centres typically follow a hybrid approach: haemodynamically unstable patients with pelvic fractures go to angiography (pelvic embolisation) if IR is immediately available, or to the OR for pelvic packing ± external fixation if not. The concept of the "hybrid trauma room" (angiography suite in the resus bay) is expanding.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Splenic Trauma & Embolisation</div>
  <div class="card-body">
    <p>The spleen is the most commonly injured solid organ in blunt abdominal trauma. NOM (observation ± embolisation) is now standard for haemodynamically stable patients with any grade of injury.</p>

      <tr><th>Grade</th><th>Injury</th><th>Management</th></tr>
      <tr><td>I</td><td>Subcapsular haematoma &lt;10% surface; capsular laceration &lt;1 cm deep</td><td>NOM — observation alone</td></tr>
      <tr><td>II</td><td>Subcapsular haematoma 10–50%; parenchymal haematoma &lt;5 cm; laceration 1–3 cm deep</td><td>NOM — observation alone</td></tr>

      <tr><td><strong>Proximal (main splenic artery)</strong></td><td>Coils in mid-splenic artery (distal to dorsal pancreatic artery, proximal to hilum)</td><td>High-grade injury (IV–V); multiple bleeding sites; diffuse parenchymal injury</td><td>Reduces splenic perfusion pressure; allows clot stabilisation; preserves splenic function via collaterals (short gastrics, left gastroepiploic)</td></tr>
      <tr><td><strong>Distal (selective/superselective)</strong></td><td>Microcatheter into bleeding branch; coils ± gelfoam at bleeding point</td><td>Focal pseudoaneurysm or active extravasation; low-grade injury with blush</td><td>Targeted haemostasis; preserves more parenchyma; may miss additional injury sites</td></tr>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Hepatic Trauma & Embolisation</div>
  <div class="card-body">
    <h4>Key Principles</h4>

      <li>Hepatic necrosis/abscess: ~5%; more common with proximal embolisation or in patients with portal vein injury (loss of dual supply)</li>

</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Renal Trauma & Embolisation</div>
  <div class="card-body">
    <h4>Indications for Renal Embolisation</h4>

  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Pelvic Trauma & Haemorrhage</div>
  <div class="card-body">
    <p>Pelvic fracture haemorrhage is a major cause of death in polytrauma. Bleeding sources are: venous (80–90%), arterial (10–20%), and fracture surfaces. TAE targets the arterial component — the most immediately life-threatening source that is amenable to IR intervention.</p>

      <li>Lateral sacral and iliolumbar arteries — injured in sacral fractures</li>

    <h4>Management Algorithm</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Action</th></tr>
      <tr><td>1. Pelvic binder</td><td>Applied in field/ED; reduces pelvic volume, tamponades venous bleeding; maintain until definitive stabilisation</td></tr>
      <tr><td>2. CT (if stable enough)</td><td>Identifies active arterial extravasation; fracture pattern; associated injuries</td></tr>
      <tr><td>3. Haemodynamically unstable</td><td>Pelvic packing (pre-peritoneal) ± external fixation if IR not immediately available; angiography + embolisation if IR available</td></tr>

      <tr><td>5. Non-selective embolisation</td><td>If multiple bleeding points or haemodynamically critical: bilateral IIA embolisation with gelfoam (temporary; recanalises; preserves long-term pelvic perfusion)</td></tr>

    <h4>Embolisation Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Approach</th><th>Agent</th><th>When</th></tr>
      <tr><td>Superselective (single branch)</td><td>Microcoils ± gelfoam</td><td>Single bleeding vessel identified; stable enough for extended procedure</td></tr>

  </div>
</div>

      <li><strong>Classic triad:</strong> severe acute abdominal pain, gut emptying (vomiting/diarrhoea), cardiac source of embolism (AF)</li>

      <li>Late signs: peritonism, bloody diarrhoea, shock = bowel infarction/necrosis (often irreversible)</li>
      <li>Lactate is often elevated but is a late marker — normal lactate does NOT exclude AMI</li>
    </ul>
    <h4>CTA Mesenteric Protocol</h4>
    <div class="table-scroll"><table>
      <tr><th>Phase</th><th>Purpose</th><th>Key Findings</th></tr>
      <tr><td>Non-contrast</td><td>Baseline; identify calcification, intramural haemorrhage</td><td>Calcified atherosclerotic plaques at SMA origin; hyperdense thrombus</td></tr>
      <tr><td><strong>Arterial phase</strong></td><td>Map arterial occlusion/stenosis</td><td>SMA cutoff (embolism); ostial occlusion (thrombosis); diffuse spasm (NOMI); collateral pathways</td></tr>
      <tr><td><strong>Portal venous phase</strong></td><td>Bowel wall assessment; venous thrombosis</td><td>Bowel wall non-enhancement (infarction); pneumatosis intestinalis; portal venous gas; SMV/PV thrombus; mesenteric oedema</td></tr>
    </table></div>
    <h4>Signs of Irreversible Bowel Ischaemia (surgery, not IR)</h4>
    <ul>
      <li>Pneumatosis intestinalis (intramural gas)</li>
      <li>Portal venous gas</li>
      <li>Absent bowel wall enhancement (full-thickness necrosis)</li>
      <li>Free intraperitoneal air (perforation)</li>
      <li>Peritonitis on examination</li>
    </ul>
    <div class="warning">If CTA shows signs of transmural necrosis/perforation → surgery first (laparotomy, resection of dead bowel), not IR. IR is for viable but ischaemic bowel — revascularise before infarction occurs. The window is typically 6–12 hours from symptom onset for embolic AMI.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> IR Management — SMA Embolism</div>
  <div class="card-body">
    <p>SMA embolism is the strongest indication for IR intervention. Catheter-directed therapy can restore flow and avoid or reduce the extent of surgical resection.</p>
    <h4>Technique</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Access</td><td>CFA → 5Fr SOS Omni or Cobra C2 into SMA; diagnostic SMA angiogram confirms embolus location</td></tr>
      <tr><td>Aspiration thrombectomy</td><td>6–8Fr guide catheter or aspiration catheter advanced to embolus; manual aspiration to remove bulk of clot</td></tr>
      <tr><td>CDT (catheter-directed thrombolysis)</td><td>If residual thrombus: multi-sidehole catheter embedded in clot; tPA 0.5–1.0 mg/hr infusion; ± heparin via sheath</td></tr>
      <tr><td>Mechanical thrombectomy</td><td>Rheolytic (AngioJet) or aspiration devices for large clot burden; can be combined with lytic</td></tr>
      <tr><td>Balloon angioplasty</td><td>If underlying stenosis identified after clot removal (less common in embolism than thrombosis)</td></tr>
      <tr><td>Completion angiogram</td><td>Confirm flow restoration to SMA branches; assess distal runoff; look for residual thrombus in branch vessels</td></tr>
      <tr><td>Post-procedure</td><td>ICU monitoring; therapeutic heparin; serial clinical assessment; repeat imaging if symptoms don't resolve; surgical consultation for second-look laparoscopy at 24–48h</td></tr>
    </table></div>
    <div class="tip">Second-look laparoscopy/laparotomy at 24–48 hours after revascularisation is standard at most centres — demarcation of viable vs non-viable bowel becomes clearer after reperfusion. IR revascularisation + delayed surgical assessment reduces the extent of bowel resection compared to emergency laparotomy alone.</div>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> IR Management — SMA Thrombosis & NOMI</div>
  <div class="card-body">
    <h4>SMA Thrombosis (Acute-on-Chronic)</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Assessment</td><td>Typically ostial/proximal SMA occlusion with atherosclerotic plaque; often has collateral supply from coeliac (via GDA → pancreaticoduodenal arcade) and IMA (via marginal artery/arc of Riolan)</td></tr>
      <tr><td>Endovascular approach</td><td>Wire crossing of SMA occlusion (may need stiff wire, support catheter); aspiration/lysis of acute thrombus; then treat underlying stenosis</td></tr>
      <tr><td>SMA stenting</td><td>Primary stenting of ostial SMA stenosis — balloon-expandable stent (precise placement at ostium); 6–8 mm diameter</td></tr>
      <tr><td>Surgical alternative</td><td>SMA bypass (aorto-mesenteric graft) if endovascular fails or bowel resection needed simultaneously</td></tr>
    </table></div>
    <h4>NOMI (Non-Occlusive Mesenteric Ischaemia)</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Identify cause</td><td>Low cardiac output; vasopressors (especially noradrenaline); post-cardiac surgery; dialysis hypotension; sepsis</td></tr>
      <tr><td>Treat cause</td><td>Optimise cardiac output; wean vasopressors; volume resuscitation; treat sepsis</td></tr>
      <tr><td>IR role — papaverine infusion</td><td>SMA catheter placement; continuous papaverine infusion (30–60 mg/hr) via SMA catheter to reverse mesenteric vasospasm</td></tr>
      <tr><td>Monitoring</td><td>Repeat angiography at 24h to assess spasm resolution; continue infusion until clinical improvement; ICU monitoring for hypotension (papaverine is a systemic vasodilator)</td></tr>
      <tr><td>Contraindications to papaverine</td><td>Portal venous gas or pneumatosis (necrosis → surgery); papaverine allergy; severe hepatic impairment</td></tr>
    </table></div>
    <h4>Mesenteric Venous Thrombosis</h4>
    <ul>
      <li>Primary treatment: <strong>anticoagulation</strong> (heparin → warfarin/DOAC for ≥6 months; lifelong if thrombophilia)</li>
      <li>IR role: CDT via transhepatic portal vein approach or transjugular intrahepatic approach (TIPS route) for extensive SMV/PV thrombosis with clinical deterioration despite anticoagulation</li>
      <li>Aspiration thrombectomy + local tPA infusion via catheter in SMV</li>
      <li>Surgery if bowel necrosis develops despite anticoagulation</li>
    </ul>
  </div>
</div>

<div class="card">
  <div class="card-header"><span class="icon">▶</span> Chronic Mesenteric Ischaemia</div>
  <div class="card-body">
    <p>Chronic mesenteric ischaemia (CMI) is caused by atherosclerotic stenosis of ≥2 of the 3 mesenteric vessels (coeliac, SMA, IMA). Classic triad: postprandial abdominal pain ("intestinal angina"), food fear, weight loss.</p>
    <h4>Diagnosis</h4>
    <div class="table-scroll"><table>
      <tr><th>Modality</th><th>Findings</th></tr>
      <tr><td>Duplex USS</td><td>SMA PSV &gt;275 cm/s (≥70% stenosis); coeliac PSV &gt;200 cm/s; screening tool</td></tr>
      <tr><td>CTA</td><td>Calcified ostial stenosis; post-stenotic dilatation; collateral pathways (GDA arcade, meandering mesenteric artery)</td></tr>
      <tr><td>MRA</td><td>Alternative to CTA; no radiation; may overestimate stenosis due to flow artefact</td></tr>
      <tr><td>Catheter angiography</td><td>Gold standard; performed at time of intervention; lateral aortogram shows ostial stenosis of coeliac/SMA</td></tr>
    </table></div>
    <h4>Endovascular Treatment</h4>
    <div class="table-scroll"><table>
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td>Target vessel</td><td>SMA is the priority (largest territory); coeliac if SMA cannot be treated; IMA rarely targeted alone</td></tr>
      <tr><td>Access</td><td>CFA (retrograde) or brachial/radial (antegrade — better angle for ostial SMA lesions)</td></tr>
      <tr><td>Technique</td><td>Balloon angioplasty + primary stenting (balloon-expandable stent at ostium); bare metal 6–8 mm</td></tr>
      <tr><td>Outcomes</td><td>Technical success &gt;95%; symptom relief ~85–90%; primary patency ~70% at 3 years; re-intervention (restenting) ~20% at 3 years</td></tr>
      <tr><td>Surgical alternative</td><td>Aorto-mesenteric bypass — more durable (~90% patency at 5 years) but higher morbidity; reserved for failed endovascular or young/fit patients</td></tr>
    </table></div>
  </div>
</div>
`;

<div class="card">

      <tr><td>Placenta accreta spectrum (PAS) — anticipated massive haemorrhage</td><td><strong>Prophylactic balloon occlusion catheters</strong> in internal iliac or common iliac arteries; inflated after delivery before placenta removal; ± embolisation</td></tr>

      <tr><td>Secondary PPH with persistent bleeding after curettage</td><td>UAE to control arterial component</td></tr>
    </table></div>
  </div>
</div>

<div class="card">
