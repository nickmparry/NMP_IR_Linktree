<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reporting templates</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1c1f24;
    --border: #2a2e35;
    --border-strong: #3a3f47;
    --text: #e8e6e1;
    --text-secondary: #a8a49a;
    --text-muted: #6f6b62;
    --accent: #6ea8fe;
    --accent-bg: #17233a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .pinned-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .pinned-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 4px;
    background: var(--card);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
  }
  .pinned-btn:hover { background: var(--accent-bg); border-color: var(--accent); }
  .pinned-btn:active { transform: scale(0.98); }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 0 10px;
    height: 38px;
    background: var(--card);
    margin-bottom: 12px;
  }
  .search-wrap input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    flex: 1;
    color: var(--text);
    font-family: inherit;
  }
  .search-icon, .clear-btn { color: var(--text-muted); font-size: 13px; cursor: default; }
  .clear-btn { cursor: pointer; }
  .clear-btn:hover { color: var(--text); }

  .columns-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .box {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .box-full { grid-column: 1 / -1; }

  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .row:hover { background: var(--accent-bg); }
  .row .chev {
    width: 12px;
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.1s ease;
    flex-shrink: 0;
  }
  .row.expanded > .chev { transform: rotate(90deg); }
  .row .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .row .name { flex: 1; }
  .row .copy-hint { font-size: 11px; color: var(--text-muted); opacity: 0; }
  .row:hover .copy-hint { opacity: 1; }
  .children { margin-left: 10px; border-left: 0.5px solid var(--border); padding-left: 8px; display: none; }
  .children.open { display: block; }
  .children.two-col.open {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 12px;
  }

  .cat-amber  { background: #3a2c0f; color: #f5c76b; }
  .cat-blue   { background: #12233a; color: #7db2f0; }
  .cat-green  { background: #1c2f12; color: #9bd66b; }
  .cat-red    { background: #3a1414; color: #f08080; }
  .cat-purple { background: #251d3a; color: #c3aef0; }
  .cat-gray   { background: #24262a; color: #b9b6ae; }

  #results { display: none; }
  #results.show { display: block; }
  .columns-wrap.hidden { display: none; }
  .results-count { font-size: 12px; color: var(--text-muted); margin: 4px 4px 8px; display: flex; justify-content: space-between; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(8px);
    background: #3a3f47;
    color: #f5f4f2;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty { padding: 16px 4px; color: var(--text-muted); font-size: 13px; }

  .last-copied {
    margin-top: 12px;
  }
  .last-copied-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }
  .last-copied-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .last-copied-value {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .last-copied-text {
    margin: 0;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }

  @media(max-width:480px) {
    .pinned-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .columns-grid { grid-template-columns: 1fr; }
    body { padding: 16px 10px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="pinned-row" id="pinnedRow"></div>

  <div class="search-wrap">
    <span class="search-icon">&#9906;</span>
    <input id="search" type="text" placeholder="Search templates…" autocomplete="off" />
    <span class="clear-btn" id="clearBtn" title="Clear">&times;</span>
  </div>

  <div class="results-count" id="resultsCount" style="display:none;"></div>
  <div id="results"></div>

  <div class="columns-wrap" id="columnsWrap">
    <div class="columns-grid">
      <div class="box" id="boxLeft"></div>
      <div class="box" id="boxRight"></div>
    </div>
    <div class="box box-full" id="boxBottom"></div>
    <div class="box box-full last-copied" id="lastCopiedBox">
      <div class="last-copied-header">
        <span class="last-copied-label">Last copied</span>
        <span class="last-copied-value" id="lastCopiedValue">—</span>
      </div>
      <pre class="last-copied-text" id="lastCopiedText"></pre>
    </div>
  </div>

</div>

<div id="toast"></div>

Parry - IR Fellow \n", "CT/Abdomen_Pelvis/16_CT_IVP.md": "CT IVP\n\nClinical History:\n\n\nTechnique:\nCT IVP \n\nComparison:\n\n\nFindings:\nKidneys are unremarkable. No solid renal lesion. No hydronephrosis or discernible ureteric lesion. Urinary bladder unremarkable. No adrenal lesion.\n\nLiver, gallbladder, and pancreas are unremarkable. CBD normal calibre. No pancreatic duct dilation. Spleen and adrenals are within normal limits. Bowel is of normal calibre and wall thickness. No pelvic or abdominal lymphadenopathy.\n\nVisualised lung bases are unremarkable. No concerning bony abnormality.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow \n", "CT/Abdomen_Pelvis/17_CT_Enterography.md": "CT Enterography\n\nClinical History:\n\n\nTechnique:\nCT enterography protocol.\n\nComparison:\n\n\nFindings:\nSmall bowel: Normal wall thickness and enhancement throughout. No stricture or obstruction.\nTerminal ileum/colon: Normal.\nMesentery: No inflammatory change. No engorged vasa recta.\nLymph nodes: Not enlarged.\nComplications: No abscess or fistula.\n\nImpression:\nNo CT evidence of active small bowel inflammation.\n\nChecklist Before Signing:\n- [ ] Mural hyperenhancement, stratification, wall thickening (active inflammation signs)\n- [ ] Stricture \u2014 length, degree of luminal narrowing, prestenotic dilatation\n- [ ] Fistula / abscess / sinus tract\n- [ ] Comb sign (engorged vasa recta)\n- [ ] Extent and distribution of disease (segments involved)\n", "CT/Abdomen_Pelvis/18_CT_Adrenals.md": "CT Adrenal Protocol\n\nClinical History:\n\n\nTechnique:\nNon-contrast, 1-minute (portal venous), and 15-minute delayed CT through the adrenal glands.\n\nComparison:\n\n\nFindings:\nRight adrenal gland: Normal / nodule ___ cm. Non-contrast attenuation ___ HU. Enhanced attenuation ___ HU. Absolute washout ___ %. Relative washout ___ %.\nLeft adrenal gland: Normal / nodule ___ cm. Non-contrast attenuation ___ HU. Enhanced attenuation ___ HU. Absolute washout ___ %. Relative washout ___ %.\n\nLiver, gallbladder, and pancreas are unremarkable. CBD normal calibre. No pancreatic duct dilation. Spleen and adrenals are within normal limits. Kidneys are within normal limits. No hydronephrosis. Normal CT appearance of the urinary bladder. Bowel is of normal calibre and wall thickness. No pelvic or abdominal lymphadenopathy.\n\nVisualised lung bases are unremarkable. No concerning bony abnormality.\n\nImpression:\nAdrenal nodule(s) with washout characteristics consistent with lipid-rich adenoma. / Indeterminate \u2014 recommend further characterisation.\n\nChecklist Before Signing\n- [ ] Non-contrast HU (< 10 HU supports lipid-rich adenoma)\n- [ ] Absolute washout (> 60%) and relative washout (> 40%) calculated\n- [ ] Size and interval growth on comparison\n- [ ] Recommendation if indeterminate (MRI, PET, follow-up interval)\n", "CT/Chest/09_CT_Chest_NonContrast.md": "CT Chest \u2014 Non-Contrast\n\nClinical History:\n\n\nTechnique:\nCT Chest noncontrast.\n\nComparison:\n\n\nFindings:\nNo suspicious nodule or mass lesion. No consolidation, pneumothorax, or pleural effusion. \n\nNo pericardial effusion. Coronary artery calcification present. No axillary, mediastinal, or hilar lymphadenopathy. Remainder of the mediastinal structures are unremarkable. \n\nVisualised upper abdominal viscera within normal limits. No concerning bony abnormality.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow", "CT/Chest/10_CT_Chest_With_Contrast.md": "CT Chest\n\nClinical History:\n\n\nTechnique:\nCT Chest arterial phase.\n\nComparison:\n\n\nFindings:\nNo lung mass or suspicious nodule. No consolidation, pneumothorax, or pleural effusion. No central pulmonary embolism.\n\nNo pericardial effusion. Coronary artery calcification present. No axillary, mediastinal, or hilar lymphadenopathy. Remainder of the mediastinal structures are unremarkable. \n\nVisualised upper abdominal viscera within normal limits. No concerning bony abnormality.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n", "CT/Chest/11_CT_Pulmonary_Angiogram.md": "CTPA\n\nClinical History:\n\n\nTechnique:\nCTPA\n\nComparison:\n\n\nFindings:\nDiagnostic quality study to subsegmental level. No pulmonary embolus. No consolidation, pneumothorax, or pleural effusion. No lung mass or suspicious nodule. \n\nNo pericardial effusion. Coronary artery calcification present. No axillary, mediastinal, or hilar lymphadenopathy. Remainder of the mediastinal structures are unremarkable. \n\nVisualised upper abdominal viscera within normal limits. No concerning bony abnormality.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n", "CT/Chest/13_CT_Gated_Aorta.md": "CT Aortic angiogram\n\nClinical History:\n\n\nTechnique:\nCT gated aortic angiogram.\n\nComparison:\n\n\nFindings:\nNo dissection flap, penetrating aortic ulcer, or intramural haematoma. \nAscending, descending aorta, aortic arch, and supra-aortic great vessels opacify appropriately.\nNo central pulmonary embolus.\n\nNo suspicious nodule or mass lesion. No consolidation, pneumothorax, or pleural effusion. \nNo pericardial effusion. Coronary artery calcification present. No axillary, mediastinal, or hilar lymphadenopathy. \nRemainder of the mediastinal structures are unremarkable. \n\nVisualised upper abdominal viscera within normal limits.\nNo concerning bony abnormality.\n\nImpression:\n\nN. McKay Parry - IR Fellow", "CT/Neuro/01_CT_Head_NonContrast.md": "CT Head non-con.\n\nClinical History:\n\n\nTechnique:\nCT Head noncontrast.\n\nComparison:\n\n\nFindings\nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nOrbits are clear. Mastoid air cells are appropriately aerated. No calvarial or base of skull fracture.\n\nImpression:\nNo acute intracranial pathology.\n\nN. McKay Parry - IR Fellow", "CT/Neuro/02_CT_Head_With_Contrast.md": "CT Head post-con\n\nClinical History:\n\n\nTechnique:\nCT Head post-contrast.\n\nComparison:\n\n\nFindings\nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nNo enhancing intracranial lesion. Intracranial arteries and dural venous sinuses opacify normally within limitations of non-dedicated study.\n\nOrbits are clear. Mastoid air cells are appropriately aerated.\n\nImpression:\nNo acute intracranial pathology. No enhancing mass lesion.\n\nN. McKay Parry - IR Fellow", "CT/Neuro/03_CT_HN_Angiogram.md": "CTA head and neck angiogram\n\nClinical History:\n\n\nTechnique:\nCT head non-contrast.\nCT head and neck angiogram.\n\nComparison:\n\n\nFindings:\nHead:\nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nOrbits are clear. Mastoid air cells are appropriately aerated.\n\nHead and neck angiogram:\nConventional three-vessel configuration of the aortic arch. Left and right common carotid arteries opacify normally without high-grade stenosis.\n\nLeft and right internal carotid, middle, and anterior cerebral arteries are patent. No large vessel occlusion.\n\nLeft and right vertebral, posterior cerebral, and the basilar artery are patent. No vertebral artery dissection.\n\nImpression:\nNo intracranial haemorrhage.\nNo large vessel occlusion or dissection. \nNo significant stenosis.\n\nN. McKay Parry - IR Fellow", "CT/Neuro/04_CT_Stroke_Protocol.md": "CT Stroke Protocol.\n\nClinical History:\n\n\nTechnique:\nCT head non-contrast.\nCT head and neck angiogram.\nCT brain perfusion.\n\nComparison:\n\n\nFindings:\nHead:\nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nOrbits are clear. Mastoid air cells are appropriately aerated.\n\nHead and neck angiogram:\nConventional three-vessel configuration of the aortic arch. Left and right common carotid arteries opacify normally without high-grade stenosis.\n\nLeft and right internal carotid, middle, and anterior cerebral arteries are patent. No large vessel occlusion.\n\nLeft and right vertebral, posterior cerebral, and the basilar artery are patent. No vertebral artery dissection.\n\nPerfusion:\nNo acute perfusion abnormality.\n\nImpression:\nNo intracranial haemorrhage.\nNo large vessel occlusion or dissection. \nNo acute perfusion abnormality.\n\nN. McKay Parry - IR Fellow", "CT/Neuro/05_CT_Venogram_Head.md": "CT Head Venogram\n\n\nClinical History:\n\n\nTechnique\nCT head venogram\n\nComparison:\n\n\nFindings\nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nSuperior sagittal, inferior sagittal, transverse, sigmoid, and straight sinuses are patent. Internal cerebral veins are patent. \nMajor cortical and proximal internal jugular veins are patent. Intracranial arteries opacify normally for phase of study.\n\nOrbits are clear. Mastoid air cells are appropriately aerated.\n\nImpression\nNo intracranial haemorrhage.\nNo dural venous sinus thrombosis.\n\nN. McKay Parry - IR Fellow.\n", "CT/Neuro/06_CT_Temporal_Bones_Facial_Sinus.md": "CT Facial bones\n\nClinical History:\n\n\nTechnique:\nCT facial bones noncontrast.\n\nComparison:\n\n\nFindings:\nNo zygomatic arch, orbital wall, or pterygoid plate fracture. No mandibular or other maxillary fracture. Nasal bone intact. Dentition intact. No temporal bone fracture. Ossicular chain intact. No mastoid air cell effusion. No calvarial fracture. No concerning soft tissue lesion.\n\nNo intracranial haemorrhage. Paranasal sinuses appropriately aerated. \n\nImpression:\nNo craniofacial fracture.\n\nN. McKay Parry - IR Fellow", "CT/Neuro/07_CT_CervicalSpine.md": "CT Spine \u2014 Cervical\n\nClinical History:\n\n\nTechnique:\nCT cervical spine non-contrast.\n\nComparison:\n\n\nFindings:\nNo prevertebral soft tissue swelling. Craniocervical junction is intact. No abnormal widening of the intervertebral disc spaces, facet joints, or spinous processes. No cervical or occipital condyle fracture. Multilevel degenerative changes of the cervical spine.\n\nSoft tissues are unremarkable. Lung apices are clear. Aerodigestive tract is patent. Thyroid gland is unremarkable.\n\nImpression:\nNo cervical vertebral fracture.\n\nN. McKay Parry - IR Fellow.", "CT/Neuro/08_CT_LSSpine.md": "CT Spine \u2014 Thoracic / Lumbar\n\nClinical History\n\n\nTechnique:\nNon-contrast CT of the thoracic/lumbar spine with multiplanar reformats.\n\nComparison:\n\n\nFindings:\nAlignment: Normal. No listhesis.\nVertebral bodies: No fracture.\nDiscs: Preserved disc spaces, no significant degenerative change.\nSpinal canal / neural foramina: Patent.\nParaspinal soft tissues: Normal.\n\nVisualised ribs are intact. Visualised lungs and intra-abdominal structures are unremarkable.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n", "CT/Oncology/21_CT_Oncology_Staging_Restaging.md": "CT Oncology Staging\n\nClinical History:\n    \n\nTechnique:\nCT head pre- and post-contrast.\nCT chest arterial phase.\nCT abdomen and pelvis portal venous phase.\n\nComparison:\n\n\nFindings:\nPrimary -\n\n\nLymph Nodes - \n\n\nMetastases - \n\n\nOther\nNo central pulmonary embolus. No consolidation or pleural effusion. No pericardial effusion.\nThyroid gland is unremarkable. Liver, spleen, pancreas, gallbladder, and adrenals are unremarkable.\nKidneys are within normal limits. No hydronephrosis. Normal CT appearance of the urinary bladder.\nBowel is of normal calibre and wall thickness. \n\nImpression:\n\n\nN. McKay Parry - IR Fellow.", "CT/Trauma/20_CT_Trauma_Pan_Scan.md": "CT Trauma Pan-Scan\n\nClinical History:\n\n\nTechnique:\nTrauma series. \n\nComparison:\n\n\nFindings:\nHead: \nNo intracranial haemorrhage. No midline shift, transtentorial or tonsillar herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Midline (incl sella and pituitary gland) and posterior fossa structures are unremarkable.\n\nOrbits are clear. Mastoid air cells are appropriately aerated. No calvarial or base of skull fracture.\n\nC-spine: \nNo prevertebral soft tissue thickening. Appropriate alignment of the cervical spine. Craniocervical junction is intact. No abnormal widening of IV disc spaces, facet joints, or spinous processes. No cervical vertebral or occipital condyle fracture. Aerodigestive tract is patent. \n\nChest: \nNo pneumothorax or pleural effusion. No pulmonary laceration or contusion. No pericardial effusion. No traumatic aortic injury. No pneumomediastinum. No CT definable oesophageal injury. No subcutaneous emphysema. \n\nNo sternal, clavicular, or scapular fracture. No thoracic vertebral fracture. No rib fracture.\n\nAbdomen/pelvis: \nNo pneumoperitoneum or intra-abdominal free fluid. Liver, spleen, kidneys, adrenals, pancreas, gallbladder are unremarkable. Bladder and remainder of pelvic structures are within normal limits. No discernible bowel or mesenteric injury noting these can be occult on imaging.\n\nNo lumbosacral fracture. Pelvis is intact. No pubic symphysis or SIJ widening. No proximal femoral fracture.\n\nImpression:\nNo intracranial haemorrhage. No skull or cervical vertebral fracture. \nNo thoracic injury.\nNo abdominal injury. \n\nN. McKay Parry - IR Fellow.", "CT/Vascular/19_CT_LowerLimbAngio.md": "CT lower limb angiogram\n\nClinical History:\n\n\nTechnique:\nCT lower limb angiogram.\n\nComparison:\n\n\nFindings:\nAngiogram:\nAbdominal aorta: Normal calibre throughout. No aneurysm.\nIliac arteries: Left and right common/internal/external iliacs are patent. ___ atherosclerotic disease.\nRight Leg: Common/deep/superficial femoral and popliteal arteries are patent. Normal three-vessel runoff. No significant stenosis or occlusion.\nLeft Leg: Common/deep/superficial femoral and popliteal arteries are patent. Normal three-vessel runoff. No significant stenosis or occlusion.\n\nOther:\nVisualised intraabdominal structures are unremarkable. Bowel is of normal calibre and wall thickness. No abdominal or pelvic lymphadenopathy. No concerning bony abnormality.\n\nImpression:\nNo aneurysm or haemodynamically significant stenosis.\n\nN. McKay Parry - IR Fellow.\n", "Generic/Basic.md": "Clinical:\n\n\nFindings:\n\n\nN. McKay Parry - IR Fellow\n", "Generic/Standard.md": "Clinical:\n\n\nTechnique:\n\n\nComparison:\n\n\nFindings:\n\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n", "MRI/Abdomen_Pelvis/14_MRI_Liver_Pancreas_Multiphase.md": "MRI Liver/Pancreas \u2014 Multiphase\n\nClinical:\n\n\nTechnique:\n\n\nComparison:\n\n\nFindings:\nLiver: No morphological features of cirrhosis. No steatosis. No focal hepatic lesion. Portal, splenic, hepatic veins are patent.\n\nBiliary tree: Conventional anatomy. No intrahepatic or extrahepatic biliary dilatation.\n\nGallbladder: No cholelithiasis or pericholecystic fluid.\n\nPancreas: No mass lesion. No pancreatic duct dilation. \n\nSpleen: Normal size. No mass lesion.\n\nAdrenal glands: Unremarkable.\n\nKidneys: No hydronephrosis. No suspicious renal lesion.\n\nBowel/peritoneum: No ascites. \n\nLymph nodes: No lymphadenopathy.\n\nBones/soft tissues: Unremarkable.\n\nComment:\n\n\nN. McKay Parry - Radiologist.\n", "MRI/Abdomen_Pelvis/15_MRI_Pelvis_Female_General.md": "MRI Pelvis \u2014 Female, General\n\nClinical:\n\n\nTechnique:\nMRI pelvis, non-contrast.\n\nComparison:\n\n\nFindings:\nUterus is normal in size, position and zonal anatomy, without focal myometrial or endometrial lesion. Endometrial stripe is within normal limits for age/cycle phase. Cervix is unremarkable. Ovaries are normal in size and signal bilaterally, without adnexal mass. Bladder and rectum are unremarkable. No pelvic side wall or nodal abnormality. No free fluid or pelvic soft tissue mass.\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n", "MRI/Abdomen_Pelvis/16_MRI_Prostate_mpMRI.md": "MRI Prostate (mpMRI)\n\nClinical:\n\n\nTechnique:\nMultiparametric MRI prostate (T2, DWI/ADC, DCE sequences), per PI-RADS protocol.\n\nComparison:\n\n\nFindings:\nProstate gland is normal in size for age, with preserved zonal anatomy. No discrete lesion on T2, DWI/ADC or dynamic contrast-enhanced sequences (PI-RADS 1). No extraprostatic extension, seminal vesicle invasion or capsular breach. Seminal vesicles are unremarkable. No pelvic lymphadenopathy or suspicious osseous lesion within the field of view.\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\n\nChecklist\n- Prostate volume (mL) / PSA density\n- Zonal anatomy assessed (peripheral, transition, central)\n- Lesion(s): location (sector map), size, T2 score, DWI/ADC score, DCE (+/-)\n- Overall PI-RADS category per lesion (1\u20135)\n- Extraprostatic extension\n- Seminal vesicle invasion\n- Neurovascular bundle involvement\n- Pelvic lymph nodes\n- Bones within field of view\n", "MRI/Abdomen_Pelvis/17_MRI_Fistula.md": "MR Fistula (Perianal)\n\nClinical:\n\n\nTechnique:\nMRI pelvis, perianal fistula protocol, non-contrast.\n\nComparison:\n\n\nFindings:\nAnal sphincter complex (internal and external anal sphincters, puborectalis) is intact and normal in signal. No fistulous tract, abscess or collection identified. No perianal inflammatory change.\n\nPrimary tract:\nInternal opening:\nExternal opening:\nSecondary extension / horseshoe tract:\nSphincter involvement (IAS / EAS / puborectalis):\nAbscess / collection:\nInflammatory activity (STIR / post-contrast):\nParks classification:\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\n\nSequence guide\n- Primary tract course \u2014 high-resolution axial T2, axial/coronal STIR or T2 fat-sat\n- Internal / external opening \u2014 axial and coronal T2, STIR\n- Sphincter integrity (IAS/EAS) \u2014 high-resolution axial T2, axial T1\n- Abscess / collection \u2014 STIR, T2 fat-sat, post-contrast T1 fat-sat if given\n- Inflammatory activity / enhancement \u2014 STIR, post-contrast T1 fat-sat\n- Horseshoe / secondary tracts \u2014 axial and coronal STIR or T2 fat-sat\n", "MRI/MSK/10_MRI_Knee.md": "MRI Knee\n\nClinical:\n\n\nTechnique:\nMRI knee, non-contrast.\n\nComparison:\n\n\nFindings:\nMenisci are intact, without tear. Cruciate and collateral ligaments are intact. Extensor mechanism is intact. Articular cartilage is preserved throughout. No bone marrow oedema or fracture. No significant joint effusion. Extra-articular soft tissues are unremarkable.\n\nMenisci:\nLigaments (ACL / PCL / MCL / LCL):\nCartilage:\nBone / marrow:\nExtensor mechanism:\nJoint effusion / synovium:\nExtra-articular soft tissues:\n\nComment:\n\n\nN. McKay Parry - IR Fellow", "MRI/MSK/11_MRI_Shoulder.md": "MRI Shoulder\n\nClinical:\n\n\nTechnique:\nMRI shoulder, non-contrast.\n\nComparison:\n\n\nFindings:\nRotator cuff tendons are intact, without tear or significant tendinosis. Biceps tendon and anchor are intact. Labrum is intact. Acromioclavicular joint is unremarkable. Glenohumeral articular cartilage is preserved. No bone marrow oedema or fracture. No significant subacromial-subdeltoid bursal fluid.\n\nRotator cuff:\nBiceps tendon / anchor:\nLabrum:\nAcromioclavicular joint:\nGlenohumeral cartilage:\nBone / marrow:\nBursae:\n\nComment:\n\n\nN. McKay Parry - IR Fellow", "MRI/MSK/12_MRI_Hip.md": "MRI Hip\n\nClinical:\n\n\nTechnique:\nMRI hip, non-contrast.\n\nComparison:\n\n\nFindings:\nAcetabular and femoral labrum is intact. Articular cartilage is preserved. No bone marrow oedema, fracture or avascular necrosis. Periarticular tendons (iliopsoas, gluteal, hamstring origin) are intact. No significant joint effusion. Extra-articular soft tissues are unremarkable.\n\nLabrum:\nCartilage:\nBone / marrow:\nTendons:\nJoint effusion / synovium:\nExtra-articular soft tissues:\n\nComment:\n\n\nN. McKay Parry - IR Fellow", "MRI/MSK/13_MRI_Wrist.md": "MRI Wrist\n\nClinical:\n\n\nTechnique:\nMRI wrist, non-contrast.\n\nComparison:\n\n\nFindings:\nTriangular fibrocartilage complex is intact. Scapholunate and lunotriquetral ligaments are intact. Carpal bones and distal radius/ulna demonstrate normal marrow signal, without fracture. Flexor and extensor tendons are intact. No significant joint effusion. Extra-articular soft tissues are unremarkable.\n\nTFCC:\nIntrinsic ligaments (SL / LT):\nCarpal bones / marrow:\nTendons:\nJoint effusion / synovium:\nExtra-articular soft tissues:\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\n\nSequence guide\n- TFCC \u2014 coronal PD/T2 fat-sat\n- Intrinsic ligaments \u2014 coronal/axial PD or T2 fat-sat (\u00b1 MR arthrogram)\n- Carpal bones / marrow \u2014 T1, STIR\n- Tendons \u2014 axial T2 fat-sat\n- Joint effusion / synovium \u2014 T2 fat-sat\n- Extra-articular soft tissues \u2014 axial/coronal T2 fat-sat\n", "MRI/Neuro/01_MRI_Brain_NonContrast.md": "MRI Brain \u2014 Non-contrast\n\nClinical:\n\n\nTechnique:\nMRI brain, non-contrast.\n\nComparison:\n\n\nFindings:\nNo abnormal restricted diffusion. No susceptibility artefact to suggest intracranial haemorrhage. No discernible mass, midline shift, transtentorial or tonsiller herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. Major intracranial flow voids are preserved. Sella, pituitary gland and posterior fossa structures are unremarkable. No calvarial marrow signal abnormality.\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n", "MRI/Neuro/02_MRI_Brain_WithContrast.md": "MRI Brain \u2014 With Contrast\n\nClinical:\n\n\nTechnique:\nMRI brain, pre- and post-contrast.\n\nComparison:\n\n\nFindings:\nNo abnormal restricted diffusion. No susceptibility artefact to suggest intracranial haemorrhage. No discernible mass, midline shift, transtentorial or tonsiller herniation. Ventricles and basal cisterns are patent. Grey-white matter differentiation is preserved. No enhancing mass lesion or leptomeningeal enhancement. No enhancing mass lesion.\n\nMajor intracranial flow voids are preserved. Sella, pituitary gland and posterior fossa structures are unremarkable. No calvarial marrow signal abnormality.\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n", "MRI/Neuro/04_MRI_Pituitary_IACs.md": "MRI Pituitary / IACs \u2014 With Contrast\n\nClinical:\n\n\nTechnique:\nMRI pituitary/IACs, pre- and post-contrast.\n\nComparison:\n\n\nFindings:\nPituitary gland is normal in size, signal and enhancement, without discrete adenoma. Pituitary stalk is midline and non-thickened. Optic chiasm is normal in position and signal, without compression. Cavernous sinuses are unremarkable, with no invasion. Internal auditory canals and cerebellopontine angles are symmetric, with no mass and normal enhancement of the facial/vestibulocochlear nerve complexes. No extra-axial collection or abnormal parenchymal signal.\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\nIf mass lesion present: \nPituitary gland: [Normal / mass lesion identified]. Gland measures [___]mm in height (AP x transverse x craniocaudal: [___] x [___] x [___]mm).\n\nLesion characteristics (if present):\n- Location: [___] (midline / lateral / left / right)\n- Size: [___]mm (AP x transverse x craniocaudal)\n- Signal characteristics: [T1 ___, T2 ___]\n- Enhancement pattern: [___] (homogeneous / heterogeneous, relative to normal gland enhancement)\nPituitary stalk: [Midline / deviated toward ___]. Thickness [___]mm.\nOptic chiasm: [No compression / compression noted, distance from lesion ___mm].\nCavernous sinus: [No invasion / invasion of RIGHT/LEFT cavernous sinus, Knosp grade ___].\nSphenoid sinus: [Normal / involved].\nSuprasellar extension: [None / present, extending ___mm above the diaphragma sellae].\nRemainder of brain: [Unremarkable / other findings].", "MRI/Neuro/05_MRI_Brain_MS.md": "MRI Brain \u2014 Multiple Sclerosis\n\nClinical:\n\n\nTechnique:\nMRI brain performed including [T2/FLAIR, T1 pre- and post-contrast, DWI] sequences.\n\nComparison:\n\n\nFindings:\nLesion burden: [___] T2/FLAIR hyperintense lesions identified.\n\nDistribution:\n- Periventricular: [present/absent], [___] lesions, [Dawson's fingers present/absent]\n- Juxtacortical/cortical: [present/absent], [___] lesions\n- Infratentorial (brainstem/cerebellum): [present/absent], [___] lesions\n- Spinal cord (if imaged): [present/absent], [___] lesions\n\nCorpus callosum: [Involved/not involved]. [Thinning/atrophy present/absent].\n\nEnhancement: [___] enhancing lesions identified, pattern [nodular/ring/open-ring], located [___].\n\nChronic lesions (T1 black holes): [Present/absent], [___] in number.\n\nInterval change: [No new lesions / ___ new lesions / ___ enlarging lesions] compared with prior study.\n\nOptic nerves (if assessed): [Normal / signal change or enhancement, side ___].\n\nAtrophy: [None / generalised / focal, e.g., corpus callosum].\n\nOther findings: [___].\n\nComment:\n[___] T2/FLAIR lesions in a [pattern] distribution, [with/without] [___] enhancing lesions, [stable / new lesions] compared with prior imaging.\nFindings [consistent with / not specific for] demyelinating disease.\n\nN. McKay Parry - SMO\n", "MRI/Spine/06_MRI_Spine_Cervical.md": "MRI Spine \u2014 Cervical\n\nClinical:\n\n\nTechnique:\nMRI cervical spine, non-contrast.\n\nComparison:\n\n\nFindings:\nCervical lordosis is maintained. Appropriate marrow signal. Craniocervical junction is unremarkable. Central cord is of normal calibre, no myelomalacia. Paraspinal soft tissues are unremarkable.\n\nC2-3:\nC3-4:\nC4-5:\nC5-6:\nC6-7:\nC7-T1:\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\n\nNormal wording\nNo significant disc disease, canal stenosis or foraminal narrowing.\n\nSequence guide\n- Alignment / vertebral body height \u2014 sagittal T1/T2\n- Vertebral marrow signal (oedema, fracture, lesion) \u2014 sagittal T1, STIR\n- Disc hydration / height (degeneration) \u2014 sagittal T2\n- Disc bulge / protrusion / extrusion \u2014 axial T2, sagittal T2\n- Central canal stenosis \u2014 axial T2, sagittal T2\n- Lateral recess / neural foraminal stenosis \u2014 axial T2, parasagittal T1/T2\n- Facet arthropathy \u2014 axial T2\n- Cord signal (myelomalacia, myelopathy, syrinx) \u2014 sagittal T2, axial T2\n- Paraspinal soft tissues \u2014 axial/sagittal T2, STIR\n", "MRI/Spine/07_MRI_Spine_Thoracic.md": "MRI Spine \u2014 Thoracic\n\nClinical:\n\n\nTechnique:\nMRI thoracic spine, non-contrast.\n\nComparison:\n\n\nFindings:\nAppropriate thoracic spine alignment. Marrow signal is within normal limits. No central cord abnormality. Paraspinal soft tissues are unremarkable.\n\nT1-2:\nT2-3:\nT3-4:\nT4-5:\nT5-6:\nT6-7:\nT7-8:\nT8-9:\nT9-10:\nT10-11:\nT11-12:\nT12-L1:\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\nNormal \nNo significant disc disease, canal stenosis or foraminal narrowing.\n\nSequence guide\n- Alignment / vertebral body height \u2014 sagittal T1/T2\n- Vertebral marrow signal (oedema, fracture, lesion) \u2014 sagittal T1, STIR\n- Disc hydration / height (degeneration) \u2014 sagittal T2\n- Disc bulge / protrusion / extrusion \u2014 axial T2, sagittal T2\n- Central canal stenosis \u2014 axial T2, sagittal T2\n- Lateral recess / neural foraminal stenosis \u2014 axial T2, parasagittal T1/T2\n- Facet arthropathy \u2014 axial T2\n- Cord signal (myelomalacia, myelopathy, syrinx) \u2014 sagittal T2, axial T2\n- Paraspinal soft tissues \u2014 axial/sagittal T2, STIR\n", "MRI/Spine/08_MRI_Spine_Lumbar.md": "MRI Spine \u2014 Lumbar\n\nClinical:\n\n\nTechnique:\nMRI lumbar spine, non-contrast.\n\nComparison:\n\n\nFindings:\nVertebral body heights are maintained. Alignment is preserved. No acute osseous abnormality. The conus terminates normally at the L1/L2 level and demonstrates normal signal. No compression of the cauda equina nerve roots. No epidural collection or other compressive lesion identified.\n\nL1-2:\nL2-3:\nL3-4:\nL4-5:\nL5-S1:\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n\n---\n\nNormal\nNo significant disc bulge, spinal canal stenosis or foraminal narrowing.\n\nSequence guide\n- Alignment / vertebral body height \u2014 sagittal T1/T2\n- Vertebral marrow signal (oedema, fracture, lesion) \u2014 sagittal T1, STIR\n- Conus medullaris level / signal \u2014 sagittal T1/T2\n- Disc hydration / height (degeneration) \u2014 sagittal T2\n- Disc bulge / protrusion / extrusion \u2014 axial T2, sagittal T2\n- Central canal stenosis \u2014 axial T2, sagittal T2\n- Lateral recess / neural foraminal stenosis \u2014 axial T2, parasagittal T1/T2\n- Facet arthropathy \u2014 axial T2\n- Cauda equina / nerve root crowding \u2014 axial T2, sagittal T2\n- Paraspinal soft tissues \u2014 axial/sagittal T2, STIR\n", "MRI/Spine/09_MRI_Whole_Spine.md": "MRI Whole Spine (Screening / Mets)\n\nClinical:\n\n\nTechnique:\nMRI whole spine, non-contrast.\n\nComparison:\n\n\nFindings:\n\n\nComment:\n\n\nN. McKay Parry - IR Fellow\n", "Procedures/Awaiting_Templates/37_Prostate_artery_embolisation.md": "Prostate Artery Embolisation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nLEFT/RIGHT common femoral/radial artery identified and punctured under US guidance.\n\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nCone-beam CT/angiogram performed to define pelvic and prostatic arterial anatomy.\n\nCatheter/microcatheter used to selectively catheterise the LEFT prostatic artery.\nEmbolisation performed to stasis using [___]micron particles.\nProcedure repeated for the contralateral (RIGHT) prostatic artery.\n\nCompletion angiogram confirming satisfactory devascularisation.\nSheath removed and haemostasis achieved with manual pressure/closure device.\n\nPatient tolerated procedure well. No periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\n\nPost-Procedure:\nBed rest for [_] hours, groin/wrist observation as per access site.\nAnalgesia as required.\nMonitor for urinary retention, haematuria or post-embolisation syndrome.\nContinue urinary catheter if in situ as per urology advice.\n\nN. McKay Parry - IR Fellow", "Procedures/Awaiting_Templates/38_Uterine_artery_embolisation.md": "Uterine Artery Embolisation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic (DSA) guidance.\nLEFT/RIGHT common femoral/radial artery identified and punctured under US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nSheath inserted over wire.\nCatheter/microcatheter used to selectively catheterise the LEFT uterine artery, angiogram performed confirming fibroid vascularity.\nEmbolisation performed to stasis using [___]micron particles.\nProcedure repeated for the contralateral (RIGHT) uterine artery.\nCompletion angiogram confirming satisfactory devascularisation.\nSheath removed and haemostasis achieved with manual pressure/closure device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFluoroscopically guided bilateral uterine artery embolisation via the LEFT/RIGHT common femoral/radial artery as described.\n\nPost-Procedure:\nBed rest for [_] hours, groin/wrist observation as per access site.\nRegular analgesia and antiemetics for post-embolisation syndrome.\nMonitor for fever, pain and vaginal discharge.\nDischarge advice regarding expected post-embolisation symptoms.\n\nN. McKay Parry - IR Fellow", "Procedures/Awaiting_Templates/39_TACE.md": "Uterine Artery Embolisation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic (DSA) guidance.\nLEFT/RIGHT common femoral/radial artery identified and punctured under US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nSheath inserted over wire.\nCatheter/microcatheter used to selectively catheterise the LEFT uterine artery, angiogram performed confirming fibroid vascularity.\nEmbolisation performed to stasis using [___]micron particles.\nProcedure repeated for the contralateral (RIGHT) uterine artery.\nCompletion angiogram confirming satisfactory devascularisation.\nSheath removed and haemostasis achieved with manual pressure/closure device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFluoroscopically guided bilateral uterine artery embolisation via the LEFT/RIGHT common femoral/radial artery as described.\n\nPost-Procedure:\nBed rest for [_] hours, groin/wrist observation as per access site.\nRegular analgesia and antiemetics for post-embolisation syndrome.\nMonitor for fever, pain and vaginal discharge.\nDischarge advice regarding expected post-embolisation symptoms.\n\nN. McKay Parry - IR Fellow", "Procedures/Awaiting_Templates/40_SIRT.md": "Uterine Artery Embolisation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic (DSA) guidance.\nLEFT/RIGHT common femoral/radial artery identified and punctured under US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nSheath inserted over wire.\nCatheter/microcatheter used to selectively catheterise the LEFT uterine artery, angiogram performed confirming fibroid vascularity.\nEmbolisation performed to stasis using [___]micron particles.\nProcedure repeated for the contralateral (RIGHT) uterine artery.\nCompletion angiogram confirming satisfactory devascularisation.\nSheath removed and haemostasis achieved with manual pressure/closure device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFluoroscopically guided bilateral uterine artery embolisation via the LEFT/RIGHT common femoral/radial artery as described.\n\nPost-Procedure:\nBed rest for [_] hours, groin/wrist observation as per access site.\nRegular analgesia and antiemetics for post-embolisation syndrome.\nMonitor for fever, pain and vaginal discharge.\nDischarge advice regarding expected post-embolisation symptoms.\n\nN. McKay Parry - IR Fellow", "Procedures/Awaiting_Templates/41_PTC.md": "Uterine Artery Embolisation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic (DSA) guidance.\nLEFT/RIGHT common femoral/radial artery identified and punctured under US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nSheath inserted over wire.\nCatheter/microcatheter used to selectively catheterise the LEFT uterine artery, angiogram performed confirming fibroid vascularity.\nEmbolisation performed to stasis using [___]micron particles.\nProcedure repeated for the contralateral (RIGHT) uterine artery.\nCompletion angiogram confirming satisfactory devascularisation.\nSheath removed and haemostasis achieved with manual pressure/closure device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFluoroscopically guided bilateral uterine artery embolisation via the LEFT/RIGHT common femoral/radial artery as described.\n\nPost-Procedure:\nBed rest for [_] hours, groin/wrist observation as per access site.\nRegular analgesia and antiemetics for post-embolisation syndrome.\nMonitor for fever, pain and vaginal discharge.\nDischarge advice regarding expected post-embolisation symptoms.\n\nN. McKay Parry - IR Fellow", "Procedures/Biopsy/13_US_Biopsy_Generic.md": "US Biopsy\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US guidance.\nTarget lesion identified in the [___].\nTotal [___]ml 1% lignocaine to skin and soft tissue overlying the entry site.\n[___]g core biopsy needle advanced.\n[_] x [_]mm [16/18/20]g cores obtained.\nSamples sent in fresh and formalin.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nUS-guided biopsy of the [___] performed as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Biopsy/14_US_FNA_Thyroid.md": "US FNA Thyroid\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US guidance.\nTotal [___]ml 1% lignocaine to skin and soft tissue overlying the LEFT/RIGHT [__] nodule.\n[_] passes with 25 g needle performed. Cytologist confirmed presence of cells.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nUS-guided FNA as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Biopsy/15_Bone_biopsy.md": "Bone Biopsy\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nTarget lesion identified in the [__].\nTotal [_]ml 1% lignocaine to skin, soft tissue and periosteum overlying the entry site.\n[_]g coaxial needle advanced to the lesion via a [_] approach.\n[_]mm [_]g core sample obtained and sent for pathology in fresh sample pot.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nCT-guided bone biopsy of the [__] as described.\n\nPost-Procedure:\nObserve for signs of infection or bleeding at the biopsy site and notify immediately.\nCan return to ward/discharge following post-procedural and seda sterility adhered to.\nPerformed under US guidance.\nSuitable pocket identified in the RIGHT/LEFT hemithorax.\nTotal 10ml 1% lignocaine to skin and pleura.\n18g needle advanced into the pleural cavity.\n[_] ml sample sent for [biochemistry/cytology/culture]. Wire exchange.\n[___]Fr multipurpose drain inserted via seldinger technique.\nDrain secured to skin and connected to underwater seal, noted to be swinging and bubbling.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nUS-guided chest drain inserted as described.\nDrainage instructions and management as per treating team.\n\nN. McKay Parry - IR Fellow", "Procedures/Drains_Aspiration/22_US_Ascites.md": "US Ascites\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US guidance.\nSuitable pocket of ascites identified in the RIGHT/LEFT lower quadrant.\nTotal 10ml 1% lignocaine to skin and peritoneum overlying the entry site.\n18g needle advanced into the peritoneal cavity. Wire exchange. \n8.5fr multipurpose drain inserted via seldinger technique.\nStraw coloured fluid draining freely. X ml sample sent for pathology.\nDrain secured to skin and connected to drainage bag.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nUS-guided ascites drain as described\nDrainage instructions and management as per treating team.\nDrain clamped for transport.\n\nN. McKay Parry - IR Fellow", "Procedures/Drains_Aspiration/23_CT_Lumbar_Puncture.md": "CT Lumbar Puncture\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance at the L[_]/L[_] level.\nPatient positioned RIGHT/LEFT lateral decubitus.\nTotal [_]ml 1% lignocaine to skin and soft tissue. \n22g spinal needle advanced into thecal sac. \n\nOpening pressure: [_]cmH2O. \n[_]ml CSF collected sequentially and sent for pathology\n\nPatient tolerated procedure well.\nNo periprocedural tragastric position.\nTube secured to skin with external fixation device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFluoroscopically guided exchange of the gastrostomy tube for a [___]Fr tube as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Joint_Nerve_Injections/07_CT_Joint_Injection.md": "CT Joint Injection\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nTotal 1% lignocaine to skin and soft tissue overlying the LEFT/RIGHT [].\n22/25g needle advanced into joint, position confirmed with 2ml contrast.\nDexamethasone (8mg/2ml)/Triamcinolone []mg/1ml and []ml 0.5% bupivacaine injected. \nPatient tolerated procedure well.\nNo periprocedural complication.\n\nComment:\nCT guided steroid injection into the LEFT/RIGHT [] performed.\n\nN. McKay Parry - IR Fellow", "Procedures/Joint_Nerve_Injections/08_CT_Genicular_Block.md": "CT Genicular Block\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nExpected location of the superolateral, superomedial, inferomedial genicular nerves identified.\nTotal 3ml 1% lignocaine to skin and soft tissue overlying each nerve.\n25g needle advanced adjacent to the nerve and 2ml 0.5% marcain injected.\nPatient tolerated procedure well, reports reduction in general pain. \nNo periprocedural complications.\n\nComment:\nDiagnostic block of RIGHT/LEFT genicular nerves performed as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Joint_Nerve_Injections/09_CT_Genicular_Ablation.md": "CT Genicular Ablation\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nLEFT/RIGHT superolateral, superomedial, inferomedial genicular nerves identified.\nTotal 3ml 1% lignocaine to skin and soft tissue overlying each ner cked within the collecting system.\nContrast injected confirming satisfactory catheter position (nephrostogram).\nCatheter secured to skin via 2-0 silk suture and connected to drainage bag.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nLEFT/RIGHT nephrostomy catheter exchange as described.\n\nPost-Procedure:\nTo ward/discharge. \n\nN. McKay Parry - IR Fellow", "Procedures/Spinal_Injections/01_CT_Epidural.md": "CT Epidural\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nTotal 1% lignocaine to skin and soft tissue overlying the LEFT/RIGHT [] level. \n22g spinal needle advanced into the epidural space, position confirmed with 3ml injection of air.\n10ml mixture of 2ml (8mg) dexamethasone, 2ml lignocaine 1% and 6 ml normal saline instilled.\nPatient tolerated procedure well. \nNo periprocedural complication. \n\nComment:\nCT-guided epidural as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Spinal_Injections/02_CT_Facet_Cervical.md": "CT Facet Cervical\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance with a [posterior/anterolateral] approach.\nTotal Xml 1% lignocaine to skin and soft tissue overlying the LEFT/RIGHT [ ] cervical facet.\n22g needle advanced into the joint space.\nTotal 1ml of 50:50 dexamethasone (4mg) and lignocaine 1% injected. \nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nCT-guided cervical facet joint injection as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Spinal_Injections/03_CT_Facet_LS.md": "CT Facet LS\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under CT guidance.\nTotal 1% lignocaine to skin and soft tissue overlying the LEFT/RIGHT [ ] facet. \n22g spinal needle advanced int
