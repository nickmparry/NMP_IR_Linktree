 and soft tissue overlying the entry site.\n22g spinal needle advanced adjacent to the target nerve root. \n[]ml 1% lignocaine, 1ml (4mg) dexamethasone injected.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nComment:\nCT-guided nerve root block injection as described.\n\nN. McKay Parry - IR Fellow", "Procedures/Vascular_Access/24_Femoral_Puncture.md": "Femoral Arterial Access\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\n\nLEFT/RIGHT common femoral artery identified and punctured under direct US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying entry site.\n[_]Fr femoral sheath inserted, heparin [_]units administered via the sheath.\n\n\nSheath removed and haemostasis achieved with manual pressure/closure device [___].\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nFemoral arterial access via the LEFT/RIGHT common femoral artery as described.\n\nPost-Procedure:\nBed rest for [_] hours, leg straight.\nRegular observation of puncture site for bleeding or haematoma.\nMonitor distal limb perfusion, pulses and sensation.\nMobilise after [_] hours if closure device/manual haemostasis satisfactory.\n\nN. McKay Parry - IR Fellow", "Procedures/Vascular_Access/25_Radial_Puncture.md": "Radial Arterial Access\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic/US guidance.\nModified Allen's/Barbeau test confirmed adequate palmar collateral circulation.\nLEFT/RIGHT radial artery identified and punctured under direct US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\n[_]Fr radial sheath inserted, spasmolytic cocktail (5 mg verapamil/100 mcg GTN) and heparin [5000]units administered via the sheath.\n\n\nSheath removed and haemostasis achieved with a radial compression band.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nRadial arterial access via the LEFT/RIGHT radial artery as described.\n\nPost-Procedure:\nRadial band deflated in a stepwise fashion as per protocol.\nMonitor hand perfusion, colour and capillary refill.\nObserve wrist puncture site for bleeding or haematoma.\nEncourage hand movement, avoid heavy lifting with the affected arm for [_] hours.\n\nN. McKay Parry - IR Fellow", "Procedures/Vascular_Intervention/35_IVC_filter_placement.md": "IVC Filter Placement\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US and fluoroscopic guidance.\nRIGHT/LEFT IJV/common femoral approach.\nTotal [___]ml 1% lignocaine to skin and soft tissue.\n18G needle puncture under US guidance, wire exchange and [_]Fr sheath.\n[4Fr]Pigtail catheter advanced into IVC over stiff angle glide wire. \nIVC venogram performed confirming patency, appropriate caval diameter, and level of the renal veins.\n[COOK/DENALI] IVC filter loaded and advanced via the [7]Fr delivery sheath under fluoroscopic guidance.\nFilter deployed immediately below the renal veins. Position confirmed on IVC venogram.\n\nPost-deployment fluoroscopic image confirms satisfactory filter position and configuration.\nSheath removed, haemostasis achieved with manual compression.\nPatient tolerated procedure well. No periprocedural complication.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nIVC filter inserted as described.\n[_] Patient details added to IVC register and retrieval booked for 3 months' time (which can be delayed as required).\n\nPost-Procedure:\nBed rest for [_] hours if femoral approach used.\nPost-sedation observations. \nObserve puncture site for bleeding or haematoma.\n\nN. McKay Parry - IR Fellow", "Procedures/Vascular_Intervention/36_IVC_filter_removal.md": "IVC Filter Removal\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under fluoroscopic guidance.\nLEFT/RIGHT IJV/common femoral vein identified. \nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site prior to puncture with 18G needle.\n[5fr] sheath inserted. Cavogram performed with pigtail catheter, no clot burden.\nSheath upsized to [_]. Filter apex snared and retrieved into the sheath under fluoroscopic guidance.\nCompletion venogram performed.\nSheath removed and haemostasis achieved with manual pressure/closure device.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nTechnically successful IVC filter removal.\n\nPost-Procedure:\nPost-sedation obs as per protocol. \nCan discharge if well. \nMonitor puncture site for swelling/bleeding.\n\nN. McKay Parry - IR Fellow", "Procedures/Venous_Access_Lines/26_PICC_insertion.md": "PICC Insertion\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US guidance.\nLEFT/RIGHT basilic vein identified and punctured under direct US guidance.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the entry site.\nMicropuncture wire, dilation, sheath inserted.\n[___]Fr single/double lumen PICC inserted over wire.\nCatheter tip position confirmed at the cavoatrial junction. Flushing and aspirating freely.\nSecured with statlock and dressing applied.\nPatient tolerated procedure well. No periprocedural complications.\n\nComment:\n[___]Fr PICC via the LEFT/RIGHT basilic vein as described.\nOkay for immediate use.\n\nN. McKay Parry - IR Fellow", "Procedures/Venous_Access_Lines/27_Port_insertion.md": "Port Insertion\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US and fluoroscopic guidance.\nLEFT/RIGHT internal jugular vein identified as appropriate for use. \nTotal [_]ml 1% lignocaine to skin and soft tissue overlying IJV.\nTotal [_]ml 1% lignocaine with adrenaline to soft tissues of the chest wall. \nIJV accessed with 18G needle, guidewire advanced into the IVC.\nPort-a-cath pocket created and catheter tunneled.\n[___]Fr port catheter inserted over guidewire, tip positioned at the cavoatrial junction.\nPort secured in pocket with [_]x 3-0 prolene sutures. \nPort accessed - aspirating and flowing freely. Flushed with saline.\nPocket closed with 3-0 vicryl deep interrupted and running superficial sutures.\nPatient tolerated procedure well. No periprocedural complication.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\n[___]Fr port insertion via the LEFT/RIGHT IJV as described.\n\nPost-Procedure:\nPost-sedation observations as per protocol.\nCan discharge/return to ward if nil concerns. \nPort ready for use.\n\nN. McKay Parry - IR Fellow", "Procedures/Venous_Access_Lines/28_Port_removal.md": "Port Removal\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying the port-a-cath pocket.\nIncision made over the previous scar and the port chamber dissected free from surrounding fibrous tissue. \n[_] x sutures removed in full. Catheter and hub removed.\nPocket closed with 3-0 vicryl deep interrupted and running superficial sutures.\nDressings applied.\nPatient tolerated procedure well. No periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nPost-Procedure:\nPost-sedation observations as per protocol. \nCan discharge if well, no review required.\nSutures are absorbable. \nObserve for signs of bleeding or infection.\n\nN. McKay Parry - IR Fellow", "Procedures/Venous_Access_Lines/29_Hickman_insertion.md": "Hickman Line Insertion\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US and fluoroscopic guidance.\nLEFT/RIGHT IJV appropriate for use.\nTotal [_]ml 1% lignocaine to skin and soft tissue overlying entry and exit sites.\n18G needle advanced into IJV, wire exchange. \n[___]Fr single/double lumen Hickman catheter tunneled. \nCatheter inserted over wire, tip positioned at the cavoatrial junction.\nFree flow and aspiration confirmed from all lumens.\n[_] ml heparin lock each lumen.\nCatheter secured with 2-0 silk suture and dressings applied.\nPatient tolerated procedure well.\nNo periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nLEFT/RIGHT IJV Hickman catheter inserted as described.\nAppropriate for immediate use.\n\nN. McKay Parry - IR Fellow", "Procedures/Venous_Access_Lines/30_Vascath_insertion.md": "Vascath Insertion\n\nClinical:\n\n\nProcedure:\nWritten and verbal consent.\nStandard operating sterility adhered to.\nPerformed under US and fluoroscopic guidance.\nLEFT/RIGHT internal jugular vein identified as appropriate for use. \nTotal [_]ml 1% lignocaine to skin and soft tissue overlying IJV and anterior chest wall.\nTotal [_]ml 1% lignocaine with adrenaline to soft tissues of the chest wall. \nIJV accessed with micropuncture kit and 5Fr sheath inserted. Sheath exchanged for J-wire.\nIncision of anterior chest wall, catheter tunneled to entry site.\nProgressive dilation of entry site up to supplied [_]Fr peel-away sheath. \n[14.5]Fr [x]cm ([x-5]cm to cuff) Vascath inserted with tip in the proximal right atrium.\nBoth lumens flushed and aspirated freely. []ml heparin lock. \nCatheter secured to skin with 2-0 silk suture and dressings applied.\nPatient tolerated procedure well. No periprocedural complications.\n\nAnaesthetic:\nMidazolam [_]mg IV.\nFentanyl [_]mcg IV.\n\nComment:\nLEFT/RIGHT IJV [14.5]Fr vascath inserted as described. Heparin locked. Ready for immediate use.\n\nPost-Procedure:\nPost-sedation observations as per protocol. \nMonitor for bleeding at incision sites. \nNotify concerns.\nLine ready for immediate use.\n\nN. McKay Parry - IR Fellow", "Ultrasound/Abdominal/01_Abdomen_Complete.md": "Clinical History:\n\n\nTechnique:\nAbdominal ultrasound.\n\nComparison:\n\n\nFindings:\nLiver: Normal echotexture. No focal hepatic lesion. No intrahepatic biliary dilatation. Portal and hepatic veins are patent with normal direction of flow.\nGallbladder: Normal wall thickness. No cholelithiasis or pericholecystic fluid. CBD of normal calibre.\nPancreas: Visualised portions unremarkable / obscured by bowel gas.\nSpleen: Normal size (< 13 cm), homogeneous echotexture.\nRight kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nLeft kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nAorta: Normal calibre. \nFree fluid: No free fluid.\n\nImpression:\nNormal complete abdominal ultrasound.\n\nN. McKay Parry - IR Fellow", "Ultrasound/Abdominal/02_Fatty_Liver_Screening.md": "Ultrasound Liver Screening\n\nClinical History:\n\nTechnique:\nGreyscale ultrasound of the liver with assessment of echogenicity relative to the right renal cortex and diaphragm, and posterior beam attenuation.\n\nComparison:\n\nFindings:\nLiver: Diffusely increased echotexture (mild/moderate/severe). Smooth capsular margin. No focal hepatic lesion. No intrahepatic biliary dilatation. Portal and hepatic veins are patent with normal direction of flow. No ascites.\nGallbladder: Normal wall thickness. No cholelithiasis or pericholecystic fluid. CBD of normal calibre.\nPancreas: Visualised portions unremarkable / obscured by bowel gas.\nSpleen: Normal size (< 13 cm), homogeneous echotexture.\nRight kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nLeft kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nAorta: Normal calibre. \n\nImpression:\nDiffuse hepatic steatosis, [mild/moderate/severe] grade, by ultrasound.\nNo focal hepatic lesion.\n\nN. McKay Parry - IR Fellow\n", "Ultrasound/Abdominal/03_Cirrhotic_Liver_Screening.md": "Clinical History:\n\n\nTechnique:\nAbdominal ultrasound.\n\nComparison:\n\n\nFindings:\nLiver: Diffusely increased echotexture (mild/moderate/severe). Nodular capsular margin. No suspicious focal hepatic lesion. No intrahepatic biliary dilatation. Portal and hepatic veins are patent with normal direction of flow. No ascites.\nSpleen: Normal size (< 13 cm), homogeneous echotexture.\nGallbladder: Normal wall thickness. No cholelithiasis or pericholecystic fluid. CBD of normal calibre.\nPancreas: Visualised portions unremarkable / obscured by bowel gas.\nRight kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nLeft kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nAorta: Normal calibre. \n\nImpression:\nCirrhosis without/and portal hypertension. \nNo suspicious hepatic lesion. No portal vein thrombosis. No ascites.\n\nN. McKay Parry - IR Fellow", "Ultrasound/Abdominal/04_Renal.md": "Clinical History\n\n\nTechnique:\nGrayscale ultrasound of both kidneys and bladder, with post-void residual if applicable.\n\nComparison:\n\n\nFindings:\nRight kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nLeft kidney: Good corticomedullary differentiation. No hydronephrosis. No suspicious mass lesion.\nBladder: Normal wall thickness. No masses or calculi. Post-void residual: ___ mL.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow.", "Ultrasound/Abdominal/05_Aorta_AAA.md": "Clinical History:\n\n\nTechnique:\nAbdominal aorta ultrasound.\n\nComparison:\n\n\nFindings:\nProximal aorta: ___ cm AP\nMid aorta: ___ cm AP\nDistal aorta: ___ cm AP\nCommon iliac arteries: Normal calibre bilaterally.\nMural thrombus: None.\n\nImpression:\nNo abdominal aortic aneurysm. Maximum aortic diameter ___ cm.\n\nN. McKay Parry - IR Fellow", "Ultrasound/O&G/09_Pelvis_Female_General.md": "Clinical History:\n\n\nTechnique:\nTransabdominal pelvic ultrasound followed by transvaginal ultrasound following informed consent.\n\nComparison:\n\n\nFindings:\nAnteverted uterus measuring  mm ( cc). Unremarkable myometrium. No fibroid. Endometrial thickness mm. No pelvic free fluid. \n\nRight ovary measures mm ( cc). Physiological follicles and normal vascularity. Right adnexa is unremarkable.\n\nLeft ovary measures mm ( cc). Physiological follicles and normal vascularity. Left adnexa is unremarkable.\n\nImpression\n\n\nN. McKay Parry - IR Fellow", "Ultrasound/O&G/10_First_Trimester.md": "Clinical History:\n\n\nTechnique:\nTransabdominal \u00b1 transvaginal ultrasound.\n\nComparison:\n\n\nFindings:\n\nGestational sac: Intrauterine, located ___. Mean sac diameter ___ mm.\nYolk sac: Present, normal appearance.\nEmbryo/fetal pole: Present. Crown-rump length ___ mm, corresponding to ___ weeks ___ days.\nCardiac activity: Present, fetal heart rate ___ bpm.\n\nRight ovary measures mm ( cc). Physiological follicles and normal vascularity. Right adnexa is unremarkable.\nLeft ovary measures mm ( cc). Physiological follicles and normal vascularity. Left adnexa is unremarkable.\n\nImpression:\nSingle live intrauterine pregnancy at ___ weeks ___ days by CRL.\n\nN. McKay Parry - IR Fellow\n\n\n", "Ultrasound/O&G/Second_trimester.md": "Clinical History:\n\n\nTechnique:\nTransabdominal, transvaginal pelvic ultrasound.\n\nComparison:\n\n\nFindings:\n\n\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n\n\n", "Ultrasound/O&G/Third_trimester.md": "Clinical History:\n\n\nTechnique:\n\n\nComparison:\n\n\nFindings:\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n\n\n", "Ultrasound/Other/11_Thyroid.md": "Clinical History:\n\n\nTechnique:\nThyroid ultrasound\n\nComparison:\n\n\nFindings:\nLeft and right hemithyroid are of normal echotexture and vascularity. No retrosternal extension. \nIsthmus normal thickness. No thyroid nodule. No cervical lymphadenopathy.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow\n", "Ultrasound/Other/12_Scrotum_Testes.md": "Clinical History:\n\n\nTechnique:\nBilateral testes ultrasound.\n\nComparison:\n\n\nFindings:\nRight testis is of normal size and echotexture. Normal vascularity at time of scanning. No focal lesion. Normal appearance of the right epididymis. No right-sided hydrocele, varicocele, or other mass. Scrotal wall of normal thickness.\n\nLeft testis is of normal size and echotexture. Normal vascularity at time of scanning. No focal lesion. Normal appearance of the left epididymis. No left-sided hydrocele, varicocele, or other mass. Scrotal wall of normal thickness.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow", "Ultrasound/Other/13_Soft_Tissue_Mass.md": "Clinical History\n\n\nTechnique\nTargeted study of \n\nComparison\n\n\nFindings\nLocation: ___\nSize: ___ x ___ x ___ cm\nComposition: Cystic / solid / mixed.\nEchogenicity: ___\nMargins: Well-defined / ill-defined.\nVascularity: None / peripheral / internal.\nRelationship to adjacent structures: No/yes invasion of fascial planes, vessels, or nerves.\nCompressibility: Compressible / non-compressible.\n\nImpression\nSoft tissue mass as described, favour benign (e.g., lipoma, sebaceous cyst, ganglion) / indeterminate \u2014 recommend further characterisation with MRI or biopsy if clinically indicated.\n\nN. McKay Parry - IR Fellow\n\nChecklist Before Signing\n- [ ] Cystic vs solid vs mixed\n- [ ] Margins and vascularity\n- [ ] Features concerning for malignancy (irregular margin, heterogeneity, increased/disorganised vascularity, size > 5 cm, deep location)\n- [ ] Relationship to adjacent neurovascular structures\n- [ ] Recommendation for further imaging or biopsy if indeterminate\n", "Ultrasound/Other/14_Hernia.md": "Clinical History\n\n\nTechnique:\nBilateral inguinal/femoral space ultrasound.\n\nComparison:\n\nFindings:\nLeft:\nNo inguinal or femoral hernia.\n\nRight:\nNo inguinal or femoral hernia.\n\nImpression:\n\n\nN. McKay Parry - IR Fellow.\n\n\nChecklist Before Signing\nDefect size: ___ mm.\nContents: Fat / bowel loop / other.\nReducibility: Reduces at rest / reduces with Valsalva / non-reducible.\nBowel viability (if bowel-containing): Normal peristalsis, no wall thickening, no free fluid.\n", "Ultrasound/Transplant/06_Renal_Transplant.md": "Clinical History:\n\n\nTechnique:\nRenal transplant ultrasound.\n\nComparison:\n\n\nFindings:\nTransplant kidney within the RIGHT/LEFT iliac fossa with bipolar length measuring X cm. Appropriate corticomedullary differentiation.\nNo hydronephrosis. No focal renal lesion. No perinephric fluid collection. Renal vein is patent. \nMain renal artery is patent. PSV X cm/s. No tardus parvus waveform at the anastomosis or intrarenal arteries.\nIntrarenal resistive index X (normal 0.6 - 0.7).\n\n\nImpression\nNormal transplant kidney with patent vasculature. No hydronephrosis or perinephric collection.\n\nN. McKay Parry - IR Fellow.", "Ultrasound/Transplant/07_Hepatic_Transplant.md": "Clinical History:\n\n\nTechnique:\nLiver transplant ultrasound.\n\nComparison:\n\n\nFindings\nLiver parenchyma: Normal echotexture. No focal lesion.\nHepatic artery: Patent at the anastomosis and intrahepatic branches. Resistive index ___ (normal > 0.5). No tardus parvus waveform.\nPortal vein: Patent at the anastomosis. Velocity ___ cm/s, antegrade flow.\nHepatic veins / IVC: Patent, normal waveform.\nBiliary tree: No intra- or extrahepatic ductal dilatation. Anastomosis unremarkable.\nPerihepatic space: No fluid collection. No ascites.\n\nImpression\nNormal post-transplant liver ultrasound. Patent hepatic vasculature, no biliary dilatation or perihepatic collection.\n\nN. McKay Parry - IR Fellow.", "Ultrasound/Transplant/08_TIPS_Surveillance.md": "Clinical History:\n\n\nTechnique:\nTIPS surveillance ultrasound.\n\nComparison:\n\n\nFindings:\nTIPS is patent, with normal direction of flow. No thrombosis. Main and intrahepatic portal veins are patent with flow towards the shunt.\nHepatic veins are patent.\nShunt velocity \u2014 proximal (hepatic vein end): ___ cm/s\nShunt velocity \u2014 mid: ___ cm/s\nShunt velocity \u2014 distal (portal vein end): ___ cm/s\n\nImpression\nPatent TIPS with velocities within normal range. No sonographic evidence of shunt stenosis or occlusion.\n\nN. McKay Parry - IR Fellow.\n\nChecklist Before Signing\n- [ ] Velocity recorded at all 3 shunt segments\n- [ ] Focal velocity jet (> institutional threshold) suggesting stenosis\n- [ ] Diffusely low velocity or velocity change > 50 cm/s from baseline\n- [ ] Flow direction in main and intrahepatic portal veins (reversal suggests dysfunction)\n- [ ] Interval change in ascites/splenomegaly since prior study\n- [ ] Comparison with baseline/prior post-TIPS study\n", "Ultrasound/Vascular/15_Carotid_Duplex.md": "Ultrasound Carotid Duplex (Basic)\n\nPatient:\nDOB:\nMRN:\nDate of Study:\nReferring Physician:\n\nTechnique\nCarotid duplex ultrasound.\n\nComparison:\n\n\nFindings\n| Vessel | PSV (cm/s) | Plaque | ICA/CCA ratio |\n|---|---|---|---|\n| Right CCA | | | |\n| Right ICA | | | |\n| Right ECA | | | |\n| Left CCA | | | |\n| Left ICA | | | |\n| Left ECA | | | |\n\nVertebral arteries: Antegrade flow bilaterally.\n\nImpression\nRight ICA stenosis: none / < 50% / 50\u201369% / 70\u201399% / occluded.\nLeft ICA stenosis: none / < 50% / 50\u201369% / 70\u201399% / occluded.\n\nChecklist Before Signing\n- [ ] PSV recorded each vessel\n- [ ] ICA/CCA ratio calculated\n- [ ] Stenosis category stated per institutional criteria (NASCET-based)\n- [ ] Vertebral flow direction (antegrade/retrograde)\n- [ ] Plaque characteristics if relevant to management\n", "Ultrasound/Vascular/16_DVT_Lower_limb.md": "Clinical History:\nQuery DVT.\n\nTechnique:\nLEFT/RIGHT lower limb venous doppler ultrasound.\n\nComparison:\nNo relevant priors.\n\nFindings:\nThe LEFT/RIGHT common femoral, deep femoral, femoral, popliteal, posterior tibial, and peroneal veins are patent with normal flow/compression/augmentation.\n\nImpression\nNo DVT.\n\nN. McKay Parry - IR Fellow", "Ultrasound/Vascular/17_DVT_Upper_limb.md": "Clinical History:\nQuery DVT.\n\nTechnique:\nLEFT/RIGHT upper limb venous doppler ultrasound.\n\nComparison:\nNo relevant priors.\n\nFindings:\nThe LEFT/RIGHT subclavian, axillary, brachial, and superficial veins (basilic/cephalic) are patent with normal flow/compression/augmentation.\n\nImpression\nNo DVT.\n\nN. McKay Parry - IR Fellow", "Ultrasound/Vascular/18_Renal_Artery_Duplex.md": "Clinical: \n\n\nTechnique:\nBilateral renal artery doppler ultrasound.\n\nComparison:\n\n\nFindings\nAorta: \nPSV cm/s: (at level of renal arteries)\n\nRight Kidney:\nBipolar length X cm. Good corticomedullary differentiation. No suspicious mass lesion. No hydronephrosis. No perinephric collection.\nMain renal artery PSV (cm/s) - Proximal: X Distal: X. \nRenal aortic ratio: X (normal < 3.5).\nLow resistance intrarenal waveform.   \nResistive index (RI): X (normal 0.5-0.7).\n\nLeft Kidney:\nBipolar length X cm. Good corticomedullary differentiation. No suspicious mass lesion. No hydronephrosis. No perinephric collection.\nMain renal artery PSV (cm/s) - Proximal: X Distal: X. \nRenal aortic ratio: X (normal < 3.5).\nLow resistance intrarenal waveform.   \nResistive index (RI): X (normal 0.5-0.7).\n\nImpression\nNo sonographic features of renal artery stenosis.\n\n", "Ultrasound/Vascular/19_Dialysis_Fistula_Graft_Duplex.md": "Clinical: \n\n\nTechnique:\nAV fistula ultrasound.\n\nComparison:\n\n\nFindings\nInflow artery: Patent, normal waveform.\nAnastomosis: Patent, PSV ___ cm/s.\nBody of fistula/graft: Patent, PSV ___ cm/s. Volume flow ___ mL/min (if measured).\nOutflow vein: Patent, no stenosis.\nStenosis / thrombus: None identified.\n\nInflow artery: PSV [__] cm/s. No significant stenosis (normal <150% velocity step-up).\n\nAnastomosis: Patent. Diameter measuring [] mm. Peak systolic velocity [__] cm/s.\n\nVolume flow: [__] mL/min (adequate \u2265500-600 mL/min; <400-500 mL/min suggests dysfunction/stenosis risk).\n\nOutflow vein: Patent with normal calibre and compressibility. Peak systolic velocity [__] cm/s. No stenosis (velocity ratio at any focal narrowing <2:1-3:1 compared to adjacent normal segment).\n\nNo thrombus, wall thickening, or perigraft fluid collection.\n\nImpression\n\n\nN. McKay Parry - IR Fellow.\n", "XR/01_XR_Chest.md": "Chest XR\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nCardiomediastinal contours within normal limits. \nLungs are clear, no consolidation, pneumothorax or pleural effusion. \nNo subdiaphragmatic free air. No suspicious bony abnormality.\n\nN. McKay Parry - IR Fellow\n", "XR/02_XR_Abdomen.md": "Abdomen XR\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nBowel gas pattern is unremarkable. No free intraperitoneal air. \nOsseous structures and soft tissues are unremarkable.\n\nN. McKay Parry - IR Fellow\n", "XR/03_XR_Spine_Cervical.md": "XR Spine \u2014 Cervical\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo prevertebral soft tissue thickening.\nVertebral body heights and alignment are maintained. \nNo fracture or destructive osseous lesion.\n\nN. McKay Parry - IR Fellow\n", "XR/04_XR_Spine_Thoracic.md": "XR Spine \u2014 Thoracic\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nVertebral body heights and alignment are maintained. \nNo fracture or destructive osseous lesion. \nDisc spaces are preserved. Paraspinal soft tissues are unremarkable.\n\nN. McKay Parry - IR Fellow\n", "XR/05_XR_Spine_Lumbar.md": "XR Spine \u2014 Lumbar\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nVertebral body heights and alignment are maintained. \nNo fracture or destructive osseous lesion. Disc spaces are preserved. Pedicles and posterior elements are intact. \nParaspinal soft tissues are unremarkable.\n\nN. McKay Parry - IR Fellow\n", "XR/06_XR_Pelvis.md": "XR Pelvis\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo femoral fracture. Pelvis is intact. No pubic symphysis diastasis or discernible SIJ widening. \nSoft tissues are unremarkable. Bowel gas pattern within normal limits.\n\nN. McKay Parry - IR Fellow\n", "XR/07_XR_Shoulder.md": "XR Shoulder\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo humeral fracture or dislocation. \nAcromioclavicular joint is unremarkable. \nVisualised ribs are intact. Visualised lungs are clear.\n\nN. McKay Parry - IR Fellow\n", "XR/08_XR_Elbow.md": "XR Elbow\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo fracture or dislocation. Normal alignment. No joint effusion.\n\nN. McKay Parry - IR Fellow\n", "XR/09_XR_Wrist.md": "XR Wrist\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nCarpal alignment is normal. No fracture or dislocation. Normal alignment.\n\nN. McKay Parry - IR Fellow\n", "XR/10_XR_Hand.md": "XR Hand\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo fracture or dislocation. Normal joint alignment.\n\nN. McKay Parry - IR Fellow\n", "XR/11_XR_Knee.md": "XR Knee\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNormal joint alignment. No fracture or dislocation. No joint effusion.\n\nN. McKay Parry - IR Fellow\n", "XR/12_XR_Ankle.md": "XR Ankle\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNo widening of the ankle mortise. No fracture or dislocation. No joint effusion. Soft tissues are unremarkable.\n\nN. McKay Parry - IR Fellow\n", "XR/13_XR_Foot.md": "XR Foot\n\nClinical:\n\n\nComparison:\n\n\nFindings:\nNormal joint alignment. No widening of the Lisfranc interval. No fracture or dislocation. Joint spaces are preserved.\n\nN. McKay Parry - IR Fellow\n\n"}};

const TEMPLATES_PREFIX = "templates/";
const EXPANDED_KEY = "templatesApp.expanded";

const CONFIG = DATA.config || { pinned: [], columns: [], categoryColors: {} };
let FLAT = [];
let TREE_BY_TOP = {};
let expandedSet = new Set();

function humanize(name) {
  const parts = name.split("_");
  if (parts.length > 1 && /^\d+$/.test(parts[0])) parts.shift();
  return parts.join(" ").replace(/\.md$/i, "");
}

function loadExpanded() {
  try {
    const raw = localStorage.getItem(EXPANDED_KEY);
    if (raw) expandedSet = new Set(JSON.parse(raw));
  } catch (e) { /* ignore */ }
}
function saveExpanded() {
  try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expandedSet])); } catch (e) { /* ignore */ }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function setLastCopied(label, text) {
  const nameEl = document.getElementById("lastCopiedValue");
  if (nameEl) nameEl.textContent = label;
  const textEl = document.getElementById("lastCopiedText");
  if (textEl) textEl.textContent = text;
}

async function copyTemplate(path, label) {
  try {
    const text = DATA.files[path];
    if (text === undefined) throw new Error("not found");
    await navigator.clipboard.writeText(text);
    showToast(`Copied: ${label}`);
    setLastCopied(label, text);
    collapseAll();
  } catch (e) {
    showToast(`Couldn't copy ${label}`);
  }
}

function collapseAll() {
  expandedSet.clear();
  saveExpanded();
  renderColumns();
}

function catClass(top) {
  const color = CONFIG.categoryColors[top] || "gray";
  return `cat-${color}`;
}

function buildTree(paths) {
  const root = {};
  for (const rel of paths) {
    const segments = rel.split("/");
    const fileName = segments[segments.length - 1];

    let node = root;
    let pathSoFar = "";
    for (let i = 0; i < segments.length - 1; i++) {
      const seg = segments[i];
      pathSoFar = pathSoFar ? `${pathSoFar}/${seg}` : seg;
      node.children = node.children || {};
      if (!node.children[seg]) {
        node.children[seg] = { type: "folder", name: humanize(seg), path: pathSoFar, children: {} };
      }
      node = node.children[seg];
    }
    node.children = node.children || {};
    node.children[fileName] = { type: "file", name: humanize(fileName), path: rel };
  }
  return root.children || {};
}

function childrenAsSortedArray(childrenObj) {
  return Object.values(childrenObj).sort((a, b) => {
    if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
}

function flattenFiles(node, top, out) {
  if (node.type === "file") {
    out.push({ name: node.name, path: node.path, category: top });
    return;
  }
  const kids = node.children ? Object.values(node.children) : [];
  for (const k of kids) flattenFiles(k, top, out);
}

function renderRow(node, top, depth) {
  const row = document.createElement("div");
  row.className = "row";

  if (node.type === "folder") {
    const isOpen = expandedSet.has(node.path);
    row.innerHTML = `<span class="chev">&#9656;</span><span class="name">${node.name}</span>`;
    if (isOpen) row.classList.add("expanded");

    const childWrap = document.createElement("div");
    childWrap.className = "children" + (isOpen ? " open" : "");
    const kids = childrenAsSortedArray(node.children || {});
    for (const kid of kids) {
      childWrap.appendChild(renderRow(kid, top, depth + 1));
    }

    row.addEventListener("click", () => {
      const nowOpen = childWrap.classList.toggle("open");
      row.classList.toggle("expanded", nowOpen);
      if (nowOpen) expandedSet.add(node.path); else expandedSet.delete(node.path);
      saveExpanded();
    });

    const wrapper = document.createElement("div");
    wrapper.appendChild(row);
    wrapper.appendChild(childWrap);
    return wrapper;
  } else {
    row.innerHTML = `
      <span class="chev"></span>
      <span class="badge ${catClass(top)}">${top}</span>
      <span class="name">${node.name}</span>
      <span class="copy-hint">click to copy</span>
    `;
    row.addEventListener("click", () => copyTemplate(node.path, node.name));
    return row;
  }
}

function renderBox(containerId, topNames) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  for (const top of topNames) {
    const node = TREE_BY_TOP[top];
    if (!node) continue;
    const header = document.createElement("div");
    header.className = "row";
    const isOpen = expandedSet.has(top);
    if (isOpen) header.classList.add("expanded");
    header.innerHTML = `<span class="chev">&#9656;</span><span class="badge ${catClass(top)}">${top}</span><span class="name" style="font-weight:500;">${node.name}</span>`;

    const isTwoCol = (CONFIG.twoColumnFolders || []).includes(top);
    const childWrap = document.createElement("div");
    childWrap.className = "children" + (isTwoCol ? " two-col" : "") + (isOpen ? " open" : "");
    const kids = childrenAsSortedArray(node.children || {});
    for (const kid of kids) childWrap.appendChild(renderRow(kid, top, 1));

    header.addEventListener("click", () => {
      const nowOpen = childWrap.classList.toggle("open");
      header.classList.toggle("expanded", nowOpen);
      if (nowOpen) expandedSet.add(top); else expandedSet.delete(top);
      saveExpanded();
    });

    el.appendChild(header);
    el.appendChild(childWrap);
  }
}

function renderPinned() {
  const el = document.getElementById("pinnedRow");
  el.innerHTML = "";
  for (const p of (CONFIG.pinned || [])) {
    const btn = document.createElement("div");
    btn.className = "pinned-btn";
    btn.textContent = p.label;
    btn.addEventListener("click", () => copyTemplate(p.path, p.label));
    el.appendChild(btn);
  }
}

function renderColumns() {
  for (const col of (CONFIG.columns || [])) {
    const id = col.box === "left" ? "boxLeft" : col.box === "right" ? "boxRight" : "boxBottom";
    renderBox(id, col.folders);
  }
}

function runSearch(query) {
  const resultsEl = document.getElementById("results");
  const countEl = document.getElementById("resultsCount");
  const columnsWrap = document.getElementById("columnsWrap");

  const q = query.trim().toLowerCase();
  if (!q) {
    resultsEl.classList.remove("show");
    countEl.style.display = "none";
    columnsWrap.classList.remove("hidden");
    return;
  }
  columnsWrap.classList.add("hidden");
  resultsEl.classList.add("show");
  countEl.style.display = "flex";

  const starts = [];
  const contains = [];
  for (const item of FLAT) {
    const lower = item.name.toLowerCase();
    if (lower.startsWith(q)) starts.push(item);
    else if (lower.includes(q)) contains.push(item);
  }
  starts.sort((a, b) => a.name.localeCompare(b.name));
  contains.sort((a, b) => a.name.localeCompare(b.name));
  const matches = [...starts, ...contains].slice(0, 40);

  resultsEl.innerHTML = "";
  if (matches.length === 0) {
    resultsEl.innerHTML = `<div class="empty">No templates match "${query}".</div>`;
  } else {
    for (const item of matches) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="chev"></span>
        <span class="badge ${catClass(item.category)}">${item.category}</span>
        <span class="name">${item.name}</span>
        <span class="copy-hint">click to copy</span>
      `;
      row.addEventListener("click", () => copyTemplate(item.path, item.name));
      resultsEl.appendChild(row);
    }
  }
  countEl.innerHTML = `<span>${matches.length === 40 ? "40+" : matches.length} match${matches.length === 1 ? "" : "es"}</span><span>${FLAT.length} total</span>`;
}

function init() {
  loadExpanded();
  document.getElementById("search").focus();

  const built = buildTree(Object.keys(DATA.files || {}));
  TREE_BY_TOP = built;

  FLAT = [];
  for (const [top, node] of Object.entries(built)) {
    flattenFiles(node, top, FLAT);
  }

  renderPinned();
  renderColumns();
}

document.getElementById("search").addEventListener("input", (e) => runSearch(e.target.value));
document.getElementById("clearBtn").addEventListener("click", () => {
  const input = document.getElementById("search");
  input.value = "";
  runSearch("");
  input.focus();
});
document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = document.querySelector("#results .row");
    if (first) first.click();
  }
  if (e.key === "Escape") {
    document.getElementById("clearBtn").click();
  }
});

init();
</script>
</body>
